<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>ARVEXA School — Hors ligne</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="perf.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --bg-dark: #0A0A0A;
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(var(--safe-top) + 24px) 24px calc(var(--safe-bottom) + 24px);
      text-align: center;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* FOND */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.06) 0%, transparent 60%),
        linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.15;
      animation: glowFloat 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 320px; height: 320px; background: rgba(26, 58, 42, 0.25); top: -100px; right: -100px; }
    .glow-2 { width: 220px; height: 220px; background: rgba(184, 134, 11, 0.08); bottom: -60px; left: -60px; animation-delay: -6s; }

    @keyframes glowFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }

    /* CONTENU */
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 400px;
      animation: fadeIn 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ICÔNE */
    .offline-icon {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .offline-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(184, 134, 11, 0.15) 0%, transparent 70%);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .offline-icon svg {
      width: 72px;
      height: 72px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 16px rgba(224, 184, 74, 0.4));
    }

    .offline-icon svg .wifi-arc {
      stroke: var(--accent-bright);
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: 0;
      animation: wifiFade 3s ease-in-out infinite;
    }

    .offline-icon svg .wifi-arc-1 { animation-delay: 0s; }
    .offline-icon svg .wifi-arc-2 { animation-delay: 0.3s; }
    .offline-icon svg .wifi-arc-3 { animation-delay: 0.6s; }

    @keyframes wifiFade {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.8; }
    }

    .offline-icon svg .wifi-dot {
      fill: var(--accent-bright);
      opacity: 0.3;
    }

    /* TITRE */
    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 700;
      color: var(--text-light);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .title em {
      color: var(--accent-bright);
      font-style: italic;
    }

    /* MESSAGE */
    .message {
      font-size: clamp(14px, 1.8vw, 15px);
      color: var(--text-dim);
      line-height: 1.7;
      max-width: 340px;
      margin-top: -8px;
    }

    /* INFO */
    .info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 20px;
      background: rgba(184, 134, 11, 0.04);
      border: 1px solid rgba(184, 134, 11, 0.12);
      border-radius: 14px;
      margin-top: 8px;
      max-width: 340px;
      width: 100%;
      text-align: left;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .info-item i {
      color: var(--accent-bright);
      font-size: 14px;
      margin-top: 2px;
      flex-shrink: 0;
      width: 16px;
      text-align: center;
    }

    /* BOUTON */
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 4px 20px rgba(184, 134, 11, 0.2);
      margin-top: 12px;
      min-height: 50px;
      position: relative;
      overflow: hidden;
    }

    .btn-retry::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.6s ease;
    }

    .btn-retry:hover::before { left: 100%; }

    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(184, 134, 11, 0.35);
    }

    .btn-retry:active {
      transform: scale(0.97);
    }

    .btn-retry i {
      font-size: 14px;
    }

    /* FOOTER */
    .footer {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 20px);
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 20px;
    }

    .footer span {
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: italic;
      font-weight: 700;
      animation: shimmer 4s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    @media (max-width: 360px) {
      .offline-icon { width: 100px; height: 100px; }
      .offline-icon svg { width: 60px; height: 60px; }
      .title { font-size: 22px; }
      .btn-retry { padding: 12px 24px; font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="container">

    <!-- ICÔNE WIFI OFFLINE ANIMÉE -->
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Point central -->
        <circle class="wifi-dot" cx="12" cy="18" r="1.5"/>
        <!-- Arc 1 (le plus proche) -->
        <path class="wifi-arc wifi-arc-1" d="M 8.5 14.5 A 5 5 0 0 1 15.5 14.5"/>
        <!-- Arc 2 -->
        <path class="wifi-arc wifi-arc-2" d="M 5.5 11.5 A 9 9 0 0 1 18.5 11.5"/>
        <!-- Arc 3 (le plus loin) -->
        <path class="wifi-arc wifi-arc-3" d="M 2.5 8.5 A 13 13 0 0 1 21.5 8.5"/>
        <!-- Barre barrée (hors ligne) -->
        <line x1="3" y1="3" x2="21" y2="21"
              stroke="#B85C3A" stroke-width="2.5" stroke-linecap="round"
              style="filter: drop-shadow(0 0 4px rgba(184,92,58,0.5));"/>
      </svg>
    </div>

    <!-- TITRE -->
    <h1 class="title">
      Pas de <em>connexion</em>
    </h1>

    <!-- MESSAGE -->
    <p class="message">
      Il semble que tu sois hors ligne. Vérifie ta connexion internet et réessaie.
    </p>

    <!-- INFO -->
    <div class="info">
      <div class="info-item">
        <i class="fas fa-lightbulb"></i>
        <span>Vérifie que ton Wi-Fi ou tes données mobiles sont activés</span>
      </div>
      <div class="info-item">
        <i class="fas fa-wifi"></i>
        <span>Essaie de te rapprocher de ta box ou de changer de réseau</span>
      </div>
      <div class="info-item">
        <i class="fas fa-mobile-alt"></i>
        <span>Mode avion désactivé ? Vérifie dans tes réglages</span>
      </div>
    </div>

    <!-- BOUTON RÉESSAYER -->
    <button class="btn-retry" onclick="window.location.reload()">
      <i class="fas fa-sync-alt"></i>
      Réessayer
    </button>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span>ARVEXA School</span> — Préparation BAC
  </div>

  <!-- Font Awesome (chargé depuis le cache) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    // Réessayer automatiquement si la connexion revient
    window.addEventListener('online', () => {
      window.location.reload();
    });

    // Vérifier la connexion toutes les 5 secondes
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);
  </script>

</body>
</html>
