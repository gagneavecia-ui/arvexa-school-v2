<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>ARVEXA — Groupe d'échange</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="perf.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="arvexa-auth-core.js" defer></script>  
  <script src="register-sw.js" defer></script>

  <style>
    :root {
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --success: #2D7D5A;
      --success-light: #3AB67E;
      --danger: #B85C3A;
      --danger-light: #f87171;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --border-soft: rgba(255, 255, 255, 0.05);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --whatsapp-bubble-other: rgba(255, 255, 255, 0.05);
      --whatsapp-bubble-me: rgba(184, 134, 11, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0;
      -webkit-font-smoothing: antialiased;
    }

    .gradient-bg {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26,58,42,.16) 0%, transparent 70%),
        radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184,134,11,.05) 0%, transparent 60%),
        linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      background: rgba(10,10,10,.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184,134,11,.08);
      gap: 12px;
      min-height: 60px;
      z-index: 10;
    }
    .header-left {
      display: flex; align-items: center; gap: 12px;
      min-width: 0; flex: 1;
    }
    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border-soft); background: transparent;
      color: var(--text-dim); cursor: pointer;
      transition: var(--transition); font-size: 15px;
      text-decoration: none; flex-shrink: 0;
    }
    .back-btn:hover {
      border-color: rgba(184,134,11,.2);
      color: var(--accent-bright);
    }
    .header-info {
      display: flex; flex-direction: column; min-width: 0;
    }
    .header-title {
      font-size: 15px; font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--text-light);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header-sub {
      font-size: 11px; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .online-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success-light);
      box-shadow: 0 0 6px var(--success-light);
      animation: pulseOnline 2s ease-in-out infinite;
    }
    @keyframes pulseOnline {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .header-right {
      display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }
    .header-icon-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: var(--transition);
    }
    .header-icon-btn:hover {
      color: var(--accent-bright);
      background: rgba(184,134,11,.08);
    }

    /* ============================================================
       SEARCH BAR
       ============================================================ */
    .search-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      background: rgba(10,10,10,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184,134,11,.08);
      min-height: 60px;
      z-index: 10;
    }
    .search-bar.show { display: flex; }
    .search-bar input {
      flex: 1;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px;
      padding: 9px 14px;
      color: var(--text-light);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }
    .search-bar input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,.06);
    }
    .search-bar input::placeholder {
      color: var(--text-muted);
    }
    .search-bar .search-close {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: var(--transition);
    }
    .search-bar .search-close:hover {
      color: var(--text-light);
      background: rgba(255,255,255,.05);
    }

    /* ============================================================
       MESSAGES CONTAINER
       ============================================================ */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-thumb {
      background: rgba(184,134,11,.2);
      border-radius: 10px;
    }

    /* ============================================================
       MESSAGE WRAPPER
       ============================================================ */
    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: messageSlideIn 0.25s ease-out;
      position: relative;
      transition: transform 0.2s ease;
      will-change: transform;
    }
    .message-wrapper.other { align-self: flex-start; }
    .message-wrapper.me { align-self: flex-end; }

    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message-wrapper .message-sender {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
      margin: 0 4px 2px 4px;
    }
    .message-wrapper .message-sender .avatar-small {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 600;
      color: var(--bg-dark);
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }
    .message-wrapper .message-sender .sender-name { font-weight: 500; }
    .message-wrapper.me .message-sender { display: none; }

    /* ============================================================
       BULLE
       ============================================================ */
    .message-bubble {
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      overflow-wrap: break-word;
      position: relative;
      border: 1px solid transparent;
    }

    .message-wrapper.other .message-bubble {
      background: var(--whatsapp-bubble-other);
      border-color: rgba(255, 255, 255, 0.04);
      border-bottom-left-radius: 4px;
    }

    .message-wrapper.me .message-bubble {
      background: var(--whatsapp-bubble-me);
      border-color: rgba(184, 134, 11, 0.10);
      border-bottom-right-radius: 4px;
    }

    .message-bubble .msg-time {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
      text-align: right;
      opacity: 0.6;
    }
    .message-wrapper.me .message-bubble .msg-time {
      color: var(--accent);
    }

    /* ============================================================
       RÉPONSE — Bandeau de citation dans la bulle
       ============================================================ */
    .message-bubble .reply-quote {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 8px;
      margin: -2px -8px 6px -8px;
      border-left: 3px solid var(--accent);
      background: rgba(184, 134, 11, 0.08);
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .message-bubble .reply-quote:hover {
      background: rgba(184, 134, 11, 0.15);
    }
    .message-bubble .reply-quote .reply-author {
      font-weight: 600;
      color: var(--accent-bright);
      font-size: 10px;
    }
    .message-bubble .reply-quote .reply-content {
      color: var(--text-dim);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .message-wrapper.me .message-bubble .reply-quote {
      border-left-color: var(--accent-bright);
      background: rgba(184, 134, 11, 0.12);
    }

    /* ============================================================
       SWIPE INDICATOR
       ============================================================ */
    .swipe-indicator {
      position: absolute;
      left: -40px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }
    .message-wrapper.other .swipe-indicator {
      left: -40px;
    }
    .message-wrapper.me .swipe-indicator {
      right: -40px;
      left: auto;
    }
    .message-wrapper.swiping .swipe-indicator {
      transform: translateY(-50%) scale(1);
      opacity: 1;
    }
    .message-wrapper.swipe-ready .swipe-indicator {
      background: var(--success-light);
      transform: translateY(-50%) scale(1.15);
    }

    /* Image dans message */
    .message-bubble .msg-image {
      max-width: 220px;
      max-height: 300px;
      border-radius: 12px;
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .message-bubble .msg-image:active {
      transform: scale(0.97);
    }

    /* Message supprimé — ne devrait plus apparaître */
    .msg-deleted {
      font-style: italic;
      color: var(--text-muted);
      font-size: 12px;
      opacity: 0.6;
    }

    /* Surbrillance recherche */
    mark {
      background: rgba(224, 184, 74, 0.4);
      color: var(--text-light);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* Séparateur de jour */
    .day-separator {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin: 12px 0 8px;
      position: relative;
    }
    .day-separator::before,
    .day-separator::after {
      content: '';
      position: absolute; top: 50%;
      width: 30%; height: 1px;
      background: rgba(255,255,255,0.05);
    }
    .day-separator::before { left: 0; }
    .day-separator::after { right: 0; }

    .empty-chat {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty-chat i {
      font-size: 40px;
      margin-bottom: 12px;
      display: block;
      opacity: 0.4;
    }

    .loading-messages {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      gap: 10px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .loading-spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(184,134,11,.15);
      border-top-color: var(--accent-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       REPLY PREVIEW (au-dessus de l'input)
       ============================================================ */
    .reply-preview {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      margin: 0 0 6px 0;
      background: rgba(184, 134, 11, 0.08);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      position: relative;
    }
    .reply-preview.show { display: flex; }
    .reply-preview-info {
      flex: 1;
      min-width: 0;
    }
    .reply-preview-author {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-bright);
      margin-bottom: 2px;
    }
    .reply-preview-content {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reply-preview-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .reply-preview-close:hover {
      background: rgba(255,255,255,.05);
      color: var(--text-light);
    }

    /* ============================================================
       INPUT ZONE
       ============================================================ */
    .input-zone {
      flex-shrink: 0;
      padding: 10px 12px;
      padding-bottom: calc(10px + var(--safe-bottom));
      background: rgba(10,10,10,.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(184,134,11,.08);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      position: relative;
      flex-direction: column;
    }
    .input-zone > .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      width: 100%;
    }

    .input-icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-soft);
      background: rgba(255,255,255,.03);
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: var(--transition);
    }
    .input-icon-btn:hover {
      background: rgba(184,134,11,.08);
      color: var(--accent-bright);
      border-color: rgba(184,134,11,.2);
    }

    .message-input-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px;
      padding: 0 14px;
      min-height: 38px;
      max-height: 38px;
      transition: max-height 0.2s ease;
    }
    .message-input-wrap.multiline {
      max-height: 100px;
      align-items: flex-end;
    }
    .message-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-light);
      font-size: 14px;
      font-family: inherit;
      padding: 9px 0;
      resize: none;
      max-height: 80px;
      line-height: 1.4;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .message-input::-webkit-scrollbar { width: 3px; }
    .message-input::-webkit-scrollbar-thumb {
      background: rgba(184,134,11,.3);
      border-radius: 3px;
    }
    .message-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(184,134,11,.25);
    }
    .send-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(184,134,11,.4);
    }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .send-btn.loading {
      background: linear-gradient(135deg, #888, #555);
    }

    .image-preview {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      padding: 10px 12px;
      background: rgba(20,20,20,.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(184,134,11,.15);
      display: none;
      align-items: center;
      gap: 12px;
    }
    .image-preview.show { display: flex; }
    .image-preview-img {
      width: 60px; height: 60px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(184,134,11,.2);
    }
    .image-preview-info {
      flex: 1;
      font-size: 12px;
      color: var(--text-dim);
    }
    .image-preview-remove {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(184,92,58,.15);
      color: var(--danger-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    /* ============================================================
       MODALE IMAGE PLEIN ÉCRAN
       ============================================================ */
    .image-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.98);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      cursor: zoom-out;
    }
    .image-modal.show {
      opacity: 1;
      visibility: visible;
    }
    .image-modal img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 8px;
      animation: imageZoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      -webkit-user-select: none;
    }
    @keyframes imageZoomIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    .image-modal-close {
      position: absolute;
      top: calc(var(--safe-top) + 16px);
      right: 16px;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: var(--transition);
    }
    .image-modal-close:hover {
      background: rgba(184, 92, 58, 0.3);
      transform: rotate(90deg);
    }

    /* ============================================================
       MODALES CONFIRMATION
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid rgba(184,134,11,.2);
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 420px;
      width: 100%;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-overlay.show .modal-card {
      transform: scale(1);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--text-light);
      margin-bottom: 6px;
      padding-right: 30px;
    }
    .modal-sub {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.03);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .modal-close:hover {
      color: var(--text-light);
      background: rgba(255,255,255,.08);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .modal-btn {
      flex: 1;
      padding: 11px 18px;
      border-radius: 24px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .modal-btn.danger {
      background: linear-gradient(135deg, #D97A3A, #B85C3A);
      color: #fff;
    }
    .modal-btn.cancel {
      background: rgba(255,255,255,.05);
      color: var(--text-dim);

function showToast(message, type = 'info') {

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text || '');
  return div.innerHTML;
}

function highlightText(text, query) {
  const safeText = escapeHtml(text || '');
  if (!query) return safeText;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${escaped})`, 'gi');
  return safeText.replace(regex, '<mark>$1</mark>');
}

function formatTime(timestamp) {
  const date = timestamp?.toDate ? timestamp.toDate() : new Date(timestamp);
  if (isNaN(date.getTime())) return '';
  const now = new Date();
  const diffMs = now - date;
  const diffMin = Math.floor(diffMs / 60000);
  const diffHour = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHour / 24);

  if (diffMin < 1) return 'À l\'instant';
  if (diffMin < 60) return `Il y a ${diffMin} min`;
  if (diffHour < 24) return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  if (diffDay < 7) return date.toLocaleDateString('fr-FR', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function formatDaySeparator(timestamp) {
  const date = timestamp?.toDate ? timestamp.toDate() : new Date(timestamp);
  if (isNaN(date.getTime())) return '';
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const msgDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diffDay = Math.floor((today - msgDay) / (1000 * 60 * 60 * 24));

  if (diffDay === 0) return 'Aujourd\'hui';
  if (diffDay === 1) return 'Hier';
  if (diffDay < 7) return date.toLocaleDateString('fr-FR', { weekday: 'long' });
  return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}

function containsForbiddenWords(text) {

function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) {
      reject(new Error('Le fichier n\'est pas une image'));
      return;
    }
    if (file.size > MAX_IMAGE_SIZE) {
      reject(new Error('Image trop lourde (max 10 Mo)'));
      return;
    }

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;

        if (width > MAX_IMAGE_WIDTH) {
          const ratio = MAX_IMAGE_WIDTH / width;
          width = MAX_IMAGE_WIDTH;
          height = Math.round(height * ratio);
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const base64 = canvas.toDataURL('image/jpeg', IMAGE_QUALITY);

        if (base64.length > MAX_BASE64_SIZE) {
          const base64Lower = canvas.toDataURL('image/jpeg', 0.5);
          if (base64Lower.length > MAX_BASE64_SIZE) {
            reject(new Error('Image trop lourde après compression'));
            return;
          }
          resolve(base64Lower);
        } else {
          resolve(base64);
        }
      };
      img.onerror = () => reject(new Error('Erreur de chargement'));
      img.src = event.target.result;
    };
    reader.onerror = () => reject(new Error('Erreur de lecture'));
    reader.readAsDataURL(file);
  });
}

        <div class="reply-quote" data-reply-id="${msg.replyTo.id}">
          <span class="reply-author">${escapeHtml(msg.replyTo.author || 'Inconnu')}</span>
          <span class="reply-content">${highlightText(replyPreviewText, searchQuery)}</span>
        </div>
      `;
    }

    if (msg.content) {
      bubbleContent += `<div>${highlightText(msg.content, searchQuery)}</div>`;
    }
    if (msg.imageBase64) {
      bubbleContent += `<img src="${msg.imageBase64}" class="msg-image" alt="Image" data-img="${msg.id}">`;
    }

    const senderBlock = !isSelf
      ? `<div class="message-sender">
           <div class="avatar-small" ${msg.userAvatar ? `style="background-image:url('${msg.userAvatar}');"` : ''}>
             ${msg.userAvatar ? '' : initial}
           </div>
           <span class="sender-name">${escapeHtml(msg.userName || 'Anonyme')}</span>
         </div>`
      : '';

    const timeHtml = `<span class="msg-time">${formatTime(msg.createdAt)}</span>`;

    html += `
      <div class="message-wrapper ${isSelf ? 'me' : 'other'}" data-msg-id="${msg.id}">
        <div class="swipe-indicator">
          <i class="fas fa-reply"></i>
        </div>
        ${senderBlock}
        <div class="message-bubble">
          ${bubbleContent}
          ${timeHtml}
        </div>
      </div>
    `;
  });

  messagesContainer.innerHTML = html;
  attachMessageEvents();

  if (!isSearching) {
    const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 150;
    if (isAtBottom) {
      setTimeout(() => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, 50);
    }
  }
}

function attachMessageEvents() {
  messagesContainer.querySelectorAll('.msg-image').forEach(img => {
    img.addEventListener('click', () => openImageModal(img.src));
  });

  messagesContainer.querySelectorAll('.reply-quote').forEach(quote => {
    quote.addEventListener('click', (e) => {
      e.stopPropagation();
      const replyId = quote.dataset.replyId;
      scrollToMessage(replyId);
    });
  });

  messagesContainer.querySelectorAll('.message-wrapper').forEach((msgEl) => {
    const msgId = msgEl.dataset.msgId;
    const messageData = messages.find(m => m.id === msgId);
    if (!messageData) return;

    msgEl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      openMessageMenu(messageData);
    });

    msgEl.addEventListener('touchstart', (e) => {
      longPressTriggered = false;
      longPressTimer = setTimeout(() => {
        longPressTriggered = true;
        if (navigator.vibrate) navigator.vibrate(30);
        openMessageMenu(messageData);
      }, 500);

      swipeStartX = e.touches[0].clientX;
      swipeCurrentX = swipeStartX;
      swipeActiveEl = msgEl;
      swipeActiveId = msgId;
      swipeTriggered = false;
    }, { passive: true });

    msgEl.addEventListener('touchmove', (e) => {
      if (!swipeActiveEl || swipeActiveEl !== msgEl) return;
      swipeCurrentX = e.touches[0].clientX;
      const deltaX = swipeCurrentX - swipeStartX;

      if (Math.abs(deltaX) > 10) {
        clearTimeout(longPressTimer);

        if (Math.abs(deltaX) >= SWIPE_THRESHOLD && !swipeTriggered) {
          swipeTriggered = true;
          if (navigator.vibrate) navigator.vibrate(20);
        }

        const limitedDelta = Math.max(-120, Math.min(120, deltaX));
        msgEl.style.transform = `translateX(${limitedDelta}px)`;
        msgEl.classList.add('swiping');

        if (Math.abs(deltaX) >= SWIPE_TRIGGER) {
          msgEl.classList.add('swipe-ready');
        } else {
          msgEl.classList.remove('swipe-ready');
        }
      }
    }, { passive: true });

    msgEl.addEventListener('touchend', () => {
      clearTimeout(longPressTimer);
      if (!swipeActiveEl || swipeActiveEl !== msgEl) return;

      const deltaX = swipeCurrentX - swipeStartX;
      const shouldReply = Math.abs(deltaX) >= SWIPE_TRIGGER;

      msgEl.style.transform = '';
      msgEl.classList.remove('swiping', 'swipe-ready');
      swipeActiveEl = null;
      swipeActiveId = null;

      if (shouldReply && !longPressTriggered) {
        startReply(messageData);
      }

      swipeStartX = 0;
      swipeCurrentX = 0;
      swipeTriggered = false;
    }, { passive: true });

    msgEl.addEventListener('touchcancel', () => {
      clearTimeout(longPressTimer);
      if (swipeActiveEl) {
        swipeActiveEl.style.transform = '';
        swipeActiveEl.classList.remove('swiping', 'swipe-ready');
      }
      swipeActiveEl = null;
      swipeActiveId = null;
      swipeStartX = 0;
      swipeCurrentX = 0;
      swipeTriggered = false;
    }, { passive: true });
  });
}

function scrollToMessage(msgId) {
  const el = messagesContainer.querySelector(`[data-msg-id="${msgId}"]`);
  if (!el) {
    showToast('Message original introuvable', 'info');
    return;
  }
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.style.transition = 'background 0.3s ease';
  el.style.background = 'rgba(184,134,11,0.2)';
  setTimeout(() => { el.style.background = ''; }, 1200);
}

// ================================================================
function loadMessages() {
  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  const messagesQuery = query(
    collection(db, 'groups', GROUP_ID, 'messages'),
    orderBy('createdAt', 'asc'),
    limit(MAX_MESSAGES)
  );

  unsubscribeMessages = onSnapshot(messagesQuery,
    (snapshot) => {
      messages = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      applySearch();
    },
    (error) => {
      // ✅ C6 — warn
      console.warn('[Groupe] onSnapshot messages:', error.code || error.message);
      if (messagesContainer) {
        messagesContainer.innerHTML = `
          <div class="empty-chat">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Impossible de charger les messages</p>
          </div>
        `;
      }
    }
  );
}

function applySearch() {
  if (!searchQuery || !searchQuery.trim()) {
    filteredMessages = messages;
    isSearching = false;
  } else {
    const q = searchQuery.toLowerCase();
    filteredMessages = messages.filter(m => {
      if (m.content && m.content.toLowerCase().includes(q)) return true;
      if (m.replyTo?.content && m.replyTo.content.toLowerCase().includes(q)) return true;
      if (m.userName && m.userName.toLowerCase().includes(q)) return true;
      return false;
    });
    isSearching = true;
  }
  renderMessages();
}

function startReply(messageData) {
  if (!messageData) return;

  const isImage = !!messageData.imageBase64;
  const content = isImage ? '📷 Photo' : (messageData.content || '');

  currentReply = {
    id: messageData.id,
    author: messageData.userName || 'Anonyme',
    content: content.substring(0, 100),
    type: isImage ? 'image' : 'text'
  };

  if (replyPreviewAuthor) replyPreviewAuthor.textContent = currentReply.author;
  if (replyPreviewContent) replyPreviewContent.textContent = currentReply.content;
  if (replyPreview) replyPreview.classList.add('show');
  if (messageInput) messageInput.focus();

function cancelReply() {

// ================================================================
// ENVOYER
// ================================================================
async function sendMessage() {
  if (!messageInput || !sendBtn) return;

  if (isBanned) {
    showToast('Tu es banni du groupe', 'error');
    return;
  }

  const content = messageInput.value.trim();
  const hasImage = !!pendingImageBase64;

  if (!content && !hasImage) return;

  if (content && containsForbiddenWords(content)) {
    showToast('Message contient des mots interdits', 'error');
    return;
  }

  sendBtn.disabled = true;
  sendBtn.classList.add('loading');

  try {
    const messageData = {
      userId: currentUid,
      userName: currentUserData?.fullName || currentUserData?.firstName || 'Anonyme',
      userEmail: currentUserData?.email || '',
      userAvatar: currentUserData?.profilePicture || null,
      content: content || '',
      createdAt: serverTimestamp()
    };

    if (currentReply) messageData.replyTo = { ...currentReply };
    if (hasImage) {
      messageData.imageBase64 = pendingImageBase64;
      messageData.imageName = pendingImageName || 'image.jpg';
    }

    await addDoc(collection(db, 'groups', GROUP_ID, 'messages'), messageData);

    messageInput.value = '';
    messageInput.style.height = 'auto';
    const wrap = messageInput.closest('.message-input-wrap');
    if (wrap) wrap.classList.remove('multiline');
    pendingImageBase64 = null;
    pendingImageName = '';
    if (imagePreview) imagePreview.classList.remove('show');
    if (imagePreviewImg) imagePreviewImg.src = '';
    if (imageInput) imageInput.value = '';
    cancelReply();
    updateSendButton();

  } catch (error) {
    console.error(error);
    showToast('Erreur: ' + error.message, 'error');
  } finally {
    sendBtn.classList.remove('loading');
    updateSendButton();
  }
}

function updateSendButton() {
  if (!messageInput || !sendBtn) return;
  const hasContent = messageInput.value.trim().length > 0;
  const hasImage = !!pendingImageBase64;
  sendBtn.disabled = (!hasContent && !hasImage) || isBanned;
}

if (messageInput) {
  messageInput.addEventListener('input', () => {
    const wrap = messageInput.closest('.message-input-wrap');
    if (!wrap) return;

    messageInput.style.height = 'auto';
    const newHeight = Math.min(messageInput.scrollHeight, 80);
    messageInput.style.height = newHeight + 'px';

    if (newHeight > 30) {
      wrap.classList.add('multiline');
    } else {
      wrap.classList.remove('multiline');
    }

    updateSendButton();
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
    if (e.key === 'Escape' && currentReply) {
      cancelReply();
    }
  });
}

if (sendBtn) sendBtn.addEventListener('click', sendMessage);

  imageInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];

    if (!file.type.startsWith('image/')) {
      showToast('Le fichier doit être une image', 'error');
      imageInput.value = '';
      return;
    }

    if (file.size > MAX_IMAGE_SIZE) {
      showToast('Image trop lourde (max 10 Mo)', 'error');
      imageInput.value = '';
      return;
    }

    if (imagePreviewInfo) imagePreviewInfo.textContent = 'Compression en cours...';
    if (imagePreview) imagePreview.classList.add('show');
    if (imagePreviewImg) imagePreviewImg.src = URL.createObjectURL(file);

    try {
      const base64 = await compressImage(file);
      pendingImageBase64 = base64;
      pendingImageName = file.name;

      const sizeKB = Math.round(base64.length / 1024);
      if (imagePreviewInfo) imagePreviewInfo.textContent = `${file.name} (${sizeKB} Ko)`;
      if (imagePreviewImg) imagePreviewImg.src = base64;
      updateSendButton();
    } catch (error) {
      showToast(error.message, 'error');
      if (imagePreview) imagePreview.classList.remove('show');
      if (imagePreviewImg) imagePreviewImg.src = '';
      pendingImageBase64 = null;
      pendingImageName = '';
      imageInput.value = '';
    }
  });

    pendingImageName = '';
    if (imagePreview) imagePreview.classList.remove('show');

    if (imageInput) imageInput.value = '';
    updateSendButton();
  });
}

// ================================================================
const msgMenuOverlay = document.getElementById('msgMenuOverlay');
const msgMenuSheet = document.getElementById('msgMenuSheet');

function openMessageMenu(messageData) {
  if (!messageData || !msgMenuOverlay || !msgMenuSheet) return;

  const isAdmin = currentUserData?.email === ADMIN_EMAIL;
  const isSelf = messageData.userId === currentUid;
  const canDelete = isSelf || isAdmin;
  const isAdminMsg = messageData.userEmail === ADMIN_EMAIL;
  const authorName = messageData.userName || 'Anonyme';

  let menuItems = '';

  if (messageData.content) {
    menuItems += `
      <button class="msg-menu-item" data-action="copy">
        <i class="fas fa-copy"></i>
        <span>Copier le texte</span>
      </button>
    `;
  }

  menuItems += `
    <button class="msg-menu-item" data-action="reply">
      <i class="fas fa-reply"></i>
      <span>Répondre</span>
    </button>
  `;

  if (canDelete) {
    menuItems += `
      <button class="msg-menu-item danger" data-action="delete">
        <i class="fas fa-trash"></i>
        <span>Supprimer${isAdmin && !isSelf ? ' (admin)' : ''}</span>
      </button>
    `;
  }

  if (isAdmin && !isAdminMsg) {
    menuItems += `
      <button class="msg-menu-item danger" data-action="ban">
        <i class="fas fa-ban"></i>
        <span>Bannir ${escapeHtml(authorName)}</span>
      </button>
    `;
  }

  if (!menuItems) {
    menuItems = `
      <button class="msg-menu-item" disabled style="opacity: .5; cursor: not-allowed;">
        <i class="fas fa-info-circle"></i>
        <span>Aucune action disponible</span>
      </button>
    `;
  }

  msgMenuSheet.innerHTML = `
    <div class="msg-menu-title">Message de ${escapeHtml(authorName)}</div>
    ${menuItems}
    <button class="msg-menu-cancel" id="msgMenuCancel">Annuler</button>
  `;

  msgMenuOverlay.classList.add('show');

  msgMenuSheet.querySelectorAll('.msg-menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      closeMessageMenu();

      if (action === 'copy') copyMessageText(messageData.content);
      else if (action === 'reply') startReply(messageData);
      else if (action === 'delete') deleteMessage(messageData.id);
      else if (action === 'ban') banUser(messageData.userId, messageData.userName);
    });
  });

  const cancelBtn = document.getElementById('msgMenuCancel');
  if (cancelBtn) cancelBtn.addEventListener('click', closeMessageMenu);
}

function closeMessageMenu() {
  if (msgMenuOverlay) msgMenuOverlay.classList.remove('show');
}

if (msgMenuOverlay) {
  msgMenuOverlay.addEventListener('click', (e) => {
    if (e.target === msgMenuOverlay) closeMessageMenu();
  });
}

async function copyMessageText(text) {
  if (!text) return;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    showToast('Texte copié', 'success');
  } catch (e) {
    showToast('Impossible de copier', 'error');
  }
}

// ================================================================
// ✅ C4 — LOAD USER DATA avec gestion blocked/paused
// ================================================================
function loadUserData(user) {
  if (unsubscribeUser) {
    unsubscribeUser();
    unsubscribeUser = null;
  }

  const userRef = doc(db, 'users', user.uid);
  unsubscribeUser = onSnapshot(userRef,
    async (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        currentUserData = data;

        // ✅ C4 — Gestion blocked/paused (initial + à chaque changement)
        if (data.accountStatus === 'blocked') {
          try { sessionStorage.setItem('arvexa_account_blocked', '1'); } catch (e) {}
          if (unsubscribeUser) { unsubscribeUser(); unsubscribeUser = null; }
          if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
          if (unsubscribeBanCheck) { unsubscribeBanCheck(); unsubscribeBanCheck = null; }
          clearSession();
          try { await signOut(auth); } catch (e) {}
          window.location.replace('auth-choice.html');
          return;
        }

        if (data.accountStatus === 'paused') {
          showToast('Ton compte est temporairement en pause. Contacte le support.', 'error');
          // On laisse la consultation mais on désactive l'envoi
          isBanned = true;  // Utilise le même mécanisme pour bloquer l'envoi
          if (bannedOverlay) bannedOverlay.classList.remove('show');
          updateSendButton();
        }

        try {
          localStorage.setItem(USER_DATA_KEY, JSON.stringify({
            ...data,
            _uid: user.uid,
            _cachedAt: Date.now()
          }));
        } catch (e) {}
      }
    },
    (error) => {
      // ✅ C6 — warn
      console.warn('[Groupe] onSnapshot user:', error.code || error.message);
      try {
        const cached = JSON.parse(localStorage.getItem(USER_DATA_KEY) || '{}');
        if (cached && Object.keys(cached).length > 0) currentUserData = cached;
      } catch (e) {}
    }
  );
}

// ================================================================
// AUTH ROBUSTE — ✅ C1/C7
// ================================================================
// ✅ C1 — préserver redirectAfterLogin + URL complète
function redirectToLogin() {
  if (isRedirecting) return;
  isRedirecting = true;

  if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
  if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
  if (authUnsubscribe) { try { authUnsubscribe(); } catch (e) {} authUnsubscribe = null; }

  try {
    const existing = sessionStorage.getItem('redirectAfterLogin')
                  || sessionStorage.getItem('redirectAfterAuth');
    if (!existing) {
      sessionStorage.setItem('redirectAfterLogin',
        window.location.pathname + window.location.search + window.location.hash);
    }
  } catch (e) {}

  window.location.replace('login.html');
}

function initAuthGuard(onAuthenticated) {
  if (authUnsubscribe) return;

  authUnsubscribe = onAuthStateChanged(auth, (user) => {
    if (isAuthResolved) {
      if (user && user.uid !== currentUid) {
        currentUid = user.uid;
        currentUser = user;
        saveSession(user);
        onAuthenticated(user);
      } else if (!user && currentUid) {
        currentUid = null;
        currentUser = null;
        clearSession();
        redirectToLogin();
      }
      return;
    }

    if (!user) {
      if (graceTimer) return;
      graceTimer = setTimeout(() => {
        graceTimer = null;
        if (isAuthResolved) return;
        if (auth.currentUser) return;

        const hasSession = localStorage.getItem(SESSION_KEY);
        const hasUserData = localStorage.getItem(USER_DATA_KEY);

        if ((hasSession || hasUserData) && !navigator.onLine) {
          setTimeout(() => {
            if (auth.currentUser) return;
            if (!isAuthResolved) redirectToLogin();
          }, 1500);
          return;
        }

        if (hasSession && hasUserData) {
          setTimeout(() => {
            if (auth.currentUser) return;
            if (!isAuthResolved) redirectToLogin();
          }, 1500);
          return;
        }

        redirectToLogin();
      }, 600);
      return;
    }

    if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
    if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }

    isAuthResolved = true;
    currentUid = user.uid;
    currentUser = user;
    saveSession(user);
    onAuthenticated(user);
  });

  maxTimer = setTimeout(() => {
    if (isAuthResolved) return;
    if (auth.currentUser) {
      isAuthResolved = true;
      currentUid = auth.currentUser.uid;
      currentUser = auth.currentUser;
      saveSession(auth.currentUser);
      onAuthenticated(auth.currentUser);
    } else {
      redirectToLogin();
    }
  }, 5000);
}

  if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
  if (authUnsubscribe) { try { authUnsubscribe(); } catch (e) {} authUnsubscribe = null; }
  if (unsubscribeMessages) { try { unsubscribeMessages(); } catch (e) {} unsubscribeMessages = null; }
  if (unsubscribeUser) { try { unsubscribeUser(); } catch (e) {} unsubscribeUser = null; }
  if (unsubscribeBanCheck) { try { unsubscribeBanCheck(); } catch (e) {} unsubscribeBanCheck = null; }
});
