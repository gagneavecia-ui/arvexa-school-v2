function openNewChapterModal(subject) {
  const info = SUBJECTS[subject];

  openModal(`
    <div class="modal">
      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="modal-head">
        <h2>Nouveau chapitre</h2>
        <p>${info.emoji} ${escapeHtml(info.label)}</p>
      </div>

      <div class="form-field">
        <label class="form-label">Titre du chapitre</label>
        <input type="text" class="form-input" id="newChapterTitle" placeholder="Ex : Nombres complexes" maxlength="100">
      </div>

      <button class="btn-full primary" id="createChapterBtn" disabled>
        <span class="btn-icon"><i class="fas fa-plus"></i></span>
        <span class="btn-text">Créer</span>
        <span class="spinner"></span>
      </button>
    </div>
  `);

  const input = $('newChapterTitle');
  const btn = $('createChapterBtn');

  input.addEventListener('input', () => { btn.disabled = input.value.trim().length < 2; });

  btn.addEventListener('click', async () => {
    const title = input.value.trim();
    if (title.length < 2) return;
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      await callApi('createChapter', { subject, title });
      showToast('Chapitre créé', 'success');
      delete state.cache.chapters[subject];
      closeModal();
      applyRoute({ view: 'notebook', params: { subject } });
    } catch (e) {
      showToast('Erreur : ' + e.message, 'error');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });

  setTimeout(() => input.focus(), 200);
}

// ═══════════════════════════════════════════════════════════════
// MODALE AJOUT SECTION
// ═══════════════════════════════════════════════════════════════
function openAddSectionModal(subject, chapterId) {
  const info = SUBJECTS[subject];

  const tabsHtml = SYMBOL_GROUPS.map((g, i) =>
    `<button type="button" class="symbols-tab ${i === 0 ? 'active' : ''}" data-tab="${i}">${escapeHtml(g.name)}</button>`
  ).join('');

  const gridsHtml = SYMBOL_GROUPS.map((g, i) =>
    `<div class="symbols-grid" data-grid="${i}" style="${i === 0 ? '' : 'display:none;'}">
      ${g.symbols.map((sym) =>
        `<button type="button" class="symbol-btn" data-symbol="${escapeHtml(sym)}">${sym}</button>`
      ).join('')}
    </div>`
  ).join('');

  openModal(`
    <div class="modal">
      <button class="modal-close"><i class="fas fa-times"></i></button>
      <div class="modal-head">
        <h2>Ajouter une section</h2>
        <p>${info.emoji} ${escapeHtml(info.label)} — Colle la partie étudiée</p>
      </div>

      <div class="form-field">
        <label class="form-label">Contenu</label>

        <button type="button" class="symbols-toggle" id="symbolsToggle">
          <span class="fx">ƒx</span>
          <span>Symboles</span>
          <i class="fas fa-chevron-down chev"></i>
        </button>

        <div class="symbols-panel" id="symbolsPanel">
          <div class="symbols-panel-inner">
            <div class="symbols-tabs">${tabsHtml}</div>
            ${gridsHtml}
          </div>
        </div>

        <textarea class="form-textarea" id="sectionBody" placeholder="Colle ici la partie du cours que tu viens d'étudier." maxlength="${MAX_CONTENT_LENGTH}"></textarea>
        <div class="char-counter" id="sectionCounter">0 / ${MAX_CONTENT_LENGTH}</div>
      </div>

      <button class="btn-full primary" id="sectionSubmitBtn" disabled>
        <span class="btn-icon"><i class="fas fa-wand-magic-sparkles"></i></span>
        <span class="btn-text">Analyser avec l'IA</span>
        <span class="spinner"></span>
      </button>
    </div>
  `);

  const body = $('sectionBody');
  const counter = $('sectionCounter');
  const submitBtn = $('sectionSubmitBtn');
  const toggle = $('symbolsToggle');
  const panel = $('symbolsPanel');

  function updateReady() {
    const len = body.value.trim().length;
    submitBtn.disabled = len < MIN_CONTENT_LENGTH;
    counter.textContent = `${body.value.length} / ${MAX_CONTENT_LENGTH}`;
  }

  body.addEventListener('input', updateReady);

  toggle.addEventListener('click', () => {
    panel.classList.toggle('open');
    toggle.classList.toggle('active');
  });

  document.querySelectorAll('.symbols-tab').forEach((tab) => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      const idx = tab.dataset.tab;
      document.querySelectorAll('.symbols-tab').forEach((t) => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.symbols-grid').forEach((g) => {
        g.style.display = g.dataset.grid === idx ? 'grid' : 'none';
      });
    });
  });

  document.querySelectorAll('.symbol-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const symbol = btn.dataset.symbol;
      const start = body.selectionStart || 0;
      const end = body.selectionEnd || 0;
      const value = body.value;
      body.value = value.slice(0, start) + symbol + value.slice(end);
      const newPos = start + symbol.length;
      body.setSelectionRange(newPos, newPos);
      body.focus();
      updateReady();
    });
  });

  submitBtn.addEventListener('click', async () => {
    const rawInput = body.value.trim();
    if (rawInput.length < MIN_CONTENT_LENGTH) {
      showToast(`Contenu trop court (min ${MIN_CONTENT_LENGTH} caractères)`, 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.add('loading');

    const container = $('view-section');
    const infoLocal = SUBJECTS[subject];
    document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
    container.classList.add('active');
    const cleanupProgress = showGeneratingState(container, infoLocal?.profile || 'scientific');

    try {
      closeModal();
      const result = await callApi('createSection', { subject, chapterId, rawInput });
      cleanupProgress();
      showToast('Section analysée', 'success');
      delete state.cache.chapter[`${subject}/${chapterId}`];
      applyRoute({ view: 'section', params: { subject, chapterId, sectionId: result.sectionId } });
    } catch (e) {
      cleanupProgress();
      if (e.code === 'FREE_SECTION_LIMIT') {
        showPremiumModal();
        applyRoute({ view: 'chapter', params: { subject, chapterId } });
      } else {
        showToast('Erreur : ' + e.message, 'error', 5000);
        applyRoute({ view: 'chapter', params: { subject, chapterId } });
      }
    }
  });

  setTimeout(() => body.focus(), 200);
}

function isUserPremium(data) {
  if (!data) return false;
  const status = data.subscriptionStatus || 'none';
  if (status === 'pending') return false;

  const hasPremium = data.premium === true ||
                     data.isUnlocked === true ||
                     data.hasDeposited === true;

  const end = data.subscriptionEndDate?.toDate?.() ||
    (data.subscriptionEndDate?.seconds ? new Date(data.subscriptionEndDate.seconds * 1000) : null);

  if (hasPremium && end) return end.getTime() > Date.now();
  if (status === 'expired') return false;
  if (hasPremium && !end) return true;
  return false;
}

function updatePremiumBadge() {
  const badge = $('premiumBadge');
  if (state.isPremium) badge.classList.add('show');
  else badge.classList.remove('show');
}

// ═══════════════════════════════════════════════════════════════
// TRACKING TEMPS D'ÉTUDE
// ═══════════════════════════════════════════════════════════════
let studyLastSync = Date.now();
const STUDY_SYNC_INTERVAL_MS = 2 * 60 * 1000;

async function syncStudyTime(reason = 'heartbeat') {
  if (!state.user) return;

  const now = Date.now();
  const elapsed = now - studyLastSync;
  const minutes = Math.floor(elapsed / 60000);

  if (minutes < 1) return;

  const minutesToSend = Math.min(120, minutes);
  studyLastSync = now;

  try {
    await callApi('trackStudyTime', { minutes: minutesToSend });
    console.log(`[STUDY] +${minutesToSend} min (${reason})`);
  } catch (e) {
    studyLastSync = now - (minutesToSend * 60000);
    console.warn('[STUDY] sync failed:', e.message);
  }
}

setInterval(() => {
  if (document.visibilityState === 'visible') {
    syncStudyTime('heartbeat');
  }
}, STUDY_SYNC_INTERVAL_MS);

window.addEventListener('beforeunload', () => {
  const elapsed = Date.now() - studyLastSync;
  const minutes = Math.floor(elapsed / 60000);
  if (minutes >= 1 && state.user) {
    const cachedToken = sessionStorage.getItem('arvexa_id_token');
    if (cachedToken) {
      fetch('/api/progress', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${cachedToken}`
        },
        body: JSON.stringify({ action: 'trackStudyTime', minutes: Math.min(120, minutes) }),
        keepalive: true
      }).catch(() => {});
    }
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    syncStudyTime('hidden');
  } else if (document.visibilityState === 'visible') {
    studyLastSync = Date.now();
  }
});

async function cacheToken() {
  if (!state.user) return;
  try {
    const token = await getIdToken(state.user);
    sessionStorage.setItem('arvexa_id_token', token);
  } catch (_) {}
}

setInterval(cacheToken, 30 * 60 * 1000);

// AUTH
// ═══════════════════════════════════════════════════════════════
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace('login.html');
    return;
  }
  state.user = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      state.userData = snap.data();
      state.isPremium = isUserPremium(state.userData);
    }
  } catch (_) {}

  updatePremiumBadge();
  applyRoute(routeFromHash());

  if (!window.location.hash) {
    window.history.replaceState(null, '', '#/notebooks');
  }

  cacheToken();
});
