<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>ARVEXA — Mon cahier</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/contrib/auto-render.min.js"></script>
<script src="katex-utils.js" defer></script>
<style>
:root {
  --accent: #B8860B;
  --accent-bright: #E0B84A;
  --success-light: #3AB67E;
  --danger: #B85C3A;
  --danger-light: #E07A5F;
  --info: #4AAFE0;
  --bg-dark: #0A0A0A;
  --card-bg: rgba(20, 20, 20, 0.6);
  --card-border: rgba(255, 255, 255, 0.06);
  --block-bg: rgba(0, 0, 0, 0.25);
  --text-light: #F5F0E8;
  --text-dim: #8A8A7A;
  --text-muted: #5A5A4A;
  --text-body: #cfd0cc;
  --transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg-dark); color-scheme: dark; min-width: 320px; width: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26, 58, 42, 0.16) 0%, transparent 70%),
    radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
    linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
  color: var(--text-light);
  font: 15px/1.6 'Inter', system-ui, sans-serif;
  padding-top: var(--safe-top);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
button:disabled { cursor: not-allowed; opacity: 0.55; }

.header {
  position: sticky; top: 0; flex-shrink: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: rgba(10, 10, 10, 0.94);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--card-border);
  min-height: 60px;
}
.header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--card-border); background: transparent;
  color: var(--text-dim); transition: var(--transition); font-size: 14px; flex-shrink: 0;
}
.back-btn:hover { border-color: rgba(224, 184, 74, 0.3); color: var(--accent-bright); }
.back-btn.hidden { display: none; }

.page-title {
  display: flex; align-items: center; gap: 9px;
  font-size: 15px; font-weight: 700;
  font-family: 'Playfair Display', serif;
  color: var(--text-light);
  letter-spacing: -0.01em;
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.page-title .emoji { font-size: 16px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--card-border); background: transparent;
  color: var(--text-dim); transition: var(--transition); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { border-color: rgba(224, 184, 74, 0.3); color: var(--accent-bright); }

.premium-badge {
  display: none;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.15), rgba(184, 134, 11, 0.08));
  border: 1px solid rgba(224, 184, 74, 0.3);
  color: var(--accent-bright);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.premium-badge.show { display: flex; }
.premium-badge i { font-size: 11px; }

main {
  flex: 1 1 auto; width: 100%; max-width: 820px;
  margin: 0 auto; padding: 20px 16px 60px;
}

.view { display: none; }
.view.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.greeting { margin-bottom: 20px; }
.greeting h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 700; color: var(--text-light);
  line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 6px;
}
.greeting h1 em { color: var(--accent-bright); font-style: italic; }
.greeting p { color: var(--text-dim); font-size: 14px; }

.streak-card {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 20px; border-radius: 14px;
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.08), rgba(26, 58, 42, 0.05));
  border: 1px solid rgba(224, 184, 74, 0.22);
  margin-bottom: 26px;
  position: relative; overflow: hidden;
}
.streak-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
}
.streak-icon {
  font-size: 32px; line-height: 1;
  filter: drop-shadow(0 2px 6px rgba(224, 184, 74, 0.3));
}
.streak-content { flex: 1; min-width: 0; }
.streak-value {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 700;
  color: var(--accent-bright); line-height: 1.1;
}
.streak-label { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

.section-title {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Playfair Display', serif;
  font-size: 17px; font-weight: 700;
  color: var(--text-light);
  margin: 24px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--card-border);
  position: relative;
}
.section-title::after {
  content: ''; position: absolute; bottom: -1px; left: 0;
  width: 40px; height: 2px; background: var(--accent-bright);
}
.section-title i { color: var(--accent-bright); font-size: 14px; }
.section-title .count {
  margin-left: auto;
  font-family: 'Inter', sans-serif;
  font-size: 11px; color: var(--text-muted);
  font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em;
}

.subjects-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
}
@media (min-width: 620px) { .subjects-grid { grid-template-columns: repeat(3, 1fr); } }

.subject-card {
  padding: 18px 16px; border-radius: 14px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  cursor: pointer; transition: var(--transition);
  display: flex; flex-direction: column; gap: 10px;
  text-align: left; width: 100%;
}
.subject-card:hover {
  border-color: rgba(224, 184, 74, 0.25);
  transform: translateY(-2px);
}
.subject-card .subject-emoji { font-size: 26px; line-height: 1; }
.subject-card .subject-name {
  font-size: 14px; font-weight: 700;
  color: var(--text-light); letter-spacing: -0.01em;
}
.subject-card .subject-meta { font-size: 11.5px; color: var(--text-muted); }

.list { display: flex; flex-direction: column; gap: 10px; }
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 14px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  transition: var(--transition);
  text-align: left; width: 100%; position: relative;
}
.list-item:hover { border-color: rgba(224, 184, 74, 0.25); }

.list-item-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  background: rgba(224, 184, 74, 0.1);
  color: var(--accent-bright);
  border: 1px solid rgba(224, 184, 74, 0.15);
}
.list-item-body { flex: 1; min-width: 0; cursor: pointer; }
.list-item-title {
  font-size: 14.5px; font-weight: 700;
  color: var(--text-light);
  margin-bottom: 4px; line-height: 1.3;
}
.list-item-meta {
  font-size: 12px; color: var(--text-muted);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.list-item-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); }
.list-item-arrow {
  color: var(--text-muted); font-size: 13px;
  flex-shrink: 0; cursor: pointer; padding: 8px;
  transition: var(--transition);
}
.list-item:hover .list-item-arrow { color: var(--accent-bright); }

.list-item-delete {
  color: var(--text-muted); font-size: 13px;
  flex-shrink: 0; padding: 8px 10px;
  border-radius: 8px; transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid transparent;
}
.list-item-delete:hover {
  color: #ff9a84;
  background: rgba(184, 92, 58, 0.08);
  border-color: rgba(184, 92, 58, 0.2);
}

.list-item.new {
  background: transparent;
  border: 1px dashed rgba(224, 184, 74, 0.25);
  justify-content: center; color: var(--accent-bright);
  font-weight: 700; font-size: 14px;
  gap: 10px;
}
.list-item.new:hover { background: rgba(224, 184, 74, 0.05); border-style: solid; }
.list-item.new .list-item-icon {
  background: transparent; border: none;
  width: 24px; height: 24px; font-size: 16px;
}

.page-hero {
  padding: 20px 22px; border-radius: 14px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  margin-bottom: 20px;
}
.page-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700; color: var(--text-light);
  margin-bottom: 6px; letter-spacing: -0.02em;
  line-height: 1.2;
}
.page-hero .hero-sub { color: var(--text-dim); font-size: 13px; }

.cta-card {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 15px 20px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: #0A0A0A; font-weight: 700; font-size: 14px;
  border: none; margin-bottom: 20px;
  transition: var(--transition);
  box-shadow: 0 4px 14px rgba(184, 134, 11, 0.2);
}
.cta-card:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(184, 134, 11, 0.35); }
.cta-card i { font-size: 13px; }

.section-hero { margin-bottom: 20px; }
.section-hero .breadcrumb {
  font-size: 12px; color: var(--text-muted); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.section-hero .breadcrumb .sep { opacity: 0.5; }
.section-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700; color: var(--text-light);
  line-height: 1.2; letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.section-hero .sub { font-size: 12.5px; color: var(--text-muted); }

.content-section { margin-bottom: 24px; }
.content-section-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 11.5px; font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}
.content-section-title i { color: var(--accent-bright); font-size: 12px; }
.content-section-title .count { margin-left: auto; color: var(--text-muted); font-weight: 600; }

.raw-input {
  padding: 16px 18px; border-radius: 12px;
  background: var(--block-bg);
  border: 1px solid var(--card-border);
  font-size: 13.5px; color: var(--text-body);
  line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
  max-height: 200px; overflow: hidden; position: relative;
}
.raw-input.expanded { max-height: none; }

.expand-btn {
  margin-top: 8px; padding: 7px 14px; border-radius: 20px;
  background: transparent; border: 1px solid var(--card-border);
  color: var(--accent-bright); font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: var(--transition);
}
.expand-btn:hover { border-color: rgba(224, 184, 74, 0.3); background: rgba(224, 184, 74, 0.05); }

.block {
  padding: 14px 16px; border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 10px;
}
.block-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 700;
  color: var(--accent-bright);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.block-head i { font-size: 11px; }
.block-body { font-size: 14px; color: var(--text-body); line-height: 1.7; }

.simple-list {
  list-style: none; padding: 0;
  display: flex; flex-direction: column; gap: 8px;
}
.simple-list li {
  display: flex; gap: 10px;
  font-size: 14px; color: var(--text-body); line-height: 1.6;
}
.simple-list li .num {
  color: var(--accent-bright); font-weight: 700;
  flex-shrink: 0; min-width: 18px;
}

.part {
  padding: 18px 18px 16px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 12px;
}
.part-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.part-title::before {
  content: '';
  width: 4px;
  height: 20px;
  background: linear-gradient(180deg, var(--accent-bright), var(--accent));
  border-radius: 2px;
  flex-shrink: 0;
}
.part-idea {
  font-size: 14.5px;
  color: var(--text-light);
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: 12px;
  padding-left: 14px;
  border-left: 2px solid rgba(224, 184, 74, 0.3);
}
.part-explanation {
  font-size: 14.5px;
  color: var(--text-body);
  line-height: 1.75;
  margin-bottom: 14px;
}
.part-terms {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--block-bg);
}
.part-terms-title {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.part-terms-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.part-term {
  font-size: 13.5px;
  color: var(--text-body);
  line-height: 1.55;
}
.part-term strong { color: var(--text-light); }
.part-remember {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(69, 180, 125, 0.06);
  border-left: 3px solid var(--success-light);
  font-size: 13.5px;
  color: #7ce0aa;
  line-height: 1.6;
}
.part-remember strong {
  color: var(--success-light);
  font-weight: 700;
  display: block;
  margin-bottom: 4px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.formula-block {
  padding: 14px 12px; text-align: center;
  background: var(--block-bg); border-radius: 10px;
  margin-bottom: 8px; overflow-x: auto;
}
.formula-block:last-child { margin-bottom: 0; }
.formula-description {
  font-size: 12.5px;
  color: var(--text-dim);
  margin-top: 6px;
  font-style: italic;
}
.formula-condition {
  font-size: 11.5px; color: var(--text-muted);
  margin-top: 6px;
}
.formula-variables {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
}
.formula-variable {
  font-size: 12.5px;
  color: var(--text-body);
}
.formula-variable strong { color: var(--accent-bright); }

.method-list { list-style: none; padding: 0; counter-reset: m; }
.method-list li {
  position: relative; padding-left: 28px; counter-increment: m;
  font-size: 14px; color: var(--text-body); line-height: 1.65; margin-bottom: 8px;
}
.method-list li:last-child { margin-bottom: 0; }
.method-list li::before {
  content: counter(m); position: absolute; left: 0; top: 2px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(224, 184, 74, 0.12); color: var(--accent-bright);
  font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}

.example-enonce {
  padding: 10px 12px; border-radius: 8px;
  background: var(--block-bg); font-size: 13.5px;
  color: var(--text-light); line-height: 1.6; margin-bottom: 10px;
}
.example-steps { list-style: none; padding: 0; counter-reset: e; }
.example-steps li {
  position: relative; padding-left: 24px; counter-increment: e;
  font-size: 13.5px; color: var(--text-body); line-height: 1.65; margin-bottom: 6px;
}
.example-steps li::before {
  content: counter(e) '.'; position: absolute; left: 0; top: 0;
  color: var(--accent-bright); font-weight: 700;
}
.example-result {
  padding: 8px 12px; border-radius: 8px;
  background: rgba(69, 180, 125, 0.08);
  font-size: 13.5px; color: #7ce0aa;
  font-weight: 600; margin-top: 8px;
}

.trap-text { font-size: 13.5px; color: var(--text-light); line-height: 1.65; margin-bottom: 8px; }
.trap-solution {
  padding-left: 18px; position: relative;
  font-size: 13px; color: #7ce0aa; line-height: 1.65;
}
.trap-solution::before { content: '→'; position: absolute; left: 0; top: 0; font-weight: 700; }

.qa-list { display: flex; flex-direction: column; gap: 10px; }
.qa-item {
  border-radius: 12px; background: var(--card-bg);
  border: 1px solid var(--card-border);
  overflow: hidden; transition: var(--transition);
}
.qa-item.open { border-color: rgba(224, 184, 74, 0.25); }
.qa-question {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 15px; cursor: pointer;
}
.qa-question:hover { background: rgba(255, 255, 255, 0.015); }
.qa-q-icon {
  min-width: 28px;
  height: 24px; padding: 0 8px;
  border-radius: 7px;
  background: rgba(224, 184, 74, 0.1); color: var(--accent-bright);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; flex-shrink: 0;
}
.qa-q-icon.important { background: rgba(224, 184, 74, 0.15); color: var(--accent-bright); }
.qa-q-icon.very-important { background: rgba(224, 122, 95, 0.15); color: var(--danger-light); }
.qa-q-text {
  flex: 1; font-size: 14px; font-weight: 600;
  color: var(--text-light); line-height: 1.5;
}
.qa-level {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-muted);
  flex-shrink: 0;
}
.qa-level.l1 { color: #6ec5ff; background: rgba(110, 197, 255, 0.08); }
.qa-level.l2 { color: #f0c14b; background: rgba(240, 193, 75, 0.08); }
.qa-level.l3 { color: #ff9a84; background: rgba(255, 154, 132, 0.08); }

.qa-toggle {
  color: var(--text-muted); font-size: 11px;
  flex-shrink: 0; margin-top: 5px;
  transition: transform 0.3s ease;
}
.qa-item.open .qa-toggle { transform: rotate(180deg); color: var(--accent-bright); }
.qa-answer {
  max-height: 0; overflow: hidden;
  transition: max-height 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}
.qa-item.open .qa-answer { max-height: 3000px; }
.qa-answer-inner {
  padding: 13px 15px 15px;
  border-top: 1px solid var(--card-border);
  background: rgba(0, 0, 0, 0.15);
}
.qa-answer-label {
  font-size: 10.5px; font-weight: 700;
  color: var(--success-light);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.qa-answer-text { font-size: 14px; color: var(--text-body); line-height: 1.7; }
.qa-musthave {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(224, 184, 74, 0.05);
  border-left: 3px solid var(--accent);
}
.qa-musthave-title {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent-bright);
  margin-bottom: 6px;
}
.qa-musthave-list {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.qa-musthave-list li {
  font-size: 13px;
  color: var(--text-body);
  line-height: 1.55;
  padding-left: 14px;
  position: relative;
}
.qa-musthave-list li::before {
  content: '•';
  position: absolute;
  left: 2px;
  color: var(--accent-bright);
}

.qcm-item {
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 16px;
  margin-bottom: 10px;
}
.qcm-question {
  font-size: 14.5px;
  color: var(--text-light);
  font-weight: 600;
  line-height: 1.55;
  margin-bottom: 12px;
}
.qcm-options {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.qcm-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--block-bg);
  border: 1px solid transparent;
  cursor: pointer;
  transition: var(--transition);
  font-size: 13.5px;
  color: var(--text-body);
  line-height: 1.5;
  text-align: left;
  width: 100%;
}
.qcm-option:hover { border-color: rgba(224, 184, 74, 0.25); }
.qcm-option.correct {
  background: rgba(58, 182, 126, 0.1);
  border-color: var(--success-light);
  color: #7ce0aa;
}
.qcm-option.wrong {
  background: rgba(184, 92, 58, 0.1);
  border-color: var(--danger-light);
  color: #ff9a84;
}
.qcm-option-letter {
  width: 24px; height: 24px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.04);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  color: var(--text-muted);
  flex-shrink: 0;
}
.qcm-option.correct .qcm-option-letter {
  background: var(--success-light);
  color: #fff;
}
.qcm-option.wrong .qcm-option-letter {
  background: var(--danger-light);
  color: #fff;
}
.qcm-explanation {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(74, 175, 224, 0.06);
  font-size: 13px;
  color: var(--text-body);
  line-height: 1.6;
  display: none;
}
.qcm-explanation.show { display: block; }
.qcm-explanation strong { color: #4AAFE0; }

.notes-area {
  width: 100%; min-height: 110px;
  padding: 14px 16px; border-radius: 12px;
  background: var(--block-bg); border: 1px solid var(--card-border);
  color: var(--text-light); font-family: inherit;
  font-size: 14px; line-height: 1.65;
  resize: vertical; outline: none;
  transition: var(--transition);
}
.notes-area:focus { border-color: rgba(224, 184, 74, 0.35); box-shadow: 0 0 0 3px rgba(224, 184, 74, 0.06); }
.notes-area::placeholder { color: var(--text-muted); }
.notes-status {
  font-size: 11px; color: var(--text-muted);
  text-align: right; margin-top: 6px; min-height: 15px;
}
.notes-status.saved { color: var(--success-light); }

.cta-exam {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 18px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.1), rgba(184, 134, 11, 0.05));
  border: 1px solid rgba(224, 184, 74, 0.3);
  color: var(--text-light);
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
  font-family: inherit;
  margin-bottom: 12px;
}
.cta-exam:hover {
  border-color: var(--accent-bright);
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.15), rgba(184, 134, 11, 0.08));
  transform: translateY(-1px);
}
.cta-exam > i:first-child {
  font-size: 24px;
  color: var(--accent-bright);
  flex-shrink: 0;
}
.cta-exam-body { flex: 1; min-width: 0; }
.cta-exam-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--accent-bright);
  margin-bottom: 3px;
}
.cta-exam-sub {
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.4;
}
.cta-exam-arrow {
  color: var(--text-muted);
  font-size: 14px;
  flex-shrink: 0;
  margin-left: auto;
}

.loading-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 60px 20px;
}
.loading-spinner {
  width: 30px; height: 30px;
  border: 3px solid rgba(224, 184, 74, 0.15);
  border-top-color: var(--accent-bright);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state p { font-size: 13px; color: var(--text-muted); }

.generating-state {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  padding: 60px 20px; text-align: center;
}
.generating-spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(224, 184, 74, 0.15);
  border-top-color: var(--accent-bright);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
.generating-state h3 {
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-weight: 700;
  color: var(--text-light);
}
.generating-steps {
  display: flex; flex-direction: column;
  gap: 8px; width: 100%; max-width: 380px;
  margin-top: 8px;
}
.generating-step {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  font-size: 13px;
  color: var(--text-dim);
  transition: var(--transition);
  opacity: 0.4;
}
.generating-step.active { opacity: 1; color: var(--accent-bright); border-color: rgba(224, 184, 74, 0.3); }
.generating-step.done { opacity: 0.9; color: var(--success-light); border-color: rgba(58, 182, 126, 0.2); }
.generating-step-icon { font-size: 15px; width: 20px; text-align: center; }

.empty-state {
  text-align: center; padding: 40px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty-state .icon {
  width: 62px; height: 62px; border-radius: 18px;
  background: rgba(224, 184, 74, 0.06);
  border: 1px solid rgba(224, 184, 74, 0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: var(--accent-bright);
}
.empty-state h3 {
  font-family: 'Playfair Display', serif;
  font-size: 16px; font-weight: 700;
  color: var(--text-light);
}
.empty-state p { font-size: 13px; color: var(--text-dim); max-width: 320px; line-height: 1.6; }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.modal-backdrop.show { display: flex; animation: fadeIn 0.2s ease; }
.modal-backdrop.center { align-items: center; padding: 16px; }

.modal {
  width: 100%; max-width: 640px; max-height: 92vh;
  background: #141414;
  border-top: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 22px 22px 0 0;
  padding: 24px 20px;
  padding-bottom: calc(24px + var(--safe-bottom));
  overflow-y: auto; position: relative;
  animation: slideUp 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  border-radius: 22px 22px 0 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
}

.modal-confirm {
  width: 100%; max-width: 360px;
  background: #141414;
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center; position: relative;
  animation: popIn 0.25s cubic-bezier(0.25, 1, 0.5, 1);
}
@keyframes popIn {
  from { transform: scale(0.94); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-confirm .confirm-icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(184, 92, 58, 0.12);
  border: 1px solid rgba(184, 92, 58, 0.25);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
  color: #ff9a84; font-size: 22px;
}
.modal-confirm h3 {
  font-family: 'Playfair Display', serif;
  font-size: 17px; font-weight: 700;
  color: var(--text-light); margin-bottom: 8px;
}
.modal-confirm p {
  font-size: 13.5px; color: var(--text-dim);
  line-height: 1.55; margin-bottom: 18px;
}
.modal-confirm p strong { color: var(--text-light); }
.modal-confirm-buttons { display: flex; gap: 10px; }
.modal-confirm-buttons button {
  flex: 1; min-height: 42px; border-radius: 10px;
  font-size: 13.5px; font-weight: 700;
  font-family: inherit; transition: var(--transition);
}
.btn-cancel {
  background: transparent;
  border: 1px solid var(--card-border);
  color: var(--text-dim);
}
.btn-cancel:hover { color: var(--text-light); }
.btn-danger {
  background: linear-gradient(135deg, #B85C3A, #a04a2a);
  color: #fff; border: none;
}
.btn-danger:hover { opacity: 0.9; }

.modal-close {
  position: absolute; top: 14px; right: 14px;
  width: 32px; height: 32px; border-radius: 10px;
  border: 1px solid var(--card-border);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: var(--transition);
  z-index: 5;
}
.modal-close:hover { color: var(--text-light); border-color: rgba(224, 184, 74, 0.3); }

.modal-head { text-align: center; margin-bottom: 20px; padding: 0 30px; }
.modal-head h2 {
  font-family: 'Playfair Display', serif;
  font-size: 19px; font-weight: 700;
  color: var(--text-light); margin-bottom: 6px;
}
.modal-head p { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

.form-field { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 8px;
}
.form-input, .form-textarea {
  width: 100%; padding: 13px 15px;
  border-radius: 10px;
  border: 1px solid var(--card-border);
  background: var(--block-bg);
  color: var(--text-light);
  font-size: 14px; font-family: inherit;
  outline: none; resize: vertical;
  transition: var(--transition);
}
.form-input:focus, .form-textarea:focus {
  border-color: rgba(224, 184, 74, 0.4);
  box-shadow: 0 0 0 3px rgba(224, 184, 74, 0.08);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
.form-textarea { min-height: 160px; line-height: 1.6; }

.char-counter {
  text-align: right; font-size: 11px;
  color: var(--text-muted); margin-top: 6px;
}

.symbols-toggle {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 20px;
  background: transparent;
  border: 1px solid var(--card-border);
  color: var(--text-dim);
  font-size: 12.5px; font-weight: 600;
  font-family: inherit;
  transition: var(--transition);
  margin-bottom: 8px;
}
.symbols-toggle:hover { border-color: rgba(224, 184, 74, 0.3); color: var(--accent-bright); }
.symbols-toggle.active { border-color: rgba(224, 184, 74, 0.4); color: var(--accent-bright); background: rgba(224, 184, 74, 0.06); }
.symbols-toggle .fx {
  color: var(--accent-bright); font-weight: 700;
  font-family: 'Playfair Display', serif;
  font-size: 14px;
}
.symbols-toggle .chev { font-size: 10px; transition: transform 0.25s ease; margin-left: auto; }
.symbols-toggle.active .chev { transform: rotate(180deg); }

.symbols-panel {
  max-height: 0; overflow: hidden;
  transition: max-height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  margin-bottom: 10px;
}
.symbols-panel.open { max-height: 320px; }

.symbols-panel-inner {
  padding: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
}

.symbols-tabs {
  display: flex; gap: 4px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--card-border);
  scrollbar-width: none;
}
.symbols-tabs::-webkit-scrollbar { display: none; }

.symbols-tab {
  padding: 6px 12px; border-radius: 16px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  font-size: 11.5px; font-weight: 600;
  font-family: inherit;
  white-space: nowrap;
  flex-shrink: 0;
  transition: var(--transition);
  cursor: pointer;
}
.symbols-tab:hover { color: var(--text-light); }
.symbols-tab.active {
  background: rgba(224, 184, 74, 0.1);
  border-color: rgba(224, 184, 74, 0.25);
  color: var(--accent-bright);
}

.symbols-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
  gap: 6px;
  max-height: 200px;
  overflow-y: auto;
}

.symbol-btn {
  aspect-ratio: 1;
  min-height: 38px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--card-border);
  color: var(--text-body);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  transition: var(--transition);
  cursor: pointer;
}
.symbol-btn:hover {
  background: rgba(224, 184, 74, 0.1);
  border-color: rgba(224, 184, 74, 0.3);
  color: var(--accent-bright);
}
.symbol-btn:active { transform: scale(0.94); }

.btn-full {
  width: 100%; min-height: 50px;
  padding: 14px 24px; border-radius: 30px;
  border: none; font-size: 14.5px; font-weight: 700;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  gap: 10px;
  transition: var(--transition);
}
.btn-full.primary {
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: #0A0A0A;
  box-shadow: 0 4px 14px rgba(184, 134, 11, 0.22);
}
.btn-full.primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(184, 134, 11, 0.35); }
.btn-full.secondary {
  background: transparent; border: 1px solid var(--card-border);
  color: var(--text-dim);
}
.btn-full.secondary:hover { color: var(--accent-bright); border-color: rgba(224, 184, 74, 0.3); }

.btn-full .spinner {
  display: none; width: 16px; height: 16px;
  border: 2px solid rgba(10, 10, 10, 0.25);
  border-top-color: #0A0A0A; border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.btn-full.loading .spinner { display: block; }
.btn-full.loading .btn-text, .btn-full.loading .btn-icon { display: none; }

.toast-container {
  position: fixed; top: calc(var(--safe-top) + 16px); left: 50%;
  transform: translateX(-50%); z-index: 9999;
  width: calc(100% - 32px); max-width: 420px;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; border-radius: 12px;
  background: rgba(20, 22, 20, 0.96);
  backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  color: var(--text-light); font-size: 13px; font-weight: 500;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  animation: toastIn 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  pointer-events: auto;
}
.toast.success { border-color: rgba(58, 182, 126, 0.5); }
.toast.error { border-color: rgba(231, 76, 60, 0.5); }
.toast.info { border-color: rgba(224, 184, 74, 0.4); }
.toast i { font-size: 15px; flex-shrink: 0; }
.toast.success i { color: var(--success-light); }
.toast.error i { color: #ff9a84; }
.toast.info i { color: var(--accent-bright); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.katex {
  font-size: 1.05em;
  color: inherit;
  font-family: KaTeX_Main, "Times New Roman", serif;
}
.katex-display {
  margin: 10px 0;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 6px 2px;
  -webkit-overflow-scrolling: touch;
  text-align: center;
}
.katex-display > .katex { white-space: nowrap; }
.katex-error {
  color: #ff9a84 !important;
  background: rgba(255, 154, 132, 0.08);
  padding: 1px 4px;
  border-radius: 3px;
}
.formula-block {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.part-explanation,
.block-body,
.qa-answer-text,
.qcm-question,
.qcm-explanation {
  overflow-wrap: break-word;
  word-break: break-word;
}

@media (max-width: 520px) {
  main { padding: 16px 12px 50px; }
  .greeting h1 { font-size: 22px; }
  .streak-card { padding: 14px 16px; }
  .streak-icon { font-size: 28px; }
  .streak-value { font-size: 20px; }
  .subject-card { padding: 16px 14px; }
  .list-item { padding: 13px 14px; }
  .block { padding: 13px 15px; }
  .part { padding: 15px 15px 14px; }
  .modal { padding: 20px 16px; padding-bottom: calc(20px + var(--safe-bottom)); }
  .cta-exam { padding: 14px 15px; }
  .cta-exam > i:first-child { font-size: 20px; }
  .cta-exam-title { font-size: 13.5px; }
  .cta-exam-sub { font-size: 11.5px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(184, 134, 11, 0.25); border-radius: 10px; }

.arvexa-popup-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.30s cubic-bezier(0.4, 0, 0.2, 1),
              visibility 0.30s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.arvexa-popup-overlay.show {
  opacity: 1;
  visibility: visible;
}
.arvexa-popup {
  position: relative;
  width: 100%;
  max-width: 360px;
  margin: auto;
  padding: 30px 26px 22px;
  border: 1px solid rgba(224, 184, 74, 0.20);
  border-radius: 22px;
  background:
    radial-gradient(ellipse 120% 70% at 50% -10%, rgba(224, 184, 74, 0.10) 0%, transparent 65%),

  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.02),
    0 0 60px rgba(224, 184, 74, 0.08),
    0 24px 60px rgba(0, 0, 0, 0.70),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  transform: scale(0.94) translateY(20px);
  transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
  overflow: hidden;
  isolation: isolate;
}
.arvexa-popup-overlay.show .arvexa-popup {
  transform: scale(1) translateY(0);
}
.arvexa-popup::before {
  content: '';
  position: absolute;
  top: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  border-radius: 0 0 4px 4px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(224, 184, 74, 0.4) 20%,
    #E0B84A 50%,
    rgba(224, 184, 74, 0.4) 80%,
    transparent 100%);
  opacity: 0.9;
  z-index: 2;
}
.arvexa-popup::after {
  content: '';
  position: absolute;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(224, 184, 74, 0.18) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  filter: blur(6px);
}
.arvexa-popup-close {
  position: absolute;
  top: 13px;
  right: 13px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.03);
  color: #6A6A5A;
  font-size: 12px;
  cursor: pointer;
  display: flex;

// SAFE TEXT — épargne le LaTeX ($...$ et $$...$$)
// ═══════════════════════════════════════════════════════════════
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text || '');
  return div.innerHTML;
}

function safeText(text) {
  let s = String(text || '');
  s = s.replace(/&amp;(lt|gt|quot|amp|#39);/g, '&$1;');

  const parts = s.split(/(\$\$[\s\S]*?\$\$|\$[^$\n]+?\$)/g);
  return parts.map((part, i) => {
    if (i % 2 === 1) return part;
    return part.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }).join('');
}

// ═══════════════════════════════════════════════════════════════

// ajout de contenu contenant du LaTeX dans le DOM.
// Aucun appel manuel nécessaire : c'est plus fiable et ça évite les
// doubles rendus qui causaient des formules instables.

function showToast(message, type = 'info', duration = 3000) {
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${escapeHtml(message)}</span>`;
  $('toastContainer').appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 250);
  }, duration);
}

function showLoadingState(el, text = 'Chargement...') {
  el.innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><p>${escapeHtml(text)}</p></div>`;
}

function showGeneratingState(el, profile) {
  const profileLabels = {
    scientific: 'Analyse scientifique',

    history: 'Analyse historique',
    french: 'Analyse littéraire',

  };
  const label = profileLabels[profile] || 'Analyse en cours';

  el.innerHTML = `
    <div class="generating-state">
      <div class="generating-spinner"></div>
      <h3>${escapeHtml(label)}...</h3>
      <div class="generating-steps">
        <div class="generating-step active" data-step="1">
          <span class="generating-step-icon">🔍</span>
          <span>Extraction des concepts</span>
        </div>
        <div class="generating-step" data-step="2">

          <span>Explication pédagogique</span>
        </div>

          <span>Structuration</span>
        </div>
        <div class="generating-step" data-step="4">
          <span class="generating-step-icon">❓</span>
          <span>Banque de questions</span>
        </div>
        <div class="generating-step" data-step="5">
          <span class="generating-step-icon">🎯</span>
          <span>QCM</span>
        </div>
      </div>
      <p style="font-size:12px; color:var(--text-muted); margin-top:8px;">
        Cela peut prendre 30 à 60 secondes.
      </p>
    </div>
  `;

  let currentStep = 1;
  const interval = setInterval(() => {
    const steps = el.querySelectorAll('.generating-step');
    if (!steps.length || currentStep >= steps.length) {
      clearInterval(interval);
      return;
    }
    steps[currentStep - 1].classList.remove('active');
    steps[currentStep - 1].classList.add('done');
    if (currentStep < steps.length) steps[currentStep].classList.add('active');
    currentStep++;
  }, 6000);

  return () => clearInterval(interval);
}

}

async function callApi(action, params = {}) {
  if (!state.user) throw new Error('Non authentifié.');
  const token = await getIdToken(state.user);
  const response = await fetch('/api/progress', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ action, ...params })
  });
  const data = await response.json().catch(() => null);

  if (response.status === 401 && data?.code === 'AUTH_REQUIRED') {
    window.location.replace('login.html');
    throw new Error('Session expirée');
  }

  if (!response.ok || !data?.success) {
    const err = new Error(data?.error || `Erreur ${response.status}`);
    err.code = data?.code;
    err.status = response.status;
    throw err;
  }
  return data;
}

function routeFromHash() {
  const hash = window.location.hash.replace(/^#\/?/, '');
  if (!hash) return { view: 'notebooks', params: {} };
  const parts = hash.split('/').filter(Boolean);
  switch (parts[0]) {
    case 'notebooks': return { view: 'notebooks', params: {} };
    case 'notebook': return { view: 'notebook', params: { subject: parts[1] } };
    case 'chapter': return { view: 'chapter', params: { subject: parts[1], chapterId: parts[2] } };
    case 'section': return { view: 'section', params: { subject: parts[1], chapterId: parts[2], sectionId: parts[3] } };
    case 'lesson': return { view: 'lesson', params: { subject: parts[1], chapterId: parts[2] } };
    default: return { view: 'notebooks', params: {} };
  }
}

function hashFromRoute(view, params) {
  const p = params || {};
  switch (view) {
    case 'notebooks': return '#/notebooks';
    case 'notebook': return p.subject ? `#/notebook/${p.subject}` : '#/notebooks';
    case 'chapter': return (p.subject && p.chapterId)
      ? `#/chapter/${p.subject}/${p.chapterId}` : '#/notebooks';
    case 'section': return (p.subject && p.chapterId && p.sectionId)
      ? `#/section/${p.subject}/${p.chapterId}/${p.sectionId}` : '#/notebooks';
    case 'lesson': return (p.subject && p.chapterId)
      ? `#/lesson/${p.subject}/${p.chapterId}` : '#/notebooks';
    default: return '#/notebooks';
  }
}

function navigate(view, params = {}, replace = false) {
  const hash = hashFromRoute(view, params);
  if (replace) window.history.replaceState(null, '', hash);
  else window.history.pushState(null, '', hash);
  applyRoute({ view, params });
}

function applyRoute(route) {
  state.view = route.view;
  state.params = route.params || {};

  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  const target = $(`view-${route.view}`);
  if (target) target.classList.add('active');

  updateHeader();
  updateBackButton();

  switch (route.view) {
    case 'notebooks': renderNotebooksView(); break;
    case 'notebook': renderNotebookView(route.params); break;
    case 'chapter': renderChapterView(route.params); break;
    case 'section': renderSectionView(route.params); break;
    case 'lesson': renderLessonView(route.params); break;

}

function updateBackButton() {

window.addEventListener('hashchange', () => applyRoute(routeFromHash()));

// ═══════════════════════════════════════════════════════════════
// VUE 1 — MES CAHIERS
// ═══════════════════════════════════════════════════════════════
async function renderNotebooksView() {
  const el = $('view-notebooks');

    const subjectCards = ALL_SUBJECT_KEYS.map((key) => {

      `;
    }).join('');

    const activityHtml = (data.recentActivity || []).length > 0
      ? `

              <div class="list-item-body">
                <div class="list-item-title">${escapeHtml(a.chapterTitle)}</div>
                <div class="list-item-meta">
                  <span>${escapeHtml(a.subjectLabel)}</span>
                  <span class="dot"></span>
                  <span>${escapeHtml(a.time)}</span>
                </div>
              </div>
              <div class="list-item-arrow"><i class="fas fa-chevron-right"></i></div>
            </button>
          `).join('')}
        </div>
      `
      : '';

    el.innerHTML = `
      <div class="greeting">
        <h1>${getGreeting()}, <em>${escapeHtml(getFirstName())}</em></h1>
        <p>${totalSections > 0 ? 'Continue là où tu t\'es arrêté.' : 'Commence ton premier cahier.'}</p>
      </div>

      <div class="streak-card">
        <div class="streak-icon">⏱️</div>
        <div class="streak-content">
          <div class="streak-value">${studyTime.formatted.total} d'étude</div>
          <div class="streak-label">
            ${studyTime.formatted.week} cette semaine
            ${studyTime.todayMinutes > 0 ? `· ${studyTime.formatted.today} aujourd'hui` : ''}
            · ${totalSections} section${totalSections > 1 ? 's' : ''}
          </div>
        </div>
      </div>

      <div class="section-title"><i class="fas fa-book"></i> Mes matières <span class="count">${ALL_SUBJECT_KEYS.length}</span></div>
      <div class="subjects-grid">${subjectCards}</div>

      ${activityHtml}
    `;

    el.querySelectorAll('[data-subject]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const subject = btn.dataset.subject;
        const chapter = btn.dataset.chapter;
        if (chapter) navigate('chapter', { subject, chapterId: chapter });
        else navigate('notebook', { subject });
      });
    });

  } catch (err) {
    showEmptyState(el, 'fa-exclamation-triangle', 'Impossible de charger', err.message || 'Erreur réseau.');
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE 2 — CHAPITRES
// ═══════════════════════════════════════════════════════════════
async function renderNotebookView(params) {
  const el = $('view-notebook');
  const subject = params.subject;
  const info = SUBJECTS[subject];
  if (!info) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement...');

  try {
    const data = await callApi('listChapters', { subject });
    const chapters = data.chapters || [];
    const totalSections = chapters.reduce((s, c) => s + (c.sectionsCount || 0), 0);

    const listHtml = chapters.length === 0
      ? `<div class="empty-state" style="padding:30px 20px;">
           <div class="icon"><i class="fas fa-book"></i></div>
           <h3>Aucun chapitre</h3>
           <p>Crée ton premier chapitre.</p>
         </div>`
      : chapters.map((c) => `
          <div class="list-item" data-chapter="${escapeHtml(c.id)}">
            <div class="list-item-icon"><i class="fas fa-book"></i></div>
            <div class="list-item-body" data-nav="chapter">
              <div class="list-item-title">${escapeHtml(c.title)}</div>
              <div class="list-item-meta">
                <span>${c.sectionsCount} section${c.sectionsCount > 1 ? 's' : ''}</span>
                <span class="dot"></span>
                <span>${escapeHtml(c.last)}</span>
              </div>
            </div>
            <button class="list-item-delete" data-delete-chapter="${escapeHtml(c.id)}" title="Supprimer">
              <i class="fas fa-trash-alt"></i>
            </button>
            <div class="list-item-arrow" data-nav="chapter"><i class="fas fa-chevron-right"></i></div>
          </div>
        `).join('');

    el.innerHTML = `
      <div class="page-hero">
        <h1>${info.emoji} ${escapeHtml(info.label)}</h1>
        <div class="hero-sub">${totalSections} section${totalSections > 1 ? 's' : ''} · ${chapters.length} chapitre${chapters.length > 1 ? 's' : ''}</div>
      </div>

      <div class="section-title"><i class="fas fa-book-open"></i> Chapitres <span class="count">${chapters.length}</span></div>

      <div class="list">
        ${listHtml}
        <button class="list-item new" id="newChapterBtn">
          <i class="fas fa-plus"></i>
          <span>Nouveau chapitre</span>
        </button>
      </div>
    `;

    el.querySelectorAll('[data-chapter]').forEach((item) => {
      const chapterId = item.dataset.chapter;
      item.querySelectorAll('[data-nav="chapter"]').forEach((target) => {
        target.addEventListener('click', (e) => {
          e.stopPropagation();
          navigate('chapter', { subject, chapterId });
        });
      });
    });

    el.querySelectorAll('[data-delete-chapter]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const chapterId = btn.dataset.deleteChapter;
        const chapterTitle = chapters.find((c) => c.id === chapterId)?.title || 'ce chapitre';
        confirmDelete({
          title: 'Supprimer le chapitre ?',
          message: `"<strong>${escapeHtml(chapterTitle)}</strong>" et toutes ses sections seront définitivement supprimés.`,
          onConfirm: async () => {
            await callApi('deleteChapter', { subject, chapterId });
            showToast('Chapitre supprimé', 'success');
            delete state.cache.chapters[subject];
            delete state.cache.chapter[`${subject}/${chapterId}`];
            applyRoute({ view: 'notebook', params: { subject } });
          }
        });
      });
    });

    $('newChapterBtn')?.addEventListener('click', () => openNewChapterModal(subject));

  } catch (err) {
    showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE 3 — SECTIONS
// ═══════════════════════════════════════════════════════════════
async function renderChapterView(params) {
  const el = $('view-chapter');
  const { subject, chapterId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement...');

  try {
    const data = await callApi('getChapter', { subject, chapterId });
    state.cache.chapter[`${subject}/${chapterId}`] = data;
    const ch = data.chapter;
    const sections = data.sections || [];

    const listHtml = sections.length === 0
      ? `<div class="empty-state" style="padding:30px 20px;">
           <div class="icon"><i class="fas fa-file-lines"></i></div>
           <h3>Aucune section</h3>
           <p>Ajoute la première partie que tu as étudiée.</p>
         </div>`
      : sections.map((s, idx) => `
          <div class="list-item" data-section="${escapeHtml(s.id)}">
            <div class="list-item-icon"><i class="fas fa-check"></i></div>
            <div class="list-item-body" data-nav="section">
              <div class="list-item-title">${idx + 1}. ${escapeHtml(s.title)}</div>
              <div class="list-item-meta">
                ${s.questionsCount > 0 ? `<span>${s.questionsCount} Q/R</span><span class="dot"></span>` : ''}
                ${s.qcmCount > 0 ? `<span>${s.qcmCount} QCM</span><span class="dot"></span>` : ''}
                <span>${escapeHtml(s.time)}</span>
              </div>
            </div>
            <button class="list-item-delete" data-delete-section="${escapeHtml(s.id)}" title="Supprimer">
              <i class="fas fa-trash-alt"></i>
            </button>
            <div class="list-item-arrow" data-nav="section"><i class="fas fa-chevron-right"></i></div>
          </div>
        `).join('');

    el.innerHTML = `
      <div class="page-hero">
        <div class="hero-sub" style="margin-bottom:6px;">${info.emoji} ${escapeHtml(info.label)}</div>
        <h1>${escapeHtml(ch.title)}</h1>
        <div class="hero-sub">${sections.length} section${sections.length > 1 ? 's' : ''}</div>
      </div>

      ${sections.length > 0 ? `
        <button class="cta-card" id="viewLessonBtn">
          <i class="fas fa-book-reader"></i>
          <span>Voir la leçon complète</span>
        </button>
      ` : ''}

      <div class="section-title"><i class="fas fa-list"></i> Sections <span class="count">${sections.length}</span></div>

      <div class="list">
        ${listHtml}
        <button class="list-item new" id="addSectionBtn">
          <i class="fas fa-plus"></i>
          <span>Ajouter une section</span>
        </button>
      </div>
    `;

    el.querySelectorAll('[data-section]').forEach((item) => {
      const sectionId = item.dataset.section;
      item.querySelectorAll('[data-nav="section"]').forEach((target) => {
        target.addEventListener('click', (e) => {
          e.stopPropagation();
          navigate('section', { subject, chapterId, sectionId });
        });
      });
    });

    el.querySelectorAll('[data-delete-section]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const sectionId = btn.dataset.deleteSection;
        const sectionTitle = sections.find((s) => s.id === sectionId)?.title || 'cette section';
        confirmDelete({
          title: 'Supprimer la section ?',
          message: `"<strong>${escapeHtml(sectionTitle)}</strong>" sera définitivement supprimée.`,
          onConfirm: async () => {
            await callApi('deleteSection', { subject, chapterId, sectionId });
            showToast('Section supprimée', 'success');
            delete state.cache.chapter[`${subject}/${chapterId}`];
            applyRoute({ view: 'chapter', params: { subject, chapterId } });
          }
        });
      });
    });

    $('viewLessonBtn')?.addEventListener('click', () => navigate('lesson', { subject, chapterId }));
    $('addSectionBtn')?.addEventListener('click', () => openAddSectionModal(subject, chapterId));

  } catch (err) {
    if (err.status === 404) showEmptyState(el, 'fa-book', 'Chapitre introuvable', 'Ce chapitre n\'existe plus.');
    else showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// ═══════════════════════════════════════════════════════════════
// VUE 4 — SECTION DÉTAILLÉE
// ═══════════════════════════════════════════════════════════════
async function renderSectionView(params) {
  const el = $('view-section');
  const { subject, chapterId, sectionId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId || !sectionId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Chargement...');

  try {
    const data = await callApi('getSection', { subject, chapterId, sectionId });
    const s = data.section;
    const a = s.analysis || {};
    const profile = s.profile || 'scientific';
    const chapterTitle = state.cache.chapter[`${subject}/${chapterId}`]?.chapter?.title || '';

    el.innerHTML = `
      <div class="section-hero">
        <div class="breadcrumb">
          <span>${info.emoji} ${escapeHtml(info.label)}</span>
          ${chapterTitle ? `<span class="sep">›</span><span>${escapeHtml(chapterTitle)}</span>` : ''}
        </div>
        <h1>${escapeHtml(s.title)}</h1>
        <div class="sub">${escapeHtml(s.time || '')}</div>
      </div>

      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-paste"></i>Ton cours</div>
        <div class="raw-input" id="rawInput">${safeText(s.rawInput)}</div>
        <button class="expand-btn" id="expandRawBtn">
          <i class="fas fa-chevron-down"></i>
          <span>Voir tout</span>
        </button>
      </div>

      <div id="analysisContainer"></div>

      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-pen"></i>Mes notes</div>
        <textarea class="notes-area" id="notesArea" placeholder="Ajoute tes notes personnelles...">${escapeHtml(s.userNotes || '')}</textarea>
        <div class="notes-status" id="notesStatus"></div>
      </div>

      <div class="content-section">
        <div class="content-section-title"><i class="fas fa-graduation-cap"></i>Teste-toi sur cette partie</div>
        <button class="cta-exam" id="goToExamBtn" data-subject="${escapeHtml(subject)}" data-chapter="${escapeHtml(chapterTitle)}">
          <i class="fas fa-file-circle-check"></i>
          <div class="cta-exam-body">
            <div class="cta-exam-title">Passer en mode examen</div>
            <div class="cta-exam-sub">Teste-toi dans les conditions du BAC</div>
          </div>
          <i class="fas fa-chevron-right cta-exam-arrow"></i>
        </button>
      </div>
    `;

    const container = $('analysisContainer');
    container.innerHTML = renderAnalysis(a, profile);
    // Rendu KaTeX automatique (katex-utils.js MutationObserver)

    $('expandRawBtn')?.addEventListener('click', () => {
      const raw = $('rawInput');
      raw.classList.toggle('expanded');
      const span = $('expandRawBtn').querySelector('span');
      span.textContent = raw.classList.contains('expanded') ? 'Réduire' : 'Voir tout';
    });

    // Handler Q/R — le rendu KaTeX est automatique
    el.querySelectorAll('.qa-item').forEach((item) => {
      item.querySelector('.qa-question').addEventListener('click', () => {
        item.classList.toggle('open');
      });
    });

    // Handler QCM — l'explication est déjà rendue automatiquement
    el.querySelectorAll('.qcm-item').forEach((qcm) => {
      const correct = qcm.dataset.correct;
      const options = qcm.querySelectorAll('.qcm-option');
      const explanation = qcm.querySelector('.qcm-explanation');

      options.forEach((opt) => {
        opt.addEventListener('click', () => {
          if (qcm.dataset.answered === '1') return;
          qcm.dataset.answered = '1';
          const letter = opt.dataset.letter;
          options.forEach((o) => {
            if (o.dataset.letter === correct) o.classList.add('correct');
            else if (o.dataset.letter === letter) o.classList.add('wrong');
          });
          if (explanation) explanation.classList.add('show');
        });
      });
    });

    let notesTimer = null;
    $('notesArea')?.addEventListener('input', () => {
      const status = $('notesStatus');
      status.textContent = 'Enregistrement...';
      clearTimeout(notesTimer);
      notesTimer = setTimeout(async () => {
        try {
          await callApi('updateNotes', { subject, chapterId, sectionId, userNotes: $('notesArea').value });
          delete state.cache.chapter[`${subject}/${chapterId}`];
          status.textContent = 'Enregistré';
          status.className = 'notes-status saved';
          setTimeout(() => { status.textContent = ''; status.className = 'notes-status'; }, 2000);
        } catch (e) {
          status.textContent = 'Erreur';
          status.className = 'notes-status';
        }
      }, 1400);
    });

    $('goToExamBtn')?.addEventListener('click', function () {
      var subj = $('goToExamBtn').dataset.subject;
      var chap = $('goToExamBtn').dataset.chapter;
      var examSubject = EXAM_SUBJECT_MAP[subj] || '';
      if (!examSubject) {
        showToast('Cette matière n\'est pas encore disponible en mode examen.', 'info', 3000);
        return;
      }
      var params = new URLSearchParams();
      params.set('subject', examSubject);
      if (chap) params.set('chapter', chap);
      if (chapterId) params.set('chapterId', chapterId);
      params.set('useNotebook', 'true');
      window.location.href = 'exam.html?' + params.toString();
    });

  } catch (err) {
    if (err.status === 404) showEmptyState(el, 'fa-file', 'Section introuvable', 'Cette section n\'existe plus.');
    else showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDU ANALYSE
// ═══════════════════════════════════════════════════════════════
function renderAnalysis(a, profile) {
  let html = '';

  const expl = a.explanation || {};
  if (expl.understanding) {
    html += `<div class="content-section">
      <div class="content-section-title"><i class="fas fa-graduation-cap"></i>L'explication du prof</div>
      <div class="block">
        <div class="block-head"><i class="fas fa-lightbulb"></i>Ce que tu dois comprendre</div>
        <div class="block-body">${safeText(expl.understanding)}</div>
      </div>
      ${(expl.parts || []).map((p) => renderPart(p, profile)).join('')}
    </div>`;
  }

  if (a.structure) {
    html += renderStructure(a.structure, profile);
  }

  if (Array.isArray(a.questions) && a.questions.length > 0) {
    html += `<div class="content-section">
      <div class="content-section-title"><i class="fas fa-circle-question"></i>Banque de questions <span class="count">${a.questions.length}</span></div>
      <div class="qa-list">
        ${a.questions.map((q, i) => renderQuestion(q, i)).join('')}
      </div>
    </div>`;
  }

  if (Array.isArray(a.qcm) && a.qcm.length > 0) {
    html += `<div class="content-section">
      <div class="content-section-title"><i class="fas fa-list-check"></i>QCM <span class="count">${a.qcm.length}</span></div>
      <div>${a.qcm.map((q, i) => renderQcm(q, i)).join('')}</div>
    </div>`;
  }

  if (!html && a.fallback) {
    html = `<div class="block">
      <div class="block-head"><i class="fas fa-info-circle"></i>Information</div>
      <div class="block-body">L'analyse automatique est indisponible. Réessaie en ajoutant une nouvelle section ou en réessayant plus tard.</div>
    </div>`;
  }

  return html;
}

function renderPart(p, profile) {
  const partTitle = p.partTitle || p.title || 'Partie';
  const mainIdea = p.mainIdea || p.idea || '';
  const explanation = p.simpleExplanation || p.explanation || '';
  const terms = p.keyTerms || p.terms || [];
  const toRemember = p.toRemember || p.memorize || '';

  let extra = '';

  if (profile === 'svt' && p.mechanism) {
    const steps = p.mechanism.steps || [];
    if (steps.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚙️ ${safeText(p.mechanism.description || 'Mécanisme')}</div>
        <ol class="method-list">${steps.map((s) => `<li>${safeText(s)}</li>`).join('')}</ol>
      </div>`;
    }
  }

  if (profile === 'philosophy') {
    if (Array.isArray(p.arguments) && p.arguments.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚖️ Arguments</div>
        <ul class="simple-list">${p.arguments.map((arg, i) => `<li><span class="num">${i + 1}.</span><span>${safeText(arg)}</span></li>`).join('')}</ul>
      </div>`;
    }
    if (Array.isArray(p.everydayExamples) && p.everydayExamples.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">💡 Exemples du quotidien</div>
        <ul class="simple-list">${p.everydayExamples.map((ex, i) => `<li><span class="num">${i + 1}.</span><span>${safeText(ex)}</span></li>`).join('')}</ul>
      </div>`;
    }
  }

  if (profile === 'language') {
    if (Array.isArray(p.examples) && p.examples.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">🌐 Exemples</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${p.examples.map((ex) => `
            <div>
              <div style="font-size:14px;color:var(--text-light);font-weight:600;">${safeText(ex.english)}</div>
              <div style="font-size:13px;color:var(--text-dim);font-style:italic;">→ ${safeText(ex.french)}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
    if (Array.isArray(p.commonMistakes) && p.commonMistakes.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚠️ Pièges pour francophones</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${p.commonMistakes.map((m) => `
            <div style="font-size:13px;color:var(--text-body);line-height:1.55;">
              <span style="color:#ff9a84;">❌ ${safeText(m.mistake)}</span><br>
              <span style="color:#7ce0aa;">✅ ${safeText(m.correction)}</span>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
  }

  if (Array.isArray(p.relations) && p.relations.length > 0) {
    extra += `<div class="part-terms" style="margin-top:10px;">
      <div class="part-terms-title">🔗 Relations</div>
      <ul class="simple-list">${p.relations.map((r, i) => `<li><span class="num">${i + 1}.</span><span>${safeText(r)}</span></li>`).join('')}</ul>
    </div>`;
  }

  if (profile === 'scientific' && p.example && typeof p.example === 'string') {
    extra += `<div class="part-terms" style="margin-top:10px;">
      <div class="part-terms-title">📝 Exemple</div>
      <div style="font-size:13.5px;color:var(--text-body);line-height:1.6;">${safeText(p.example)}</div>
    </div>`;
  }

  let termsHtml = '';
  if (Array.isArray(terms) && terms.length > 0) {
    termsHtml = `<div class="part-terms">
      <div class="part-terms-title">📚 Termes importants</div>
      <div class="part-terms-list">
        ${terms.map((t) => {
          if (profile === 'language' && t.english) {
            return `<div class="part-term"><strong>${safeText(t.english)}</strong> — ${safeText(t.french || t.meaning || '')}${t.example ? ` <span style="color:var(--text-muted);">(${safeText(t.example)})</span>` : ''}</div>`;
          }
          const term = t.term || t.name || '';
          const meaning = t.meaning || t.definition || '';
          return `<div class="part-term"><strong>${safeText(term)}</strong> — ${safeText(meaning)}</div>`;
        }).join('')}
      </div>
    </div>`;
  }

  let rememberHtml = '';
  if (toRemember && typeof toRemember === 'string' && toRemember.trim()) {
    rememberHtml = `<div class="part-remember"><strong>À retenir</strong>${safeText(toRemember)}</div>`;
  }

  return `
    <div class="part">
      <div class="part-title">${safeText(partTitle)}</div>
      ${mainIdea ? `<div class="part-idea">${safeText(mainIdea)}</div>` : ''}
      ${explanation ? `<div class="part-explanation">${safeText(explanation)}</div>` : ''}
      ${termsHtml}
      ${extra}
      ${rememberHtml}
    </div>
  `;
}

function renderStructure(structure, profile) {
  let html = '';

  if (profile === 'scientific') {
    if (Array.isArray(structure.formulas) && structure.formulas.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-square-root-variable"></i>Formules clés</div>
        <div class="block">
          ${structure.formulas.map((f) => {
            let latex = String(f.latex || '');
            if (latex && !latex.includes('$')) latex = `$$${latex}$$`;
            return `
              <div class="formula-block">
                <div>${safeText(latex)}</div>
                ${f.description ? `<div class="formula-description">${safeText(f.description)}</div>` : ''}
                ${f.condition ? `<div class="formula-condition">${safeText(f.condition)}</div>` : ''}
                ${Array.isArray(f.variables) && f.variables.length > 0 ? `
                  <div class="formula-variables">
                    ${f.variables.map((v) => `<div class="formula-variable"><strong>${safeText(v.symbol)}</strong> : ${safeText(v.meaning)}${v.unit ? ` (${safeText(v.unit)})` : ''}</div>`).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>`;
    }

    if (structure.method && Array.isArray(structure.method.steps) && structure.method.steps.length > 0) {
      html += `<div class="content-section">

function renderQuestion(q, idx) {
  const level = Number(q.level) || 1;
  const importance = Number(q.importance) || 1;
  const iconClass = importance >= 3 ? 'very-important' : importance === 2 ? 'important' : '';

  return `
    <div class="qa-item" data-qa="${idx}">
      <div class="qa-question">
        <div class="qa-q-icon ${iconClass}">Q${idx + 1}</div>
        <div class="qa-q-text">${safeText(q.question)}</div>
        <span class="qa-level l${level}">Niv ${level}</span>
        <div class="qa-toggle"><i class="fas fa-chevron-down"></i></div>
      </div>
      <div class="qa-answer">
        <div class="qa-answer-inner">
          <div class="qa-answer-label"><i class="fas fa-check"></i>Réponse</div>
          <div class="qa-answer-text">${safeText(q.answer)}</div>
          ${Array.isArray(q.mustHave) && q.mustHave.length > 0 ? `
            <div class="qa-musthave">
              <div class="qa-musthave-title">Éléments indispensables</div>
              <ul class="qa-musthave-list">
                ${q.mustHave.map((m) => `<li>${safeText(m)}</li>`).join('')}
              </ul>
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderQcm(q, idx) {
  return `
    <div class="qcm-item" data-correct="${escapeHtml(q.correct || 'A')}">
      <div class="qcm-question">${idx + 1}. ${safeText(q.question)}</div>
      <div class="qcm-options">
        ${(q.options || []).map((opt) => `
          <button class="qcm-option" data-letter="${escapeHtml(opt.id)}">
            <span class="qcm-option-letter">${escapeHtml(opt.id)}</span>
            <span>${safeText(opt.text)}</span>
          </button>
        `).join('')}
      </div>
      ${q.explanation ? `<div class="qcm-explanation"><strong>💡</strong> ${safeText(q.explanation)}</div>` : ''}
    </div>
  `;
}

// VUE 5 — LEÇON COMPLÈTE
// ═══════════════════════════════════════════════════════════════
async function renderLessonView(params) {
  const el = $('view-lesson');
  const { subject, chapterId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Assemblage...');

  try {
    const data = await callApi('getFullLesson', { subject, chapterId });
    const sections = data.sections || [];

    if (sections.length === 0) {
      showEmptyState(el, 'fa-book', 'Leçon vide', 'Aucune section à afficher.');
      return;
    }

    const sectionsHtml = sections.map((s, i) => {
      const a = s.analysis || {};
      let content = '';

      if (a.explanation?.understanding) {
        content += `<div class="block">
          <div class="block-head"><i class="fas fa-lightbulb"></i>À comprendre</div>
          <div class="block-body">${safeText(a.explanation.understanding)}</div>
        </div>`;
      }

      if (a.explanation?.parts) {
        content += a.explanation.parts.map((p) => renderPart(p, s.profile || 'scientific')).join('');
      }

      if (a.structure) {
        content += renderStructure(a.structure, s.profile || 'scientific');
      }

      if (s.userNotes && s.userNotes.trim()) {
        content += `<div class="block">
          <div class="block-head"><i class="fas fa-pen"></i>Mes notes</div>
          <div class="block-body" style="white-space:pre-wrap;">${safeText(s.userNotes)}</div>
        </div>`;
      }

      return `
        <div style="margin-bottom:32px;">
          <div style="font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;">Section ${i + 1}</div>
          <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--text-light);margin-bottom:14px;">${escapeHtml(s.title)}</div>
          ${content}
        </div>
      `;
    }).join('');

    const chapterTitle = data.chapter.title || '';

    el.innerHTML = `
      <div class="page-hero" style="text-align:center;">
        <div style="font-size:32px;margin-bottom:8px;">${info.emoji}</div>
        <div style="font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:6px;">${escapeHtml(info.label)}</div>
        <h1 style="font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text-light);margin-bottom:6px;">${escapeHtml(chapterTitle)}</h1>
        <div style="font-size:13px;color:var(--text-dim);">${sections.length} section${sections.length > 1 ? 's' : ''}</div>
      </div>

      <div class="content-section" style="margin-bottom:32px;">
        <button class="cta-exam" id="goToExamLessonBtn" data-subject="${escapeHtml(subject)}" data-chapter="${escapeHtml(chapterTitle)}">
          <i class="fas fa-file-circle-check"></i>
          <div class="cta-exam-body">
            <div class="cta-exam-title">Passer en mode examen</div>
            <div class="cta-exam-sub">Teste tout le chapitre dans les conditions du BAC</div>
          </div>
          <i class="fas fa-chevron-right cta-exam-arrow"></i>
        </button>
      </div>

      ${sectionsHtml}
    `;

    // Rendu KaTeX automatique (katex-utils.js MutationObserver)

    $('goToExamLessonBtn')?.addEventListener('click', function () {
      var subj = $('goToExamLessonBtn').dataset.subject;
      var chap = $('goToExamLessonBtn').dataset.chapter;
      var examSubject = EXAM_SUBJECT_MAP[subj] || '';
      if (!examSubject) {
        showToast('Cette matière n\'est pas encore disponible en mode examen.', 'info', 3000);
        return;
      }
      var params = new URLSearchParams();
      params.set('subject', examSubject);
      if (chap) params.set('chapter', chap);
      if (chapterId) params.set('chapterId', chapterId);
      params.set('useNotebook', 'true');
      window.location.href = 'exam.html?' + params.toString();
    });

  } catch (err) {
    showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

function closeModal() {
  $('modalBackdrop').classList.remove('show');
  $('modalBackdrop').classList.remove('center');
  $('modalBackdrop').innerHTML = '';
  document.body.style.overflow = '';
}

function openModal(html, { center = false } = {}) {
  $('modalBackdrop').innerHTML = html;
  $('modalBackdrop').classList.add('show');
  if (center) $('modalBackdrop').classList.add('center');
  document.body.style.overflow = 'hidden';

  $('modalBackdrop').querySelector('.modal-close')?.addEventListener('click', closeModal);
  $('modalBackdrop').addEventListener('click', (e) => {
    if (e.target === $('modalBackdrop')) closeModal();
  });
}

function confirmDelete({ title, message, onConfirm }) {
  openModal(`
    <div class="modal-confirm">
      <div class="confirm-icon"><i class="fas fa-trash-alt"></i></div>
      <h3>${escapeHtml(title)}</h3>
      <p>${message}</p>
      <div class="modal-confirm-buttons">
        <button class="btn-cancel" id="confirmCancelBtn">Annuler</button>
        <button class="btn-danger" id="confirmDeleteBtn">Supprimer</button>
      </div>
    </div>
  `, { center: true });

  $('confirmCancelBtn').addEventListener('click', closeModal);

  $('confirmDeleteBtn').addEventListener('click', async () => {
    const btn = $('confirmDeleteBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    try {
      await onConfirm();
      closeModal();
    } catch (e) {
      showToast('Erreur : ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Supprimer';
    }
  });
}
