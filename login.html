<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Connexion">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="perf.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="register-sw.js" defer></script>

  <style>
    /* ============================================================
       ROOT — Design tokens ARVEXA
       ============================================================ */
    :root {
      --primary: #1A3A2A;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --success-light: #3AB67E;
      --danger: #E74C3C;
      --danger-light: #EF9C8E;
      --warning: #F1C40F;

      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --bg-elevated: rgba(255, 255, 255, 0.02);

      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;

      --card-border: rgba(184, 134, 11, 0.08);
      --card-border-hover: rgba(184, 134, 11, 0.18);

      --input-bg: rgba(255, 255, 255, 0.03);
      --input-border: rgba(255, 255, 255, 0.06);
      --input-border-focus: rgba(184, 134, 11, 0.4);

      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-fast: all 0.15s ease;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);

      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 20px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ============================================================
       RESET
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    /* ============================================================
       BACKGROUND
       ============================================================ */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 30% 20% at 70% 80%, rgba(184, 134, 11, 0.03) 0%, transparent 60%),
        linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: -2;
      opacity: 0.15;
      animation: glowFloat 12s ease-in-out infinite alternate;
    }
    .glow-1 { width: 380px; height: 380px; background: rgba(26, 58, 42, 0.25); top: -100px; right: -100px; }
    .glow-2 { width: 250px; height: 250px; background: rgba(184, 134, 11, 0.08); bottom: -60px; left: -60px; animation-delay: -6s; }

    @keyframes glowFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.15); }
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .site-header {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      display: inline-flex;
      align-items: baseline;
      gap: 0;
      text-decoration: none;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(18px, 3vw, 22px);
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-light);
      transition: var(--transition-fast);
    }
    .logo:hover { opacity: 0.85; }
    .logo .gold {
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: italic;
      margin-left: 4px;
      animation: shimmerText 5s linear infinite;
    }
    @keyframes shimmerText {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .header-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-dim);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: var(--transition-fast);
      white-space: nowrap;
    }
    .header-link:hover {
      color: var(--text-light);
      border-color: rgba(184, 134, 11, 0.2);
      background: rgba(184, 134, 11, 0.04);
    }
    .header-link i { font-size: 11px; }

    /* ============================================================
       MAIN CONTAINER
       ============================================================ */
    .page {
      flex: 1;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      animation: pageEnter 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       HERO
       ============================================================ */
    .hero {
      text-align: center;
      padding: 24px 0 28px;
    }

    .hero-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(184, 134, 11, 0.15), rgba(26, 58, 42, 0.1));
      border: 1px solid rgba(184, 134, 11, 0.2);
      font-size: 32px;
      margin-bottom: 20px;
      animation: iconFloat 3s ease-in-out infinite;
      position: relative;
    }
    .hero-icon::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(184, 134, 11, 0.3), transparent, rgba(45, 125, 90, 0.2));
      z-index: -1;
      filter: blur(8px);
      opacity: 0.6;
    }
    @keyframes iconFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 30px;
      background: rgba(184, 134, 11, 0.08);
      border: 1px solid rgba(184, 134, 11, 0.15);
      color: var(--accent-bright);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .hero-badge i { font-size: 12px; }

    .hero-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(28px, 6vw, 38px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-light);
      margin-bottom: 12px;
    }
    .hero-title em {
      color: var(--accent);
      font-style: italic;
    }

    .hero-subtitle {
      font-size: clamp(13px, 1.8vw, 14.5px);
      color: var(--text-dim);
      line-height: 1.6;
      max-width: 380px;
      margin: 0 auto;
      font-weight: 400;
    }

    /* ============================================================
       FORM CARD
       ============================================================ */
    .form-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .form-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--success), var(--accent));
      background-size: 300% 100%;
      animation: borderShimmer 6s linear infinite;
    }
    @keyframes borderShimmer {
      0% { background-position: 0% 0%; }
      100% { background-position: 300% 0%; }
    }

    /* ============================================================
       FORM FIELDS
       ============================================================ */
    .field {
      margin-bottom: 18px;
      position: relative;
      min-width: 0;
      width: 100%;
    }

    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .field-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      transition: var(--transition-fast);
      overflow: hidden;
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
    }
    .field-input-wrap:focus-within {
      border-color: var(--input-border-focus);
      background: rgba(184, 134, 11, 0.02);
      box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.06);
    }
    .field-input-wrap.is-error {
      border-color: rgba(231, 76, 60, 0.4);
      background: rgba(231, 76, 60, 0.02);
    }
    .field-input-wrap.is-error:focus-within {
      box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.08);
    }
    .field-input-wrap.is-success {
      border-color: rgba(45, 125, 90, 0.4);
    }

    .field-input-wrap .icon {
      padding: 0 4px 0 16px;
      color: var(--text-muted);
      font-size: 14px;
      flex-shrink: 0;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
    }
    .field-input-wrap:focus-within .icon {
      color: var(--accent-bright);
    }
    .field-input-wrap.is-error .icon {
      color: var(--danger);
    }

    .field-input-wrap input {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 13px 14px 13px 10px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-light);
      font-size: 15px;
      font-family: inherit;
      font-weight: 400;
      transition: var(--transition-fast);
      box-sizing: border-box;
    }
    .field-input-wrap input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }
    .field-input-wrap input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px #1a1a1a inset !important;
      -webkit-text-fill-color: var(--text-light) !important;
    }

    .field-status {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      pointer-events: none;
      transition: var(--transition-fast);
    }
    .field-status.success { color: var(--success-light); }
    .field-status.error { color: var(--danger); }

    .toggle-pwd {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: var(--transition-fast);
      z-index: 2;
    }
    .toggle-pwd:hover {
      color: var(--accent-bright);
      background: rgba(184, 134, 11, 0.08);
    }

    .field-help {
      display: none;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 6px;
      padding-left: 4px;
      line-height: 1.5;
    }
    .field-help.visible { display: block; }
    .field-help.error { color: var(--danger); }

    /* ============================================================
       LOGIN OPTIONS (remember + forgot)
       ============================================================ */
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0 22px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .remember-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .remember-checkbox input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      min-width: 20px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: var(--transition-fast);
    }
    .remember-checkbox input[type="checkbox"]:checked {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      border-color: var(--accent);
    }
    .remember-checkbox input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 6px;
      height: 11px;
      border: solid #0A0A0A;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .remember-checkbox input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .remember-checkbox label {
      font-size: 12.5px;
      color: var(--text-dim);
      cursor: pointer;
    }

    .forgot-link {
      font-size: 12.5px;
      color: var(--accent-bright);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition-fast);
      border-bottom: 1px solid transparent;
    }
    .forgot-link:hover {
      border-bottom-color: var(--accent-bright);
    }

    /* ============================================================
       SUBMIT BUTTON
       ============================================================ */
  .btn-submit {
  width: 100%;
  padding: 14px 24px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: #0A0A0A;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.2px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(184, 134, 11, 0.15);
  min-height: 50px;
}
    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: left 0.6s ease;
    }
    .btn-submit:not(:disabled):hover::before {
      left: 100%;
    }
    .btn-submit:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(184, 134, 11, 0.35);
    }
    .btn-submit:not(:disabled):active {
      transform: translateY(0) scale(0.98);
    }
    .btn-submit:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-submit .btn-icon { font-size: 14px; }
    .btn-submit .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(10, 10, 10, 0.2);
      border-top-color: #0A0A0A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-submit.loading .spinner { display: block; }
    .btn-submit.loading .btn-icon,
    .btn-submit.loading .btn-text { display: none; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============================================================
       DIVIDER
       ============================================================ */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 22px 0 18px;
    }
    .divider .line { flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
    .divider .text {
      font-size: 11.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    /* ============================================================
       REGISTER LINK
       ============================================================ */
    .btn-register {
      width: 100%;
      padding: 13px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: transparent;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-register:hover {
      border-color: rgba(184,134,11,0.15);
      color: var(--text-light);
      background: rgba(255,255,255,0.03);
      transform: translateY(-1px);
    }
    .btn-register:active { transform: scale(0.98); }

    /* ============================================================
       SECURITY BADGE
       ============================================================ */
    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .security-note i {
      color: var(--success-light);
      font-size: 11px;
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    .site-footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      text-align: center;
    }
    .site-footer p {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .site-footer a {
      color: var(--text-dim);
      text-decoration: none;
      transition: var(--transition-fast);
    }
    .site-footer a:hover { color: var(--accent-bright); }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast-container {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      width: calc(100% - 32px);
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: var(--radius);
      background: rgba(20, 22, 20, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-light);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      animation: toastIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: auto;
    }
    .toast.success { border-color: rgba(45, 125, 90, 0.4); }
    .toast.error { border-color: rgba(231, 76, 60, 0.4); }
    .toast i { font-size: 15px; flex-shrink: 0; }
    .toast.success i { color: var(--success-light); }
    .toast.error i { color: var(--danger); }
    .toast a { color: var(--accent-bright); font-weight: 600; text-decoration: underline; }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .site-header { padding: 16px 16px 0; }
      .page { padding: 0 16px 40px; }
      .hero { padding: 20px 0 22px; }
      .hero-icon { width: 62px; height: 62px; font-size: 28px; margin-bottom: 16px; }
      .hero-badge { font-size: 10px; padding: 5px 12px; }
      .form-card { padding: 22px 18px; }
      .field-input-wrap input { padding: 12px 12px 12px 8px; font-size: 14px; }
      .btn-submit { padding: 13px 18px; min-height: 50px; font-size: 14px; }
      .login-options { flex-direction: column; align-items: flex-start; gap: 8px; }
    }

    @media (max-width: 360px) {
      .site-header { padding: 12px 12px 0; }
      .page { padding: 0 12px 32px; }
      .hero { padding: 16px 0 18px; }
      .hero-icon { width: 56px; height: 56px; font-size: 26px; }
      .hero-title { font-size: 24px; }
      .form-card { padding: 20px 14px; border-radius: 16px; }
      .field { margin-bottom: 14px; }
      .field-input-wrap input { font-size: 13px; padding: 11px 10px 11px 8px; }
      .header-link span { display: none; }
      .header-link { padding: 8px 12px; }
      .btn-submit { font-size: 13.5px; padding: 12px 16px; }
    }

    @media (min-width: 768px) {
      .site-header { max-width: 560px; padding: 24px 24px 0; }
      .page { max-width: 560px; padding: 0 24px 60px; }
      .form-card { padding: 32px 28px; }
    }

    /* ============================================================
       ACCESSIBILITÉ
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent-bright);
      outline-offset: 2px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(184, 134, 11, 0.25);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(184, 134, 11, 0.4);
    }
  </style>
</head>
<body>

  <!-- ===== BACKGROUND ===== -->
  <div class="bg-layer"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="grain"></div>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <a href="index.html" class="logo">
      ARVEX<span class="gold">A School</span>
    </a>
    <a href="register.html" class="header-link">
      <i class="fas fa-user-plus"></i>
      <span>Pas encore membre ?</span>
    </a>
  </header>

  <!-- ===== PAGE ===== -->
  <main class="page">

    <!-- HERO -->
    <section class="hero">
      <div class="hero-icon">🔐</div>
      <div class="hero-badge">
        <i class="fas fa-star"></i>
        <span>Bon retour parmi nous</span>
      </div>
      <h1 class="hero-title">
        Content de te <em>revoir</em> !
      </h1>
      <p class="hero-subtitle">
        Retrouve ton espace personnel et continue ta préparation pour le BAC.
      </p>
    </section>

    <!-- FORM CARD -->
    <div class="form-card">
      <form id="loginForm" novalidate>

        <!-- EMAIL -->
        <div class="field">
          <label class="field-label" for="emailInput">Adresse e-mail</label>
          <div class="field-input-wrap" id="emailWrap">
            <span class="icon"><i class="fas fa-envelope"></i></span>
            <input
              type="email"
              id="emailInput"
              placeholder="exemple@email.com"
              autocomplete="email"
              inputmode="email"
              required
            >
            <span class="field-status" id="emailStatus"></span>
          </div>
          <div class="field-help" id="emailHelp"></div>
        </div>

        <!-- PASSWORD -->
        <div class="field">
          <label class="field-label" for="passwordInput">Mot de passe</label>
          <div class="field-input-wrap" id="passwordWrap">
            <span class="icon"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              id="passwordInput"
              placeholder="Entre ton mot de passe"
              autocomplete="current-password"
              required
              minlength="6"
            >
            <button
              type="button"
              class="toggle-pwd"
              id="togglePassword"
              aria-label="Afficher le mot de passe"
            >
              <i class="fas fa-eye"></i>
            </button>
            <span class="field-status" id="passwordStatus"></span>
          </div>
          <div class="field-help" id="passwordHelp"></div>
        </div>

        <!-- OPTIONS -->
        <div class="login-options">
          <label class="remember-checkbox">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Se souvenir de moi</label>
          </label>
          <a href="forgot-password.html" class="forgot-link">Mot de passe oublié ?</a>
        </div>

        <!-- SUBMIT -->
        <button type="submit" class="btn-submit" id="loginBtn" disabled>
          <span class="btn-icon"><i class="fas fa-sign-in-alt"></i></span>
          <span class="btn-text">Se connecter</span>
          <span class="spinner"></span>
        </button>
      </form>

      <!-- DIVIDER -->
      <div class="divider">
        <span class="line"></span>
        <span class="text">ou</span>
        <span class="line"></span>
      </div>

      <!-- REGISTER -->
      <a href="register.html" class="btn-register">
        <i class="fas fa-user-plus"></i>
        Créer un nouveau compte
      </a>

      <!-- SECURITY -->
      <div class="security-note">
        <i class="fas fa-shield-alt"></i>
        <span>Connexion sécurisée par Firebase</span>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
      <p>
        &copy; 2026 ARVEXA School — Tous droits réservés
        &nbsp;•&nbsp;
        <a href="#" onclick="return false;">Aide</a>
      </p>
    </footer>
  </main>

  <!-- ===== TOASTS ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
  </script>

  <script type="module">
  // ================================================================
  // LOGIN — Version robuste anti-flash
  // ================================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    signInWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import {
    initializeFirestore,
    persistentLocalCache,
    persistentSingleTabManager,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  // ================================================================
  // CONFIG
  // ================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
    authDomain: "arvexa-fbf10.firebaseapp.com",
    projectId: "arvexa-fbf10",
    storageBucket: "arvexa-fbf10.firebasestorage.app",
    messagingSenderId: "920108330053",
    appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ⚡ FIRESTORE AVEC PERSISTANCE LOCALE (mode hors-ligne)
  const db = initializeFirestore(app, {
    localCache: persistentLocalCache({
      tabManager: persistentSingleTabManager()
    })
  });

  try {
    await setPersistence(auth, browserLocalPersistence);
  } catch (e) {}

  // ================================================================
  // DOM
  // ================================================================
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const rememberMe = document.getElementById('rememberMe');
  const togglePassword = document.getElementById('togglePassword');
  const emailWrap = document.getElementById('emailWrap');
  const passwordWrap = document.getElementById('passwordWrap');
  const emailStatus = document.getElementById('emailStatus');
  const passwordStatus = document.getElementById('passwordStatus');
  const emailHelp = document.getElementById('emailHelp');
  const passwordHelp = document.getElementById('passwordHelp');
  const toastContainer = document.getElementById('toastContainer');

  // ================================================================
  // SESSION CACHE
  // ================================================================
  const SESSION_KEY = 'arvexa_session';
  const USER_DATA_KEY = 'arvexa_user_data';
  const REMEMBER_KEY = 'arvexa_remember_email';
  const LAST_UID_KEY = 'arvexa_last_uid';

  function saveSession(user) {
    if (!user) return;
    try {
      const data = {
        uid: user.uid,
        email: user.email,
        lastActive: Date.now()
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(data));
      localStorage.setItem(LAST_UID_KEY, user.uid);
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function clearSession() {
    try {
      localStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  // ================================================================
  // TOAST
  // ================================================================
  function showToast(message, type = 'success', isHtml = false, duration = 4000) {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;

    const icon = type === 'success'
      ? '<i class="fas fa-check-circle"></i>'
      : '<i class="fas fa-exclamation-circle"></i>';

    const content = isHtml ? message : message;

    toast.innerHTML = `${icon}<span>${content}</span>`;
    toastContainer.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(-10px)';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  // ================================================================
  // VALIDATION
  // ================================================================
  function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  }

  function validateForm() {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    const isValid = validateEmail(email) && password.length >= 6;
    loginBtn.disabled = !isValid;
    return isValid;
  }

  function validateField(fieldId) {
    const input = fieldId === 'email' ? emailInput : passwordInput;
    const wrap = fieldId === 'email' ? emailWrap : passwordWrap;
    const status = fieldId === 'email' ? emailStatus : passwordStatus;
    const help = fieldId === 'email' ? emailHelp : passwordHelp;

    const value = input.value.trim();
    let isValid = false;
    let errorMsg = '';

    if (fieldId === 'email') {
      isValid = validateEmail(value);
      errorMsg = 'Format d\'e-mail invalide';
    } else {
      isValid = value.length >= 6;
      errorMsg = 'Le mot de passe doit contenir au moins 6 caractères';
    }

    const hasError = !isValid && value.length > 0;

    if (wrap) {
      wrap.classList.toggle('is-error', hasError);
      wrap.classList.toggle('is-success', isValid && value.length > 0);
    }

    if (status) {
      status.className = 'field-status';
      if (value.length > 0) {
        status.classList.add(isValid ? 'success' : 'error');
        status.innerHTML = isValid ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-times-circle"></i>';
      } else {
        status.innerHTML = '';
      }
    }

    if (help) {
      help.className = 'field-help';
      if (hasError) {
        help.classList.add('visible', 'error');
        help.textContent = errorMsg;
      } else {
        help.textContent = '';
      }
    }
  }

  emailInput.addEventListener('input', () => { validateField('email'); validateForm(); });
  passwordInput.addEventListener('input', () => { validateField('password'); validateForm(); });
  emailInput.addEventListener('blur', () => validateField('email'));
  passwordInput.addEventListener('blur', () => validateField('password'));

  togglePassword.addEventListener('click', function() {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    this.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    this.setAttribute('aria-label', type === 'password' ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
  });

  // ================================================================
  // LOAD SAVED EMAIL
  // ================================================================
  const savedEmail = localStorage.getItem(REMEMBER_KEY);
  if (savedEmail) {
    emailInput.value = savedEmail;
    rememberMe.checked = true;
    validateField('email');
    validateForm();
  }

  // ================================================================
  // AUTH STATE — REDIRECTION ROBUSTE
  // ⚡ Version anti-flash avec attente intelligente
  // ================================================================
  let currentUid = null;
  let isRedirecting = false;
  let isAuthResolved = false;

  onAuthStateChanged(auth, (user) => {
    // ⚡ Première fois que le listener se déclenche
    if (!isAuthResolved) {
      isAuthResolved = true;

      // Cas 1 : Pas d'utilisateur → on reste sur login
      if (!user) {
        // Nettoyer les résidus de session éventuels
        try {
          // Si on est vraiment déconnecté, nettoyer
          if (!localStorage.getItem(SESSION_KEY)) {
            clearSession();
          }
        } catch (e) {}
        return;
      }

      // Cas 2 : Utilisateur restauré → rediriger
      redirectAfterLogin(user);
      return;
    }

    // ⚡ Changements ultérieurs
    if (user && user.uid !== currentUid) {
      // Nouvel utilisateur connecté (après signIn par exemple)
      redirectAfterLogin(user);
    } else if (!user && currentUid) {
      // Déconnexion
      currentUid = null;
      clearSession();
    }
  });

  // ================================================================
  // REDIRECTION APRÈS LOGIN
  // ================================================================
  function redirectAfterLogin(user) {
    if (isRedirecting) return;
    isRedirecting = true;

    currentUid = user.uid;

    console.log('[Login] Utilisateur connecté :', user.email);

    // ⚡ Sauvegarder la session AVANT la redirection
    saveSession(user);

    // ⚡ Récupérer la page de destination
    const requestedRedirect = sessionStorage.getItem('redirectAfterLogin') || sessionStorage.getItem('redirectAfterAuth') || 'index.html';
    const redirectPath = requestedRedirect.startsWith('/') || (!requestedRedirect.includes(':') && !requestedRedirect.startsWith('//')) ? requestedRedirect : 'index.html';
    sessionStorage.removeItem('redirectAfterLogin');
    sessionStorage.removeItem('redirectAfterAuth');

    // ⚡ Redirection immédiate avec replace
    setTimeout(() => {
      window.location.replace(redirectPath);
    }, 200);
  }

  // ================================================================
  // SOUMISSION DU FORMULAIRE
  // ================================================================
  let isSubmitting = false;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (isSubmitting || loginBtn.disabled) return;

    isSubmitting = true;
    loginBtn.disabled = true;
    loginBtn.classList.add('loading');

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    try {
      // 1. Connexion Firebase
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // 2. Vérifier que le profil existe
      const userRef = doc(db, 'users', user.uid);
      const userDoc = await getDoc(userRef);

      if (!userDoc.exists()) {
        await signOut(auth);
        showToast('Profil introuvable. Redirection...', 'error');
        setTimeout(() => window.location.replace('register.html'), 1500);
        isSubmitting = false;
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        return;
      }

      const userData = userDoc.data();

      // 3. Vérifier le statut du compte
      if (userData.accountStatus === 'blocked') {
        await signOut(auth);
        showToast('❌ Ton compte est bloqué. Contacte le support.', 'error', false, 6000);
        isSubmitting = false;
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        return;
      }

      if (userData.accountStatus === 'paused') {
        await signOut(auth);
        showToast('⏸️ Ton compte est en pause. Contacte le support.', 'error', false, 6000);
        isSubmitting = false;
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        return;
      }

      // 4. Succès
      if (rememberMe.checked) {
        localStorage.setItem(REMEMBER_KEY, email);
      } else {
        localStorage.removeItem(REMEMBER_KEY);
      }

      try {
        await updateDoc(userRef, { lastLogin: serverTimestamp() });
      } catch (e) {}

      // ⚡ Sauvegarder la session AVANT de rediriger
      saveSession(user);

      showToast('✅ Connexion réussie !', 'success');

      // ⚡ isRedirecting sera géré par onAuthStateChanged
      // mais on met un fallback au cas où
      const redirectPath = sessionStorage.getItem('redirectAfterLogin') || 'index.html';
      sessionStorage.removeItem('redirectAfterLogin');

      setTimeout(() => {
        if (!isRedirecting) {
          isRedirecting = true;
          window.location.replace(redirectPath);
        }
      }, 800);

    } catch (error) {
      let message = 'Une erreur est survenue.';
      let isHtml = false;

      switch (error.code) {
        case 'auth/user-not-found':
          message = '❌ Aucun compte trouvé. <a href="register.html">Créer un compte</a>';
          isHtml = true;
          break;
        case 'auth/wrong-password':
        case 'auth/invalid-credential':
          message = '❌ Mot de passe incorrect.';
          break;
        case 'auth/too-many-requests':
          message = '⏳ Trop de tentatives. Réessaie dans quelques minutes.';
          break;
        case 'auth/invalid-email':
          message = '❌ Adresse e-mail invalide.';
          break;
        case 'auth/network-request-failed':
          message = '📶 Problème de connexion réseau.';
          break;
        default:
          message = `❌ ${error.message}`;
      }

      showToast(message, 'error', isHtml, 6000);

      loginBtn.disabled = false;
      loginBtn.classList.remove('loading');
    } finally {
      isSubmitting = false;
    }
  });

  console.log('🚀 ARVEXA School — Login (avec session robuste)');
  </script>

</body>
</html>
