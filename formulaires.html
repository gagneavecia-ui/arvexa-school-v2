<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Formulaires BAC Terminale D">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="perf.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="register-sw.js" defer></script>
  <script src="katex-utils.js" defer></script>

  <style>
    /* ============================================================
       ROOT
       ============================================================ */
    :root{
      --accent:#B8860B;--accent-bright:#E0B84A;--accent-dim:rgba(184,134,11,.08);
      --success:#2D7D5A;--success-light:#3AB67E;--danger:#B85C3A;--danger-light:#f87171;
      --warning:#D4A017;--info:#4AAFE0;--blue:#60a5fa;
      --bg-dark:#0A0A0A;--bg-surface:#141414;--bg-card:rgba(20,20,20,.7);
      --text-light:#F5F0E8;--text-dim:#8A8A7A;--text-muted:#5A5A4A;--text-body:#cfd0cc;
      --card-border:rgba(184,134,11,.08);--border-soft:rgba(255,255,255,.05);
      --transition:all .3s cubic-bezier(.25,1,.5,1);--transition-fast:all .15s ease;
      --shadow:0 8px 32px rgba(0,0,0,.4);--radius:16px;
      --font-body:'Inter','Segoe UI',Arial,sans-serif;
      --font-serif:'Playfair Display',Georgia,serif;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth;width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
    body{font-family:var(--font-body);background:var(--bg-dark);color:var(--text-light);
      font-size:14px;line-height:1.6;min-height:100vh;width:100%;overflow-x:hidden;
      -webkit-overflow-scrolling:touch;display:flex;flex-direction:column;
      -webkit-font-smoothing:antialiased;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
    .gradient-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;
      background:radial-gradient(ellipse 40% 30% at 30% 15%,rgba(26,58,42,.16) 0%,transparent 70%),
                  radial-gradient(ellipse 35% 25% at 75% 85%,rgba(184,134,11,.05) 0%,transparent 60%),
                  linear-gradient(180deg,#0A0A0A 0%,#060606 100%)}
    .glow{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:-1;
      opacity:.15;animation:glowMove 10s ease-in-out infinite alternate}
    .glow-1{width:300px;height:300px;background:rgba(26,58,42,.18);top:-80px;right:-80px}
    .glow-2{width:180px;height:180px;background:rgba(184,134,11,.05);bottom:0;left:0;animation-delay:-4s}
    @keyframes glowMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-20px) scale(1.1)}}

    /* HEADER */
    .header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
      padding:calc(10px + var(--safe-top)) 16px 10px;background:rgba(10,10,10,.92);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(184,134,11,.06);gap:12px;min-height:56px}
    .header-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
    .back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
      border:1px solid rgba(255,255,255,.05);background:transparent;color:var(--text-dim);cursor:pointer;
      transition:var(--transition);font-size:16px;text-decoration:none;flex-shrink:0}
    .back-btn:hover{border-color:rgba(184,134,11,.14);color:var(--text-light)}
    .page-title{font-size:clamp(13px,1.6vw,15px);font-weight:600;color:var(--text-light);
      font-family:var(--font-serif);display:flex;align-items:center;gap:8px;min-width:0}
    .page-title i{color:var(--accent-bright);font-size:14px}
    .fav-count{font-size:11px;color:var(--accent-bright);background:rgba(184,134,11,.12);
      padding:2px 9px;border-radius:10px;font-weight:700;display:none;
      border:1px solid rgba(184,134,11,.15)}
    .fav-count.visible{display:inline-block}

    /* CONTAINER */
    .container{max-width:720px;margin:0 auto;padding:12px 12px 32px;width:100%;display:flex;flex-direction:column;gap:10px;flex:1}

    /* SEARCH */
    .search-wrap{position:relative}
    .search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none}
    .search-input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--card-border);
      background:var(--bg-card);backdrop-filter:blur(10px);color:var(--text-light);font-size:13px;
      font-family:var(--font-body);outline:none;transition:var(--transition)}
    .search-input:focus{border-color:rgba(184,134,11,.25);background:rgba(184,134,11,.02)}
    .search-input::placeholder{color:var(--text-muted)}

    /* TABS */
    .tabs{display:flex;gap:4px;background:rgba(255,255,255,.02);border-radius:12px;padding:4px;border:1px solid rgba(255,255,255,.04);overflow-x:auto}
    .tab-btn{flex:1;min-width:70px;padding:9px 6px;border:none;border-radius:10px;background:transparent;color:var(--text-muted);
      font-size:11px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font-body);
      display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
    .tab-btn i{font-size:11px}
    .tab-btn.active{background:rgba(184,134,11,.1);color:var(--accent-bright);border:1px solid rgba(184,134,11,.12)}
    .tab-btn:not(.active){border:1px solid transparent}
    .tab-btn:hover:not(.active){color:var(--text-dim)}

    /* THEME FILTERS */
    .filters{display:flex;gap:6px;flex-wrap:wrap}
    .filter-btn{padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.05);background:transparent;
      color:var(--text-muted);font-size:11px;font-weight:600;cursor:pointer;transition:var(--transition);
      font-family:var(--font-body)}
    .filter-btn.active{background:rgba(184,134,11,.1);color:var(--accent-bright);border-color:rgba(184,134,11,.12)}
    .filter-btn:hover:not(.active){color:var(--text-dim);border-color:rgba(255,255,255,.08)}

    /* CONTENT */
    .content{display:flex;flex-direction:column;gap:16px}

    /* CATEGORY */
    .category-label{font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;
      letter-spacing:1px;padding:4px 0 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(184,134,11,.06)}
    .category-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(184,134,11,.15),transparent)}
    .category-label .cat-count{font-size:10px;color:var(--text-muted);font-weight:500;text-transform:none;letter-spacing:0}

    /* FORMULA CARD */
    .f-card{background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid var(--card-border);
      border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;transition:var(--transition);
      animation:fadeInUp .4s cubic-bezier(.25,1,.5,1) backwards}
    .f-card:nth-child(1){animation-delay:.02s}
    .f-card:nth-child(2){animation-delay:.04s}
    .f-card:nth-child(3){animation-delay:.06s}
    .f-card:nth-child(4){animation-delay:.08s}
    .f-card:nth-child(5){animation-delay:.1s}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .f-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,var(--accent),var(--success))}
    .f-card:hover{border-color:rgba(184,134,11,.2);transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(0,0,0,.2)}

    .f-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
    .f-card-title{font-size:14px;font-weight:700;color:var(--text-light);line-height:1.4;cursor:pointer;
      flex:1;min-width:0}
    .f-card-title:hover{color:var(--accent-bright)}
    .f-card-actions{display:flex;gap:4px;flex-shrink:0}
    .icon-action{background:none;border:1px solid transparent;color:var(--text-muted);font-size:14px;
      cursor:pointer;transition:var(--transition);padding:5px 7px;border-radius:8px;line-height:1;
      display:flex;align-items:center;justify-content:center;min-width:32px;height:32px}
    .icon-action:hover{color:var(--text-light);background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.05)}
    .icon-action.fav:hover{color:var(--accent-bright);background:rgba(184,134,11,.1)}
    .icon-action.fav.active{color:var(--accent-bright)}
    .icon-action.fav.active i{font-weight:900}
    .icon-action.fav.pop i{animation:favPop .4s cubic-bezier(.34,1.56,.64,1)}
    @keyframes favPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}

    /* FORMULE DANS LA CARTE */
    .f-card-formula{
      padding:12px 0;
      border-top:1px solid rgba(255,255,255,.03);
      border-bottom:1px solid rgba(255,255,255,.03);
      margin:4px 0;
      cursor:pointer;
      transition:var(--transition);
      overflow-x:auto;
      overflow-y:hidden;
      -webkit-overflow-scrolling:touch;
      min-height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .f-card-formula:hover{
      background:rgba(184,134,11,.03);
    }
    .f-card-formula .katex{
      color:var(--accent-bright);
      font-size:1.15em;
    }
    .f-card-formula .katex-display{
      margin:0;
    }
    .f-card-formula .katex-display > .katex{
      font-size:1.2em;
    }

    .f-card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .f-tag{font-size:10px;padding:3px 8px;border-radius:8px;font-weight:600}
    .f-tag.units{background:rgba(26,58,42,.12);color:var(--success-light)}
    .f-tag.condition{background:rgba(184,134,11,.06);color:var(--accent-bright)}
    .f-card-note{font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5;font-style:italic}
    .f-card-more{font-size:11px;color:var(--accent-bright);margin-top:8px;font-weight:600;
      display:flex;align-items:center;gap:5px;cursor:pointer;opacity:.85}
    .f-card-more:hover{opacity:1}

    /* EMPTY */
    .empty-state{text-align:center;padding:40px 20px}
    .empty-state i{font-size:32px;color:var(--text-muted);margin-bottom:10px}
    .empty-state h4{font-size:15px;color:var(--text-light);margin-bottom:4px}
    .empty-state p{font-size:12px;color:var(--text-dim)}

    /* SKELETON */
    .skeleton-card{background:var(--bg-card);border:1px solid var(--card-border);border-radius:14px;
      padding:14px 16px;position:relative;overflow:hidden;margin-bottom:8px}
    .skeleton-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,rgba(184,134,11,.1) 0%,rgba(184,134,11,.4) 50%,rgba(184,134,11,.1) 100%);
      background-size:200% 100%;animation:skeletonShimmer 1.6s ease-in-out infinite}
    @keyframes skeletonShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .skeleton-line{background:linear-gradient(90deg,rgba(255,255,255,.03) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.03) 100%);
      background-size:200% 100%;animation:skeletonShimmer 1.6s ease-in-out infinite;border-radius:6px;height:14px;margin-bottom:10px}
    .skeleton-line.title{width:70%;height:16px}
    .skeleton-line.formula{width:100%;height:22px;margin:12px 0;border-radius:8px}
    .skeleton-line.meta{width:40%;height:10px;margin-bottom:0}
    .skeleton-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
    .skeleton-header .skeleton-line.title{margin-bottom:0}
    .skeleton-icon{width:32px;height:32px;border-radius:8px;
      background:linear-gradient(90deg,rgba(255,255,255,.03) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.03) 100%);
      background-size:200% 100%;animation:skeletonShimmer 1.6s ease-in-out infinite;flex-shrink:0}
    .skeleton-category{height:12px;width:120px;border-radius:6px;
      background:linear-gradient(90deg,rgba(184,134,11,.05) 0%,rgba(184,134,11,.15) 50%,rgba(184,134,11,.05) 100%);
      background-size:200% 100%;animation:skeletonShimmer 1.6s ease-in-out infinite;margin:8px 0 12px}
    .content-fade-in{animation:contentFadeIn .4s cubic-bezier(.25,1,.5,1)}
    @keyframes contentFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;
      padding:0;opacity:0;visibility:hidden;transition:all .3s cubic-bezier(.25,1,.5,1)}
    .modal-overlay.show{opacity:1;visibility:visible}
    .modal{background:var(--bg-surface);border:1px solid rgba(184,134,11,.15);
      border-radius:24px 24px 0 0;padding:24px 20px;padding-bottom:calc(24px + var(--safe-bottom));
      max-width:600px;width:100%;max-height:92vh;overflow-y:auto;
      transform:translateY(100%);transition:transform .4s cubic-bezier(.25,1,.5,1);position:relative}
    .modal-overlay.show .modal{transform:translateY(0)}
    .modal::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:24px 24px 0 0;
      background:linear-gradient(90deg,var(--accent),var(--accent-bright),var(--accent))}
    .modal-handle{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);
      margin:0 auto 16px;cursor:grab;transition:background .2s ease}
    .modal-handle:hover{background:rgba(224,184,74,.4)}
    .modal-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:10px;
      border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.03);color:var(--text-muted);
      cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
      transition:var(--transition);z-index:5}
    .modal-close:hover{border-color:rgba(184,134,11,.25);color:var(--text-light);background:rgba(184,134,11,.1)}

    .modal-category{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;
      letter-spacing:1.5px;margin-bottom:8px;padding-right:50px}
    .modal-title{font-size:20px;font-weight:700;color:var(--text-light);font-family:var(--font-serif);
      line-height:1.3;margin-bottom:16px;padding-right:50px}

    .modal-formula-box{
      background:linear-gradient(135deg,rgba(184,134,11,.08),rgba(184,134,11,.04));
      border:1px solid rgba(184,134,11,.15);
      border-radius:14px;
      padding:24px 20px;
      margin:14px 0;
      text-align:center;
      position:relative;
      box-shadow:0 4px 20px rgba(184,134,11,.06);
      overflow-x:auto;
      overflow-y:hidden;
      -webkit-overflow-scrolling:touch;
      min-height:80px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .modal-formula-box::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      border-radius:14px 14px 0 0;
      background:linear-gradient(90deg,transparent,var(--accent-bright),transparent)
    }
    .modal-formula-box .katex{
      color:var(--accent-bright);
      font-size:1.4em;
    }
    .modal-formula-box .katex-display{
      margin:0;
    }
    .modal-formula-box .katex-display > .katex{
      font-size:1.5em;
    }

    .modal-meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
    .modal-meta .f-tag{font-size:11px;padding:5px 10px}

    .modal-section{margin-top:20px}
    .modal-section-title{font-size:12px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;
      letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .modal-section-title i{font-size:14px}

    .modal-explanation{font-size:14px;color:var(--text-body);line-height:1.7;padding:14px 16px;
      background:rgba(255,255,255,.02);border-radius:12px;border-left:3px solid var(--accent)}

    .modal-use-cases{display:flex;flex-direction:column;gap:8px}
    .modal-use-case{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;
      background:rgba(74,175,224,.04);border-radius:10px;border-left:3px solid var(--info)}
    .modal-use-case i{color:var(--info);font-size:14px;margin-top:3px;flex-shrink:0}
    .modal-use-case span{font-size:13.5px;color:var(--text-body);line-height:1.6}

    .modal-example{background:rgba(45,125,90,.04);border:1px solid rgba(45,125,90,.15);border-radius:12px;
      padding:14px 16px}
    .modal-example-title{font-size:13px;font-weight:600;color:var(--success-light);margin-bottom:8px;
      display:flex;align-items:center;gap:6px}
    .modal-example-content{font-size:14px;color:var(--text-body);line-height:1.8}
    .modal-example-content .katex{color:var(--text-light)}

    .modal-warning{background:rgba(184,92,58,.06);border:1px solid rgba(184,92,58,.15);border-radius:12px;
      padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
    .modal-warning i{color:var(--danger-light);font-size:16px;margin-top:2px;flex-shrink:0}
    .modal-warning-content{font-size:13.5px;color:var(--text-body);line-height:1.6}
    .modal-warning-content ul{list-style:none;padding:0}
    .modal-warning-content li{margin-bottom:6px}

    .modal-note{font-size:13px;color:var(--text-body);line-height:1.6;margin:12px 0;padding:12px 14px;
      background:rgba(184,134,11,.04);border-radius:10px;border-left:3px solid var(--accent)}
    .modal-note i{color:var(--accent-bright);margin-right:6px}

    .modal-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
    .modal-btn{flex:1;min-width:120px;padding:12px 16px;border-radius:12px;border:none;
      font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);
      font-family:var(--font-body);display:flex;align-items:center;justify-content:center;gap:6px}
    .modal-btn.primary{background:linear-gradient(135deg,var(--accent-bright),var(--accent));color:#0A0A0A}
    .modal-btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(184,134,11,.25)}
    .modal-btn.secondary{background:rgba(255,255,255,.04);color:var(--text-light);border:1px solid rgba(255,255,255,.06)}
    .modal-btn.secondary:hover{background:rgba(255,255,255,.08)}
    .modal-btn.secondary.fav-active{background:rgba(184,134,11,.12);color:var(--accent-bright);border-color:rgba(184,134,11,.2)}

    .modal-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;
      padding-top:16px;border-top:1px solid rgba(255,255,255,.05)}
    .modal-nav-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;
      border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:var(--text-dim);
      font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font-body)}
    .modal-nav-btn:hover:not(:disabled){background:rgba(184,134,11,.08);color:var(--text-light);border-color:rgba(184,134,11,.15)}
    .modal-nav-btn:disabled{opacity:.35;cursor:not-allowed}
    .modal-nav-btn i{font-size:11px}
    .modal-nav-position{font-size:11px;color:var(--text-muted);font-weight:600}

    /* TOAST */
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
      padding:12px 20px;border-radius:12px;background:var(--bg-card);backdrop-filter:blur(16px);
      border:1px solid var(--card-border);color:var(--text-light);font-size:13px;z-index:3000;
      opacity:0;transition:all .5s cubic-bezier(.25,1,.5,1);max-width:90%;text-align:center;
      box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast .toast-icon{font-size:14px}
    .toast.success .toast-icon{color:var(--success-light)}
    .toast.info .toast-icon{color:var(--accent-bright)}
    .toast.error .toast-icon{color:var(--danger-light)}
    .toast.limit{border-color:rgba(184,92,58,.3)}

   note:'',
   explication:'La formule de Bayes permet d\'inverser les probabilités conditionnelles.',
   usage:['Calculer des probabilités a posteriori'],
   exemple:'$P(A) = 0{,}5$, $P_A(B) = 0{,}8$, $P(B) = 0{,}5 \\implies P_B(A) = 0{,}8$',
   erreurs:['Bien identifier $P(B)$ au dénominateur']},

  {id:'m28',subj:'maths',theme:'Probabilités',name:'Loi binomiale',
   formula:'\\begin{aligned} P(X=k) &= \\binom{n}{k} p^k (1-p)^{n-k} \\\\ E(X) &= np \\\\ V(X) &= np(1-p) \\end{aligned}',
   units:'$\\binom{n}{k} = n!/(k!(n-k)!)$',note:'Schéma de Bernoulli répété $n$ fois.',
   explication:'La loi binomiale modélise une expérience aléatoire répétée $n$ fois.',
   usage:['Calculer la probabilité de $k$ succès sur $n$ essais'],
   exemple:'$P(X=3) = \\binom{5}{3} (1/2)^3 (1/2)^2 = 10/32$',
   erreurs:['Ne pas oublier $\\binom{n}{k}$']},

  {id:'m29',subj:'maths',theme:'Probabilités',name:'Loi normale',
   formula:'f(x) = \\frac{1}{\\sigma\\sqrt{2\\pi}} e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}',
   units:'$\\mu$ = espérance, $\\sigma$ = écart-type',note:'Courbe en cloche.',
   explication:'La loi normale est la plus importante en statistiques.',
   usage:['Modéliser des mesures physiques','Intervalles de confiance'],
   exemple:'$X \\sim \\mathcal{N}(100, 15^2)$ : $P(85 < X < 115) \\approx 0{,}68$',
   erreurs:['Bien identifier $\\mu$ et $\\sigma$']},

  {id:'m30',subj:'maths',theme:'Probabilités',name:'Loi normale centrée réduite',
   formula:'Z = \\frac{X - \\mu}{\\sigma} \\sim \\mathcal{N}(0, 1)',
   note:'',
   explication:'Toute loi normale peut être transformée en loi normale centrée réduite.',
   usage:['Utiliser la table de la loi normale'],
   exemple:'$X \\sim \\mathcal{N}(50, 100)$ : $P(X < 60) = P(Z < 1) \\approx 0{,}8413$',
   erreurs:['Ne pas oublier de diviser par $\\sigma$']},

  {id:'m31',subj:'maths',theme:'Probabilités',name:'Intervalle de confiance',
   formula:'IC = \\left[f - \\frac{1}{\\sqrt{n}} ; f + \\frac{1}{\\sqrt{n}}\\right]',
   units:'n ≥ 30, confiance 95%',note:'$f$ = fréquence observée.',
   explication:'L\'intervalle de confiance à 95%.',
   usage:['Estimer une proportion','Sondages'],
   exemple:'$f = 0{,}30$, $n = 400 \\implies IC = [0{,}25 ; 0{,}35]$',
   erreurs:['Ne s\'applique que pour $n \\geq 30$']},

  // Nombres complexes
  {id:'m32',subj:'maths',theme:'Nombres complexes',name:'Forme algébrique',
   formula:'z = a + ib \\\\ |z| = \\sqrt{a^2 + b^2} \\\\ \\bar{z} = a - ib \\\\ z \\bar{z} = |z|^2 = a^2 + b^2',
   units:'i² = -1',note:'',
   explication:'Un nombre complexe s\'écrit $z = a + ib$.',
   usage:['Calculer un module','Calculer un conjugué'],
   exemple:'$z = 3 + 4i \\implies |z| = 5$',
   erreurs:['$i^2 = -1$']},

  {id:'m33',subj:'maths',theme:'Nombres complexes',name:'Forme trigonométrique et exponentielle',
   formula:'z = r(\\cos\\theta + i\\sin\\theta) = r e^{i\\theta}',
   units:'$r = |z|$, $\\theta = \\arg(z)$',note:'',
   explication:'Tout nombre complexe peut s\'écrire en forme polaire.',
   usage:['Multiplier des complexes','Calculer des puissances'],
   exemple:'$z = 1 + i \\implies z = \\sqrt{2} e^{i\\pi/4}$',
   erreurs:['$\\theta$ modulo $2\\pi$']},

  {id:'m34',subj:'maths',theme:'Nombres complexes',name:'Formule de Moivre',
   formula:'(\\cos\\theta + i\\sin\\theta)^n = \\cos(n\\theta) + i\\sin(n\\theta)',
   units:'n entier relatif',note:'',
   explication:'Cette formule permet de calculer facilement des puissances.',
   usage:['Calculer $(1+i)^{10}$','Linéariser'],
   exemple:'$(1+i)^4 = 4 e^{i\\pi} = -4$',
   erreurs:['Ne s\'applique que pour $|z| = 1$']},

  {id:'m35',subj:'maths',theme:'Nombres complexes',name:'Formules d\'Euler',
   formula:'e^{i\\theta} = \\cos\\theta + i\\sin\\theta \\\\ \\cos\\theta = \\frac{e^{i\\theta} + e^{-i\\theta}}{2} \\\\ \\sin\\theta = \\frac{e^{i\\theta} - e^{-i\\theta}}{2i}',
   note:'',
   explication:'Les formules d\'Euler relient exponentielle complexe et trigonométrie.',
   usage:['Linéariser des puissances'],
   exemple:'$\\cos^2\\theta = \\frac{1 + \\cos(2\\theta)}{2}$',
   erreurs:['Ne pas oublier le $2i$ pour $\\sin$']},

  {id:'m36',subj:'maths',theme:'Nombres complexes',name:'Affixe et géométrie',
   formula:'AB = |z_B - z_A| \\\\ \\arg(z_B - z_A) = \\text{angle}(\\vec{u}, \\overrightarrow{AB})',
   note:'Lien entre complexes et géométrie.',
   explication:'Les complexes permettent de résoudre des problèmes de géométrie.',
   usage:['Calculer des distances','Démontrer alignements'],
   exemple:'$A(1+2i)$, $B(4+6i) \\implies AB = 5$',
   erreurs:['Bien identifier le point d\'origine']},

  // Similitudes planes
  {id:'m36b',subj:'maths',theme:'Similitudes planes',name:'Écriture complexe d\'une similitude directe',
   formula:'z\' = a z + b',
   units:'$a \\in \\mathbb{C}^*$, $b \\in \\mathbb{C}$',note:'Toute similitude directe a une écriture complexe.',
   explication:'Une similitude directe transforme un point d\'affixe $z$ en un point d\'affixe $z\' = az + b$.',
   usage:['Déterminer une similitude','Composer des similitudes'],
   exemple:'$z\' = 2z + 1$ : similitude directe de rapport 2',
   erreurs:['$a \\neq 0$ obligatoire']},

  {id:'m36c',subj:'maths',theme:'Similitudes planes',name:'Rapport, angle, centre',
   formula:'k = |a| \\\\ \\theta = \\arg(a) \\\\ \\text{Centre : } \\omega = \\frac{b}{1-a}',
   units:'$a \\neq 1$ pour un centre',note:'',
   explication:'Une similitude directe est caractérisée par son rapport, son angle et son centre.',
   usage:['Trouver le centre d\'une similitude'],
   exemple:'$z\' = 2i z + 1 \\implies$ rapport 2, angle $\\pi/2$, centre $\\omega = \\frac{1}{1-2i}$',
   erreurs:['Si $a = 1$, c\'est une translation']},

  {id:'m36d',subj:'maths',theme:'Similitudes planes',name:'Similitude directe et rotation',
   formula:'a = e^{i\\theta} \\implies \\text{rotation d\'angle } \\theta',
   note:'Cas particulier.',
   explication:'Si $|a| = 1$, la similitude est une rotation (pure).',
   usage:['Reconnaître une rotation'],
   exemple:'$z\' = iz$ : rotation d\'angle $\\pi/2$ autour de $O$',
   erreurs:['Vérifier que $|a| = 1$']},

  {id:'m36e',subj:'maths',theme:'Similitudes planes',name:'Similitude directe et homothétie',
   formula:'\\arg(a) = 0 \\implies \\text{homothétie de rapport } |a|',
   note:'Cas particulier.',
   explication:'Si $a \\in \\mathbb{R}$, la similitude est une homothétie.',
   usage:['Reconnaître une homothétie'],
   exemple:'$z\' = 2z + 1$ : homothétie de rapport 2',
   erreurs:['Vérifier que $a$ est réel']},

  {id:'m36f',subj:'maths',theme:'Similitudes planes',name:'Composition de similitudes',
   formula:'z \\xrightarrow{S_1} a_1 z + b_1 \\xrightarrow{S_2} a_2(a_1 z + b_1) + b_2 = (a_2 a_1) z + (a_2 b_1 + b_2)',
   note:'',
   explication:'La composée de deux similitudes directes est une similitude directe.',
   usage:['Calculer une composée'],
   exemple:'$S_1 : z\' = 2z$, $S_2 : z\'\' = iz\' \\implies S_2 \\circ S_1 : z\'\' = 2iz$',
   erreurs:['Attention à l\'ordre de composition']},

  // Produit vectoriel
  {id:'m36g',subj:'maths',theme:'Produit vectoriel',name:'Définition du produit vectoriel',

  {id:'m36h',subj:'maths',theme:'Produit vectoriel',name:'Norme du produit vectoriel',

  {id:'m36i',subj:'maths',theme:'Produit vectoriel',name:'Produit vectoriel et colinéarité',

  // Dénombrement
  {id:'m36j',subj:'maths',theme:'Dénombrement',name:'Factorielle',

   explication:'La factorielle de $n$ est le produit de tous les entiers de 1 à $n$.',

   erreurs:['$0! = 1$ (par convention)']},

  {id:'m36k',subj:'maths',theme:'Dénombrement',name:'Arrangements',
   formula:'A_n^k = \\frac{n!}{(n-k)!}',
   units:'n ≥ k',note:'Ordre compte.',

  {id:'m36l',subj:'maths',theme:'Dénombrement',name:'Combinaisons',

  {id:'m37',subj:'maths',theme:'Fonctions trigonométriques',name:'Formules fondamentales',

  {id:'m38',subj:'maths',theme:'Fonctions trigonométriques',name:'Formules d\'addition',

   explication:'Ces formules donnent les fonctions trigonométriques d\'une somme.',

  {id:'m39',subj:'maths',theme:'Fonctions trigonométriques',name:'Valeurs remarquables',

  {id:'p8',subj:'physique',theme:'Mécanique',name:'Énergie mécanique',

   units:'E_m en J',note:'Se conserve si forces conservatives uniquement.',
   explication:'Somme des énergies cinétique et potentielles.',
   usage:['Étudier la conservation'],
   exemple:'Chute libre : $\\frac{1}{2}mv^2 = mgh$',
   erreurs:['Ne se conserve PAS avec frottements']},

  {id:'p9',subj:'physique',theme:'Mécanique',name:'Première loi de Newton (inertie)',
   formula:'\\sum \\vec{F} = \\vec{0} \\implies \\vec{v} = \\text{constante}',
   note:'Mouvement rectiligne uniforme.',
   explication:'Un corps isolé conserve son vecteur vitesse.',
   usage:['Analyser un équilibre'],
   exemple:'Palet sur glace sans frottement',
   erreurs:['Ne s\'applique que si $\\sum F = 0$']},

  {id:'p10',subj:'physique',theme:'Mécanique',name:'Troisième loi de Newton',
   formula:'\\vec{F}_{A \\to B} = -\\vec{F}_{B \\to A}',
   note:'Action-réaction.',
   explication:'Si A exerce une force sur B, B exerce sur A une force opposée.',
   usage:['Analyser un système'],
   exemple:'Fusée : gaz éjectés, fusée propulsée',
   erreurs:['Les forces s\'appliquent sur des objets différents']},

  {id:'p11',subj:'physique',theme:'Mécanique',name:'Chute libre',
   formula:'v = gt \\\\ h = \\frac{1}{2}gt^2 \\\\ v^2 = 2gh',
   units:'sans frottement, g ≈ 9,81 m/s²',note:'',
   explication:'La chute libre est un mouvement uniformément accéléré.',
   usage:['Étudier la chute d\'un objet'],
   exemple:'Chute de 20 m : $v = 20$ m/s',
   erreurs:['Négliger les frottements est une approximation']},

  {id:'p11b',subj:'physique',theme:'Mécanique',name:'Vecteur vitesse',
   formula:'\\vec{v}(t) = \\frac{d\\overrightarrow{OM}}{dt}',
   units:'v en m/s',note:'',
   explication:'Le vecteur vitesse est la dérivée du vecteur position.',
   usage:['Calculer une vitesse instantanée'],
   exemple:'$x(t) = t^2 \\implies v(t) = 2t$',
   erreurs:['C\'est une dérivée VECTORIELLE']},

  {id:'p11c',subj:'physique',theme:'Mécanique',name:'Vecteur accélération',
   formula:'\\vec{a}(t) = \\frac{d\\vec{v}}{dt} = \\frac{d^2\\overrightarrow{OM}}{dt^2}',
   units:'a en m/s²',note:'',
   explication:'L\'accélération est la dérivée du vecteur vitesse.',
   usage:['Calculer une accélération'],
   exemple:'$v(t) = 3t \\implies a(t) = 3$ m/s²',
   erreurs:['Dérivée du vecteur, pas de la norme']},

  {id:'p11d',subj:'physique',theme:'Mécanique',name:'Mouvement circulaire uniforme',
   formula:'a = \\frac{v^2}{R} = \\omega^2 R',
   units:'a en m/s², v en m/s, R en m',note:'',
   explication:'Dans un mouvement circulaire uniforme, l\'accélération est centripète.',
   usage:['Étudier un mouvement circulaire'],
   exemple:'$v = 10$ m/s, $R = 5$ m $\\implies a = 20$ m/s²',
   erreurs:['L\'accélération pointe vers le centre']},

  {id:'p11e',subj:'physique',theme:'Mécanique',name:'Moment d\'une force',
   formula:'M_{\\vec{F}/O} = \\overrightarrow{OM} \\wedge \\vec{F}',
   units:'M en N·m',note:'',
   explication:'Le moment d\'une force mesure sa capacité à faire tourner.',
   usage:['Étudier un équilibre de rotation'],
   exemple:'$F = 10$ N à 0,5 m $\\implies M = 5$ N·m',
   erreurs:['C\'est un produit VECTORIEL']},

  {id:'p11f',subj:'physique',theme:'Mécanique',name:'Théorème du moment cinétique',
   formula:'\\frac{d\\vec{L}_O}{dt} = \\sum \\vec{M}_{\\vec{F}/O}',
   units:'L en kg·m²/s',note:'',
   explication:'La variation du moment cinétique est égale à la somme des moments.',
   usage:['Étudier une rotation'],
   exemple:'Patin qui ramène les bras : $L$ constant',
   erreurs:['Le moment est calculé par rapport à un point fixe']},

  // Électricité
  {id:'p12',subj:'physique',theme:'Électricité',name:'Loi d\'Ohm',
   formula:'U = RI',

   explication:'La tension aux bornes d\'une résistance est proportionnelle au courant.',
   usage:['Calculer une tension','Étudier un circuit'],

   erreurs:['Valable uniquement pour une résistance']},

  {id:'p13',subj:'physique',theme:'Électricité',name:'Puissance électrique',

   units:'P en W',note:'',
   explication:'La puissance électrique dissipée par une résistance.',
   usage:['Calculer une puissance'],

   erreurs:['Attention aux unités']},

  {id:'p14',subj:'physique',theme:'Électricité',name:'Courant alternatif sinusoïdal',

   units:'U en V, ω en rad/s',note:'',
   explication:'Un courant alternatif varie de façon sinusoïdale.',

   erreurs:['La tension efficace est $U_{\\max}/\\sqrt{2}$']},

  {id:'p15',subj:'physique',theme:'Électricité',name:'Condensateur — Charge',
   formula:'q = CU \\\\ i = C \\frac{du}{dt}',
   units:'q en C, C en F, U en V',note:'',
   explication:'Un condensateur stocke de la charge électrique.',
   usage:['Étudier un circuit RC'],
   exemple:'$C = 1$ µF, $U = 10$ V $\\implies q = 10$ µC',
   erreurs:['Le courant est la dérivée de la charge']},

  {id:'p16',subj:'physique',theme:'Électricité',name:'Énergie d\'un condensateur',
   formula:'E = \\frac{1}{2} C U^2 = \\frac{1}{2} \\frac{q^2}{C}',
   units:'E en J',note:'',
   explication:'L\'énergie stockée dans un condensateur.',
   usage:['Calculer une énergie stockée'],
   exemple:'$C = 1$ µF, $U = 10$ V $\\implies E = 50$ µJ',
   erreurs:['Ne pas oublier le $\\frac{1}{2}$']},

  {id:'p17',subj:'physique',theme:'Électricité',name:'Bobine — Auto-induction',
   formula:'u = L \\frac{di}{dt}',
   units:'L en H (henry)',note:'',
   explication:'Une bobine s\'oppose aux variations du courant.',
   usage:['Étudier un circuit RL'],
   exemple:'$L = 0{,}1$ H, $di/dt = 10$ A/s $\\implies u = 1$ V',
   erreurs:['Le courant est continu pour avoir $u = 0$']},

  {id:'p18',subj:'physique',theme:'Électricité',name:'Énergie d\'une bobine',
   formula:'E = \\frac{1}{2} L i^2',
   units:'E en J',note:'',
   explication:'L\'énergie stockée dans une bobine.',
   usage:['Calculer une énergie stockée'],
   exemple:'$L = 0{,}1$ H, $i = 2$ A $\\implies E = 0{,}2$ J',
   erreurs:['Ne pas oublier le $\\frac{1}{2}$']},

  {id:'p19',subj:'physique',theme:'Électricité',name:'Circuit RLC — Pulsation propre',
   formula:'\\omega_0 = \\frac{1}{\\sqrt{LC}} \\\\ T_0 = 2\\pi\\sqrt{LC}',
   units:'ω₀ en rad/s, T₀ en s',note:'',
   explication:'La pulsation propre d\'un circuit LC (libre).',
   usage:['Étudier les oscillations libres'],
   exemple:'$L = 0{,}1$ H, $C = 1$ µF $\\implies \\omega_0 \\approx 3162$ rad/s',
   erreurs:['Valable pour un circuit LC idéal']},

  {id:'p20',subj:'physique',theme:'Électricité',name:'Impédance d\'un circuit RLC',
   formula:'Z = \\sqrt{R^2 + \\left(L\\omega - \\frac{1}{C\\omega}\\right)^2}',
   units:'Z en Ω',note:'',
   explication:'L\'impédance généralise la résistance en AC.',
   usage:['Étudier un circuit RLC en régime forcé'],
   exemple:'À la résonance ($L\\omega = 1/C\\omega$) : $Z = R$',
   erreurs:['L\'impédance dépend de la fréquence']},

  {id:'p21',subj:'physique',theme:'Électricité',name:'Résonance d\'intensité',
   formula:'L\\omega = \\frac{1}{C\\omega} \\iff \\omega_0 = \\frac{1}{\\sqrt{LC}}',
   note:'À la résonance, Z est minimale.',
   explication:'À la résonance, le courant est maximal.',
   usage:['Accorder un circuit'],

   erreurs:['La résonance dépend de $\\omega$']},

  {id:'p22',subj:'physique',theme:'Ondes',name:'Vitesse de propagation',
   formula:'v = \\lambda f = \\frac{\\lambda}{T}',

  {id:'p24',subj:'physique',theme:'Ondes',name:'Interférences constructives/destructives',

  {id:'p25',subj:'physique',theme:'Ondes',name:'Diffraction',

  // Optique
  {id:'p26',subj:'physique',theme:'Optique',name:'Loi de Snell-Descartes',

  {id:'p27',subj:'physique',theme:'Optique',name:'Lentille mince convergente',
   formula:'\\frac{1}{\\overline{OA\'}} - \\frac{1}{\\overline{OA}} = \\frac{1}{f\'}',

  {id:'p28',subj:'physique',theme:'Optique',name:'Grandissement',

  {id:'p29',subj:'physique',theme:'Optique',name:'Vergence d\'une lentille',
   formula:'V = \\frac{1}{f\'}',
   units:'V en dioptries (δ)',note:'',
   explication:'La vergence mesure la puissance d\'une lentille.',

  {id:'p32',subj:'physique',theme:'Physique moderne',name:'Énergie d\'un photon',

  {id:'p33',subj:'physique',theme:'Physique moderne',name:'Effet photoélectrique — Einstein',

  {id:'p35',subj:'physique',theme:'Physique moderne',name:'Énergie de liaison du noyau',

  {id:'c1',subj:'chimie',theme:'Cinétique chimique',name:'Vitesse volumique de réaction',
   formula:'v = \\frac{1}{V} \\frac{dx}{dt}',

  {id:'c2',subj:'chimie',theme:'Cinétique chimique',name:'Temps de demi-réaction',

   erreurs:['$t_{1/2}$ concerne l\'avancement final']},

  {id:'c3',subj:'chimie',theme:'Cinétique chimique',name:'Loi de vitesse (ordre 1)',
   formula:'v = k[A] \\\\ [A](t) = [A]_0 e^{-kt} \\\\ t_{1/2} = \\frac{\\ln 2}{k}',

   explication:'Pour une réaction d\'ordre 1, la vitesse est proportionnelle à la concentration.',

  {id:'c4',subj:'chimie',theme:'Cinétique chimique',name:'Facteurs cinétiques',
   formula:'v \\text{ augmente avec : } T \\uparrow \\text{, } [\\text{réactifs}] \\uparrow \\text{, catalyseur}',
   note:'Le catalyseur ne modifie pas l\'état final.',
   explication:'Certains facteurs accélèrent une réaction chimique.',
   usage:['Comprendre les leviers cinétiques'],
   exemple:'Cuisson des aliments (T°)',
   erreurs:['Un catalyseur ne modifie PAS l\'état final']},

  {id:'c5',subj:'chimie',theme:'Équilibre chimique',name:'Constante d\'équilibre K',
   formula:'K = \\prod_i [X_i]^{\\nu_i}',
   note:'',
   explication:'La constante d\'équilibre caractérise l\'état d\'équilibre.',
   usage:['Calculer des concentrations à l\'équilibre'],
   exemple:'$N_2 + 3H_2 \\rightleftharpoons 2NH_3 \\implies K = \\frac{[NH_3]^2}{[N_2][H_2]^3}$',
   erreurs:['$K$ ne dépend que de la température']},

  {id:'c6',subj:'chimie',theme:'Équilibre chimique',name:'Quotient de réaction Q',
   formula:'Q = \\prod_i [X_i]^{\\nu_i}',
   note:'$Q < K$ : sens direct, $Q > K$ : sens inverse',

   exemple:'Si $Q < K$, la réaction évolue dans le sens direct',
   erreurs:['Ne pas confondre $Q$ et $K$']},

  {id:'c7',subj:'chimie',theme:'Équilibre chimique',name:'Taux d\'avancement final',
   formula:'\\tau = \\frac{x_f}{x_{\\max}}',
   note:'τ = 1 si réaction totale.',
   explication:'Le taux d\'avancement mesure la proportion de réaction réalisée.',

  {id:'c8',subj:'chimie',theme:'Acides et Bases',name:'pH d\'une solution',
   formula:'pH = -\\log[H_3O^+] \\\\ [H_3O^+] = 10^{-pH}',
   note:'',
   explication:'Le pH mesure l\'acidité d\'une solution.',
   usage:['Calculer un pH'],
   exemple:'$[H_3O^+] = 10^{-3}$ M $\\implies$ pH = 3',

  {id:'c9',subj:'chimie',theme:'Acides et Bases',name:'Constante d\'acidité Ka',
   formula:'K_a = \\frac{[H_3O^+][A^-]}{[HA]} \\\\ pK_a = -\\log(K_a)',
   units:'Couple HA/A⁻',note:'',
   explication:'Ka caractérise la force d\'un acide.',
   usage:['Comparer la force des acides'],

   erreurs:['$K_a$ s\'applique au couple $HA/A^-$']},

  {id:'c10',subj:'chimie',theme:'Acides et Bases',name:'Relation pH / pKa',
   formula:'pH = pK_a + \\log\\frac{[A^-]}{[HA]}',
   note:'Équation de Henderson-Hasselbalch.',

   erreurs:['Ne pas oublier le $\\log$']},

  {id:'c11',subj:'chimie',theme:'Acides et Bases',name:'pH d\'un acide fort',
   formula:'pH = -\\log(C)',
   units:'C > 10⁻⁶ mol/L',note:'',
   explication:'Un acide fort est totalement dissocié.',
   usage:['Calculer rapidement un pH'],
   exemple:'HCl à 0,01 M $\\implies$ pH = 2',
   erreurs:['Ne s\'applique qu\'aux acides FORTS']},

  {id:'c12',subj:'chimie',theme:'Acides et Bases',name:'pH d\'une base forte',
   formula:'pH = 14 + \\log(C)',
   units:'C > 10⁻⁶ mol/L',note:'',
   explication:'Une base forte est totalement dissociée.',
   usage:['Calculer le pH d\'une base forte'],
   exemple:'NaOH à 0,01 M $\\implies$ pH = 12',
   erreurs:['Ne s\'applique qu\'aux bases FORTES']},

  {id:'c13',subj:'chimie',theme:'Acides et Bases',name:'pH d\'un acide faible',
   formula:'pH = \\frac{1}{2}(pK_a - \\log C)',
   units:'Approximation si C >> [H₃O⁺]',note:'',
   explication:'Pour un acide faible peu dissocié.',
   usage:['Calculer le pH d\'un acide faible'],
   exemple:'CH₃COOH à 0,01 M, $pK_a = 4{,}75 \\implies$ pH ≈ 3,375',
   erreurs:['Approximation valable si l\'acide est peu dissocié']},

  {id:'c14',subj:'chimie',theme:'Acides et Bases',name:'Produit ionique de l\'eau',
   formula:'K_e = [H_3O^+][OH^-] = 10^{-14} \\\\ pH + pOH = 14',

   explication:'Le produit ionique de l\'eau est constant à T donnée.',

  {id:'c15',subj:'chimie',theme:'Acides et Bases',name:'Domaine de prédominance',

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text || '');
  return div.innerHTML;
}

function vibrate(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

function renderKaTeX(element) {
  if (typeof renderMathInElement !== 'function') {
    setTimeout(() => renderKaTeX(element), 200);
    return;
  }
  try {
    renderMathInElement(element || document.body, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false,
      errorColor: '#f87171',
      strict: false,
      trust: false
    });
  } catch (e) {}
}

let toastTimer = null;
function showToast(message, type = 'success') {
  const icons = {
    success: 'fas fa-check-circle',
    info: 'fas fa-info-circle',
    error: 'fas fa-exclamation-circle',
    limit: 'fas fa-lock'
  };
  toastMessage.textContent = message;
  toast.className = `toast ${type}`;
  toastIcon.className = icons[type] || icons.info;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function renderSkeleton(count = 4) {
  let html = `<div class="skeleton-category"></div>`;
  for (let i = 0; i < count; i++) {
    html += `<div class="skeleton-card">
      <div class="skeleton-header"><div class="skeleton-line title"></div><div class="skeleton-icon"></div></div>
      <div class="skeleton-line formula"></div>
      <div class="skeleton-line meta"></div>
    </div>`;
  }
  contentEl.innerHTML = html;
}

function getFavKey() {
  return currentUid ? `arvexa_fav_formulas_${currentUid}` : 'arvexa_fav_formulas_guest';
}

function loadFavoritesFromLocal() {
  try { return JSON.parse(localStorage.getItem(getFavKey()) || '[]'); }
  catch (e) { return []; }
}

function saveFavoritesToLocal() {
  try { localStorage.setItem(getFavKey(), JSON.stringify(favorites)); } catch (e) {}
}

async function loadFavoritesFromFirestore(uid) {
  try {
    const favRef = doc(db, 'users', uid, 'favorites', 'formulas');
    const snap = await getDoc(favRef);
    if (snap.exists()) {
      const data = snap.data();
      if (Array.isArray(data.ids)) return data.ids;
    }
  } catch (e) {}
  return null;
}

async function saveFavoritesToFirestore(uid) {
  if (!uid) return;
  try {
    const favRef = doc(db, 'users', uid, 'favorites', 'formulas');
    await setDoc(favRef, { ids: favorites, updatedAt: serverTimestamp() }, { merge: true });
  } catch (e) {}
}

function renderTabs() {
  tabsEl.innerHTML = TABS.map(t => {
    const isActive = t.id === activeTab;
    const favCount = t.id === 'favs' ? favorites.length : 0;
    const badge = favCount > 0 ? `<span style="font-size:9px;opacity:.7;margin-left:2px">${favCount}</span>` : '';
    return `<button class="tab-btn ${isActive ? 'active' : ''}" data-tab="${t.id}">
      <i class="fas ${t.icon}"></i> ${t.label}${badge}
    </button>`;
  }).join('');

  tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const newTab = btn.dataset.tab;
      if (newTab === activeTab) return;
      activeTab = newTab;
      activeTheme = 'all';
      searchQuery = '';
      searchInput.value = '';
      vibrate(8);
      renderTabs();
      renderFilters();
      renderSkeleton(3);
      setTimeout(() => renderContent(), 150);
    });
  });
}

function getThemes(subj) {
  const themes = [...new Set(FORMULAS.filter(f => f.subj === subj).map(f => f.theme))];
  return ['all', ...themes];
}

function renderFilters() {
  if (activeTab === 'favs' || searchQuery) {
    filtersEl.innerHTML = '';
    return;
  }
  const themes = getThemes(activeTab);
  const labels = { all: 'Tout' };
  filtersEl.innerHTML = themes.map(t =>
    `<button class="filter-btn ${t === activeTheme ? 'active' : ''}" data-theme="${t}">${labels[t] || escapeHtml(t)}</button>`
  ).join('');

  filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTheme = btn.dataset.theme;
      vibrate(6);
      renderFilters();
      renderContent();
    });
  });
}

function getFiltered() {
  let list = FORMULAS;

  if (activeTab === 'favs') {
    list = list.filter(f => favorites.includes(f.id));
  } else {
    list = list.filter(f => f.subj === activeTab);
  }

  if (activeTheme !== 'all' && activeTab !== 'favs') {
    list = list.filter(f => f.theme === activeTheme);
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(f =>
      (f.name || '').toLowerCase().includes(q) ||
      (f.formula || '').toLowerCase().includes(q) ||
      (f.theme || '').toLowerCase().includes(q) ||
      (f.note && f.note.toLowerCase().includes(q)) ||
      (f.units && f.units.toLowerCase().includes(q)) ||
      (f.explication && f.explication.toLowerCase().includes(q))
    );
  }

  return list;
}

function renderContent() {
  const list = getFiltered();

  if (!list.length) {
    const isFavs = activeTab === 'favs';
    contentEl.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-${isFavs ? 'heart' : 'search'}"></i>
        <h4>${isFavs ? 'Aucun favori' : 'Aucun résultat'}</h4>
        <p>${isFavs ? 'Appuie sur le cœur pour sauvegarder une formule.' : 'Essaye un autre terme de recherche.'}</p>
      </div>
    `;
    return;
  }

  const groups = {};
  list.forEach(f => { (groups[f.theme] = groups[f.theme] || []).push(f); });

  let html = '';
  Object.entries(groups).forEach(([theme, items]) => {
    html += `<div class="category-label">${escapeHtml(theme)} <span class="cat-count">${items.length} formule${items.length > 1 ? 's' : ''}</span></div>`;
    items.forEach(f => {
      const isFav = favorites.includes(f.id);
      const hasExplanation = f.explication || f.exemple || (f.usage && f.usage.length);
      html += `
        <div class="f-card" data-id="${f.id}">
          <div class="f-card-header">
            <div class="f-card-title" data-action="open">${escapeHtml(f.name)}</div>
            <div class="f-card-actions">
              <button class="icon-action copy" data-action="copy" title="Copier"><i class="fas fa-copy"></i></button>
              <button class="icon-action fav ${isFav ? 'active' : ''}" data-action="fav" title="Favori">
                <i class="fa${isFav ? 's' : 'r'} fa-heart"></i>
              </button>
            </div>
          </div>
          <div class="f-card-formula" data-action="open">$$${f.formula}$$</div>
          <div class="f-card-meta">
            ${f.units ? `<span class="f-tag units"><i class="fas fa-ruler" style="margin-right:4px;font-size:9px"></i>${escapeHtml(f.units)}</span>` : ''}
            ${f.condition ? `<span class="f-tag condition"><i class="fas fa-info-circle" style="margin-right:4px;font-size:9px"></i>${escapeHtml(f.condition)}</span>` : ''}
          </div>
          ${f.note ? `<div class="f-card-note"><i class="fas fa-lightbulb" style="margin-right:4px;color:var(--accent);font-size:10px"></i>${escapeHtml(f.note)}</div>` : ''}
          ${hasExplanation ? `<div class="f-card-more" data-action="open"><i class="fas fa-graduation-cap"></i> Voir l'explication complète</div>` : ''}
        </div>
      `;
    });
  });

  contentEl.innerHTML = html;
  contentEl.classList.remove('content-fade-in');
  void contentEl.offsetWidth;
  contentEl.classList.add('content-fade-in');

  renderKaTeX(contentEl);

  contentEl.querySelectorAll('.f-card').forEach(card => {
    const id = card.dataset.id;
    card.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = el.dataset.action;
        if (action === 'open') openFormulaModal(id);
        else if (action === 'copy') copyFormula(id);
        else if (action === 'fav') toggleFavorite(id, el);
      });
    });
  });
}

function toggleFavorite(id, btnEl) {
  const idx = favorites.indexOf(id);
  if (idx === -1) {
    if (favorites.length >= MAX_FAVORITES) {
      showToast(`Limite de ${MAX_FAVORITES} favoris atteinte`, 'limit');
      vibrate([20, 40, 20]);
      return;
    }
    favorites.push(id);
    if (btnEl) {
      btnEl.classList.add('active', 'pop');
      btnEl.querySelector('i').className = 'fas fa-heart';
      setTimeout(() => btnEl.classList.remove('pop'), 400);
    }
    showToast('Ajouté aux favoris', 'success');
  } else {
    favorites.splice(idx, 1);
    if (btnEl) {
      btnEl.classList.remove('active');
      btnEl.querySelector('i').className = 'far fa-heart';
    }
    showToast('Retiré des favoris', 'info');
  }
  vibrate(10);
  saveFavoritesToLocal();
  updateFavCount();
  if (currentUid) saveFavoritesToFirestore(currentUid);
  if (activeTab === 'favs') renderContent();
  renderTabs();
}

function updateFavCount() {
  favCountEl.textContent = favorites.length;
  favCountEl.classList.toggle('visible', favorites.length > 0);
}

function openFormulaModal(id) {
  const f = FORMULAS.find(x => x.id === id);
  if (!f) return;
  currentFormulaId = id;
  const isFav = favorites.includes(f.id);

  const sameSubject = FORMULAS.filter(x => x.subj === f.subj);
  const currentIdx = sameSubject.findIndex(x => x.id === f.id);
  const prevId = currentIdx > 0 ? sameSubject[currentIdx - 1].id : null;
  const nextId = currentIdx < sameSubject.length - 1 ? sameSubject[currentIdx + 1].id : null;

  let explanationHTML = '';
  if (f.explication) {
    explanationHTML = `<div class="modal-section">
      <div class="modal-section-title"><i class="fas fa-book-open"></i> Explication</div>
      <div class="modal-explanation">${escapeHtml(f.explication)}</div>
    </div>`;
  }

  let usageHTML = '';
  if (f.usage && f.usage.length > 0) {
    usageHTML = `<div class="modal-section">
      <div class="modal-section-title"><i class="fas fa-tasks"></i> Quand l'utiliser ?</div>
      <div class="modal-use-cases">
        ${f.usage.map(u => `<div class="modal-use-case"><i class="fas fa-check-circle"></i><span>${escapeHtml(u)}</span></div>`).join('')}
      </div>
    </div>`;
  }

  let exampleHTML = '';
  if (f.exemple) {
    exampleHTML = `<div class="modal-section">
      <div class="modal-section-title"><i class="fas fa-lightbulb"></i> Exemple concret</div>
      <div class="modal-example">
        <div class="modal-example-title"><i class="fas fa-pencil-alt"></i> Application</div>
        <div class="modal-example-content">${escapeHtml(f.exemple).replace(/\n/g, '<br>')}</div>
      </div>
    </div>`;
  }

  let errorsHTML = '';
  if (f.erreurs && f.erreurs.length > 0) {
    errorsHTML = `<div class="modal-section">
      <div class="modal-section-title"><i class="fas fa-exclamation-triangle"></i> Erreurs fréquentes</div>
      <div class="modal-warning">
        <i class="fas fa-exclamation-triangle"></i>
        <div class="modal-warning-content"><ul>
          ${f.erreurs.map(err => `<li>• ${escapeHtml(err)}</li>`).join('')}
        </ul></div>
      </div>
    </div>`;
  }

  modalContent.innerHTML = `
    <div class="modal-handle"></div>
    <button class="modal-close" id="modalCloseBtn"><i class="fas fa-xmark"></i></button>
    <div class="modal-category">${escapeHtml(f.theme)}</div>
    <div class="modal-title">${escapeHtml(f.name)}</div>
    <div class="modal-formula-box">$$${f.formula}$$</div>
    <div class="modal-meta">
      ${f.units ? `<span class="f-tag units"><i class="fas fa-ruler" style="margin-right:5px;font-size:10px"></i>${escapeHtml(f.units)}</span>` : ''}
      ${f.condition ? `<span class="f-tag condition"><i class="fas fa-info-circle" style="margin-right:5px;font-size:10px"></i>${escapeHtml(f.condition)}</span>` : ''}
    </div>
    ${f.note ? `<div class="modal-note"><i class="fas fa-lightbulb"></i>${escapeHtml(f.note)}</div>` : ''}
    ${explanationHTML}
    ${usageHTML}
    ${exampleHTML}
    ${errorsHTML}
    <div class="modal-actions">
      <button class="modal-btn primary" id="modalCopyBtn"><i class="fas fa-copy"></i> Copier</button>
      <button class="modal-btn secondary ${isFav ? 'fav-active' : ''}" id="modalFavBtn">
        <i class="fa${isFav ? 's' : 'r'} fa-heart"></i> ${isFav ? 'Retirer' : 'Favori'}
      </button>
    </div>
    <div class="modal-nav">
      <button class="modal-nav-btn" id="modalPrevBtn" ${!prevId ? 'disabled' : ''}>
        <i class="fas fa-chevron-left"></i> Précédent
      </button>
      <span class="modal-nav-position">${currentIdx + 1} / ${sameSubject.length}</span>
      <button class="modal-nav-btn" id="modalNextBtn" ${!nextId ? 'disabled' : ''}>
        Suivant <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  `;

  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
  renderKaTeX(modalContent);

  document.getElementById('modalCloseBtn').addEventListener('click', closeFormulaModal);
  document.getElementById('modalCopyBtn').addEventListener('click', () => copyFormula(f.id));
  document.getElementById('modalFavBtn').addEventListener('click', () => {
    toggleFavorite(f.id, null);
    closeFormulaModal();
    setTimeout(() => openFormulaModal(f.id), 150);
  });
  document.getElementById('modalPrevBtn').addEventListener('click', () => {
    if (prevId) { closeFormulaModal(); setTimeout(() => openFormulaModal(prevId), 100); }
  });
  document.getElementById('modalNextBtn').addEventListener('click', () => {
    if (nextId) { closeFormulaModal(); setTimeout(() => openFormulaModal(nextId), 100); }
  });

  setupModalSwipe(modalContent);
  modalContent.scrollTop = 0;
  vibrate(10);
}

function setupModalSwipe(sheet) {
  let startY = 0, currentY = 0, isDragging = false;
  sheet.addEventListener('touchstart', (e) => {
    const rect = sheet.getBoundingClientRect();
    const touchY = e.touches[0].clientY;
    if (touchY - rect.top < 80) {
      startY = touchY;
      currentY = touchY;
      isDragging = true;
      sheet.style.transition = 'none';
    }
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    currentY = e.touches[0].clientY;
    const diff = currentY - startY;
    if (diff > 0) {
      sheet.style.transform = `translateY(${diff}px)`;
      e.preventDefault();
    }
  }, { passive: false });
  sheet.addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;
    sheet.style.transition = '';
    const diff = currentY - startY;
    if (diff > 100) {
      sheet.style.transform = `translateY(100%)`;
      setTimeout(() => {
        modal.classList.remove('show');
        sheet.style.transform = '';
      }, 300);
    } else {
      sheet.style.transform = '';
    }
    startY = 0;
    currentY = 0;
  }, { passive: true });
}

function closeFormulaModal() {
  modal.classList.remove('show');
  document.body.style.overflow = '';
  currentFormulaId = null;
}

modal.addEventListener('click', (e) => {
  if (e.target === modal) closeFormulaModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modal.classList.contains('show')) {
    closeFormulaModal();
  }
});

async function copyFormula(id) {
  const f = FORMULAS.find(x => x.id === id);
  if (!f) return;
  let text = `${f.name}\n\n${f.formula}`;
  if (f.note) text += `\n\n${f.note}`;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    showToast('Formule copiée', 'success');
    vibrate(10);
  } catch (e) {
    showToast('Impossible de copier', 'error');
  }
}

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim();
  renderFilters();
  clearTimeout(searchTimer);
  if (searchQuery.length > 0) {
    renderSkeleton(3);
    searchTimer = setTimeout(() => renderContent(), 180);
  } else {
    renderContent();
  }
});

// ================================================================
// AUTH ROBUSTE — Anti-flash
// ================================================================
let isRedirecting = false;
let isAuthResolved = false;
let graceTimer = null;
let maxTimer = null;

function redirectToLogin() {
  if (isRedirecting) return;
  isRedirecting = true;
  try {
    sessionStorage.setItem('redirectAfterLogin',
      window.location.pathname + window.location.search);
  } catch (e) {}
  window.location.replace('login.html');
}

function initAuthGuard(onAuthenticated) {
  auth.onAuthStateChanged((user) => {
    if (isAuthResolved) {
      if (user && user.uid !== currentUid) {
        currentUid = user.uid;
        saveSession(user);
        onAuthenticated(user);
      } else if (!user && currentUid) {
        currentUid = null;
        clearSession();
        redirectToLogin();
      }
      return;
    }

    if (!user) {
      if (graceTimer) clearTimeout(graceTimer);
      graceTimer = setTimeout(() => {
        if (isAuthResolved) return;
        if (auth.currentUser) return;

        const hasSession = localStorage.getItem(SESSION_KEY);
        const hasUserData = localStorage.getItem(USER_DATA_KEY);

        if ((hasSession || hasUserData) && !navigator.onLine) {
          setTimeout(() => {
            if (auth.currentUser) return;
            if (!isAuthResolved) redirectToLogin();
          }, 1500);
          return;
        }

        if (hasSession && hasUserData) {
          setTimeout(() => {
            if (auth.currentUser) return;
            if (!isAuthResolved) redirectToLogin();
          }, 1500);
          return;
        }

        redirectToLogin();
      }, 600);
      return;
    }

    if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
    if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }

    isAuthResolved = true;
    currentUid = user.uid;
    saveSession(user);
    onAuthenticated(user);
  });

  maxTimer = setTimeout(() => {
    if (isAuthResolved) return;
    if (auth.currentUser) {
      isAuthResolved = true;
      currentUid = auth.currentUser.uid;
      saveSession(auth.currentUser);
      onAuthenticated(auth.currentUser);
    } else {
      redirectToLogin();
    }
  }, 5000);
}

// ================================================================
// LANCER LA PROTECTION
// ================================================================
initAuthGuard(async (user) => {
  // Cache-first : favoris depuis localStorage
  favorites = loadFavoritesFromLocal();
  updateFavCount();
  renderTabs();
  renderFilters();

  setTimeout(() => renderContent(), 200);

  // Synchronisation Firestore en arrière-plan
  if (!isSyncing) {
    isSyncing = true;
    try {
      const remote = await loadFavoritesFromFirestore(user.uid);
      if (remote && Array.isArray(remote)) {
        const merged = [...new Set([...favorites, ...remote])].slice(0, MAX_FAVORITES);
        if (merged.length !== favorites.length || JSON.stringify(merged) !== JSON.stringify(favorites)) {
          favorites = merged;
          saveFavoritesToLocal();
          saveFavoritesToFirestore(user.uid);
          updateFavCount();
          renderTabs();
          renderContent();
        }
      } else {
        if (favorites.length > 0) saveFavoritesToFirestore(user.uid);
      }
    } catch (e) {}
    isSyncing = false;
  }
});

// ================================================================
// INIT
// ================================================================
renderTabs();
renderFilters();
renderSkeleton(4);
updateFavCount();

console.log('🚀 ARVEXA — Formulaires (avec session robuste)');
</script>
