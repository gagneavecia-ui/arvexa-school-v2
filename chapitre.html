<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Chapitre">
  <meta name="view-transition" content="same-origin">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="perf.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="register-sw.js" defer></script>
  <script src="spa-router.js" defer></script>

  <style>
    /* ============================================================
       ROOT — Design system ARVEXA
       ============================================================ */
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #B85C3A;
      --warning: #D4A017;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.08);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; width: 100%; overflow-x: hidden; }
    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }

    .gradient-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26, 58, 42, 0.16) 0%, transparent 70%),
                  radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }

    .glow {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
      opacity: 0.15; animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 300px; height: 300px; background: rgba(26,58,42,0.18); top: -80px; right: -80px; }
    .glow-2 { width: 180px; height: 180px; background: rgba(184,134,11,0.05); bottom: 0; left: 0; animation-delay: -4s; }
    @keyframes glowMove { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-20px) scale(1.1); } }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      position: sticky; top: 0; z-index: 50; display: flex; align-items: center;
      justify-content: space-between; padding: calc(10px + var(--safe-top)) 16px 10px;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px); border-bottom: 1px solid rgba(184,134,11,0.06);
      gap: 12px; min-height: 56px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .back-btn {
      display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: var(--transition); font-size: 16px;
      text-decoration: none; flex-shrink: 0;
    }
    .back-btn:hover { border-color: rgba(184,134,11,0.14); color: var(--text-light); }
    .page-title {
      font-size: clamp(13px, 1.6vw, 15px); font-weight: 600; color: var(--text-light);
      font-family: 'Playfair Display', serif;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: clamp(180px, 50vw, 350px);
    }
    .page-title i { color: var(--accent-bright); margin-right: 6px; font-size: 13px; }

    /* ============================================================
       CONTAINER
       ============================================================ */
    .container { max-width: 640px; margin: 0 auto; padding: 12px 12px 32px; width: 100%; display: flex; flex-direction: column; gap: 12px; flex: 1; }

    /* ============================================================
       CHAPTER INFO
       ============================================================ */
    .chapter-info {
      display: flex; align-items: center; gap: clamp(10px, 1.4vw, 16px);
      padding: clamp(12px, 1.5vw, 16px) clamp(14px, 1.8vw, 20px);
      border-radius: var(--radius); background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--card-border); position: relative; overflow: hidden;
    }
    .chapter-info::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--success), var(--accent));
    }
    .ci-num {
      width: clamp(36px, 5vw, 44px); height: clamp(36px, 5vw, 44px);
      border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: clamp(14px, 1.8vw, 18px);
      font-weight: 700; flex-shrink: 0;
      font-family: 'Playfair Display', serif;
      background: rgba(184,134,11,0.1); color: var(--accent-bright);
      border: 1px solid rgba(184,134,11,0.12);
    }
    .ci-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .ci-title {
      font-size: clamp(14px, 1.6vw, 17px);
      font-weight: 600; color: var(--text-light); line-height: 1.3;
    }
    .ci-sub {
      font-size: clamp(10px, 1.1vw, 12px);
      color: var(--text-muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .ci-status {
      font-size: clamp(9px, 0.9vw, 11px);
      font-weight: 600; padding: 2px 8px; border-radius: 10px;
      white-space: nowrap;
    }
    .ci-status.premium { background: rgba(184,134,11,0.1); color: var(--accent-bright); }
    .ci-status.free { background: rgba(45,125,90,0.1); color: var(--success); }
    .ci-status.locked { background: rgba(184,92,58,0.1); color: var(--danger); }

    /* ============================================================
       CHAPTER PROGRESS
       ============================================================ */
    .chapter-progress {
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: clamp(10px, 1.2vw, 14px) clamp(14px, 1.8vw, 20px);
      transition: var(--transition);
    }
    .chapter-progress:hover { border-color: rgba(184,134,11,0.1); }
    .chapter-progress .cp-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: clamp(10px, 1.1vw, 12px);
      color: var(--text-dim); flex-wrap: wrap; gap: 4px;
    }
    .chapter-progress .cp-header strong { color: var(--text-light); }
    .chapter-progress .cp-header .cp-percent {
      font-weight: 700; color: var(--accent-bright);
      font-size: clamp(11px, 1.2vw, 13px);
    }
    .chapter-progress .cp-track {
      width: 100%; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,0.06); overflow: hidden; margin-top: 5px;
      position: relative;
    }
    .chapter-progress .cp-track .cp-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      width: 0%;
      position: relative;
    }
    .chapter-progress .cp-track .cp-fill::after {
      content: '';
      position: absolute; right: 0; top: 0;
      width: 20px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15));
      animation: shimmerProgress 2s ease-in-out infinite;
    }
    @keyframes shimmerProgress {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ============================================================
       TABS
       ============================================================ */
    .tabs {
      display: flex; gap: 4px; background: rgba(255,255,255,0.02); border-radius: 12px;
      padding: 4px; border: 1px solid rgba(255,255,255,0.04);
    }
    .tab-btn {
      flex: 1; padding: clamp(8px, 1vw, 12px) clamp(6px, 0.8vw, 10px);
      border: none; border-radius: 10px; background: transparent;
      color: var(--text-muted); font-size: clamp(10px, 1.1vw, 13px);
      font-weight: 600; cursor: pointer;
      transition: var(--transition); font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      position: relative;
    }
    .tab-btn i { font-size: clamp(11px, 1.1vw, 14px); }
    .tab-btn.active {
      background: rgba(184,134,11,0.1); color: var(--accent-bright);
      border: 1px solid rgba(184,134,11,0.12);
    }
    .tab-btn:not(.active) { border: 1px solid transparent; }
    .tab-btn:hover:not(.active) { color: var(--text-dim); }

    /* ============================================================
       CARDS VIEW
       ============================================================ */
    .cards-view { display: flex; flex-direction: column; gap: 8px; flex: 1; }

    /* ============================================================
       PART CARD
       ============================================================ */
    .part-card {
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: clamp(12px, 1.5vw, 18px) clamp(14px, 1.8vw, 20px);
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; gap: clamp(10px, 1.4vw, 16px);
      position: relative; overflow: hidden;
      text-decoration: none; color: inherit;
    }
    .part-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0; transition: opacity 0.3s ease;
    }
    .part-card:hover { border-color: rgba(184,134,11,0.15); transform: translateY(-2px); }
    .part-card:hover::before { opacity: 1; }
    .part-card:active { transform: scale(0.98); }
    .part-card.locked { opacity: 0.7; }
    .part-card.locked:hover { opacity: 0.85; }

    .part-card.read {
      border-color: rgba(45, 125, 90, 0.25);
      background: rgba(45, 125, 90, 0.04);
    }
    .part-card.read::before {
      background: linear-gradient(90deg, transparent, var(--success), transparent);
      opacity: 1;
    }
    .part-card.read .pc-icon {
      background: rgba(45, 125, 90, 0.12);
      color: var(--success);
      border-color: rgba(45, 125, 90, 0.2);
    }

    .pc-icon {
      width: clamp(36px, 4.5vw, 48px);
      height: clamp(36px, 4.5vw, 48px);
      border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: clamp(15px, 1.8vw, 20px);
      flex-shrink: 0;
      background: rgba(184,134,11,0.06); color: var(--accent-bright);
      border: 1px solid rgba(184,134,11,0.08);
      transition: var(--transition);
    }
    .pc-icon.exo { background: rgba(45,125,90,0.06); color: var(--success); border-color: rgba(45,125,90,0.08); }
    .pc-icon.corr { background: rgba(74,175,224,0.06); color: #4AAFE0; border-color: rgba(74,175,224,0.08); }

    .pc-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .pc-title {
      font-size: clamp(13px, 1.4vw, 15px);
      font-weight: 600; color: var(--text-light); line-height: 1.3;
      display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px;
    }
    .pc-title .pc-badge {
      font-size: clamp(8px, 0.9vw, 10px);
      font-weight: 600; padding: 1px 8px; border-radius: 10px;
      white-space: nowrap;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .pc-title .pc-badge.read {
      color: var(--success); background: rgba(45,125,90,0.1);
      border: 1px solid rgba(45,125,90,0.12);
    }
    .pc-title .pc-badge.premium {
      color: var(--accent-bright); background: rgba(184,134,11,0.1);
      border: 1px solid rgba(184,134,11,0.12);
    }
    .pc-title .pc-badge.free {
      color: var(--success); background: rgba(45,125,90,0.1);
      border: 1px solid rgba(45,125,90,0.12);
    }
    .pc-sub {
      font-size: clamp(10px, 1vw, 12px);
      color: var(--text-muted);
    }
    .pc-arrow {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 8px;
      background: rgba(255,255,255,0.03); color: var(--text-muted);
      flex-shrink: 0; transition: var(--transition); font-size: clamp(10px, 1vw, 12px);
    }
    .part-card:hover .pc-arrow {
      color: var(--accent-bright); background: rgba(184,134,11,0.08);
      transform: translateX(2px);
    }

    /* ============================================================
       LOADING & EMPTY
       ============================================================ */
    .loading-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 20px; gap: 12px; min-height: 200px;
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid rgba(184,134,11,0.15);
      border-top-color: var(--accent-bright); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { font-size: 13px; color: var(--text-muted); }

    .empty-state {
      text-align: center; padding: 60px 24px; display: flex; flex-direction: column;
      align-items: center; gap: 14px;
    }
    .empty-state .es-icon {
      width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center;
      justify-content: center; background: rgba(184,134,11,0.06); border: 1px solid rgba(184,134,11,0.08);
      font-size: 24px; color: var(--text-muted);
    }
    .empty-state h4 { font-size: clamp(15px, 1.6vw, 18px); color: var(--text-dim); font-weight: 600; }
    .empty-state p { font-size: 13px; color: var(--text-muted); max-width: 300px; line-height: 1.6; }

    /* ═══════════════════════════════════════════════════════════════════
   ARVEXA — POP-UP PREMIUM UNIVERSEL
   Version 10 — Réduite · Bouton unique
   Un seul design pour toutes les pages · Contenu adapté par page
   ═══════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────────────────────
   1. OVERLAY
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.30s cubic-bezier(0.4, 0, 0.2, 1),
              visibility 0.30s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.arvexa-popup-overlay.show {
  opacity: 1;
  visibility: visible;
}

/* ─────────────────────────────────────────────────────────────
   2. CARTE
   ───────────────────────────────────────────────────────────── */
.arvexa-popup {
  position: relative;
  width: 100%;
  max-width: 360px;
  margin: auto;
  padding: 30px 26px 22px;
  border: 1px solid rgba(224, 184, 74, 0.20);
  border-radius: 22px;
  background:
    radial-gradient(ellipse 120% 70% at 50% -10%, rgba(224, 184, 74, 0.10) 0%, transparent 65%),
    radial-gradient(ellipse 100% 50% at 50% 110%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
    linear-gradient(165deg, #171717 0%, #0b0b0b 100%);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.02),
    0 0 60px rgba(224, 184, 74, 0.08),
    0 24px 60px rgba(0, 0, 0, 0.70),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  transform: scale(0.94) translateY(20px);
  transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
  overflow: hidden;
  isolation: isolate;
}
.arvexa-popup-overlay.show .arvexa-popup {
  transform: scale(1) translateY(0);
}

.arvexa-popup::before {
  content: '';
  position: absolute;
  top: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  border-radius: 0 0 4px 4px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(224, 184, 74, 0.4) 20%,
    #E0B84A 50%,
    rgba(224, 184, 74, 0.4) 80%,
    transparent 100%);
  opacity: 0.9;
  z-index: 2;
}

.arvexa-popup::after {
  content: '';
  position: absolute;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(224, 184, 74, 0.18) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  filter: blur(6px);
}

/* ─────────────────────────────────────────────────────────────
   3. BOUTON FERMER
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-close {
  position: absolute;
  top: 13px;
  right: 13px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.03);
  color: #6A6A5A;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  z-index: 4;
  -webkit-tap-highlight-color: transparent;
}
.arvexa-popup-close:hover {
  background: rgba(224, 184, 74, 0.12);
  color: #E0B84A;
  transform: rotate(90deg) scale(1.05);
}
.arvexa-popup-close:active {
  transform: rotate(90deg) scale(0.95);
}

/* ─────────────────────────────────────────────────────────────
   4. ICÔNE
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 30%, rgba(224, 184, 74, 0.22), rgba(184, 134, 11, 0.08) 70%);
  border: 1px solid rgba(224, 184, 74, 0.28);
  color: #E0B84A;
  font-size: 26px;
  margin: 0 auto 16px;
  position: relative;
  z-index: 1;
  animation: arvexaCrownPulse 3s ease-in-out infinite;
  box-shadow:
    0 0 20px rgba(224, 184, 74, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
@keyframes arvexaCrownPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow:
      0 0 20px rgba(224, 184, 74, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  50% {
    transform: scale(1.04);
    box-shadow:
      0 0 34px rgba(224, 184, 74, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
}

/* ─────────────────────────────────────────────────────────────
   5. TITRE
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 22px;
  font-weight: 700;
  color: #F5F0E8;
  line-height: 1.25;
  margin: 0 0 10px;
  letter-spacing: -0.015em;
  position: relative;
  z-index: 1;
}
.arvexa-popup-title em {
  color: #E0B84A;
  font-style: italic;
  font-weight: 700;
}

/* ─────────────────────────────────────────────────────────────
   6. MESSAGE
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-message {
  font-size: 13.5px;
  color: #8A8A7A;
  line-height: 1.6;
  margin: 0 auto 20px;
  max-width: 280px;
  position: relative;
  z-index: 1;
}
.arvexa-popup-message strong {
  color: #E0B84A;
  font-weight: 700;
}

/* ─────────────────────────────────────────────────────────────
   7. BÉNÉFICES (desktop)
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-benefits {
  display: none;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 22px;
  padding: 14px 0;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  position: relative;
  z-index: 1;
}
.arvexa-popup-benefits span {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  font-size: 11px;
  color: #8A8A7A;
  line-height: 1.35;
  text-align: center;
  font-weight: 500;
}
.arvexa-popup-benefits span::before {
  content: '✓';
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(224, 184, 74, 0.10);
  border: 1px solid rgba(224, 184, 74, 0.22);
  color: #E0B84A;
  font-weight: 800;
  font-size: 11px;
  line-height: 1;
}

@media (min-width: 600px) {
  .arvexa-popup-benefits {
    display: grid;
  }
}

/* ─────────────────────────────────────────────────────────────
   8. ACTION (bouton unique)
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-actions {
  display: flex;
  position: relative;
  z-index: 1;
}

function toDate(value) {
  if (!value) return null;
  if (typeof value.toDate === 'function') return value.toDate();
  if (value.seconds !== undefined) return new Date(value.seconds * 1000);
  const date = value instanceof Date ? value : new Date(value);
  return Number.isNaN(date.getTime()) ? null : date;
}

  document.getElementById('chapNum').textContent = chapIdx + 1;
  document.getElementById('chapTitle').textContent = title;
  document.getElementById('chapSub').textContent = subjectConfig.name + ' — Chapitre ' + (chapIdx + 1) + ' / ' + chapters.length;

  if (isFree) {
    statusEl.textContent = '🎁 Gratuit';
    statusEl.className = 'ci-status free';
  } else if (isPremium) {
    statusEl.textContent = '👑 Premium';
    statusEl.className = 'ci-status premium';
  } else {
    statusEl.textContent = '🔒 Verrouillé';
    statusEl.className = 'ci-status locked';
  }

  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });

  loadManifest();
}

// ✅ C11 — warn + message plus précis
function loadManifest() {
  const container = document.getElementById('cardsView');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Chargement...</p></div>';

  const manifestPath = 'cours/' + subjectKey + '.json';

  fetch(manifestPath)
    .then((r) => {
      if (!r.ok) {
        throw new Error('HTTP ' + r.status + ' sur ' + manifestPath);
      }
      return r.json();
    })
    .then((data) => {
      const chapter = (data.chapters || []).find((c) => c.number === chapIdx);
      if (!chapter) {
        currentParts = [];
        renderEmpty();
        return;
      }

      let partsKey;
      if (currentTab === 'cours') partsKey = 'cours';
      else if (currentTab === 'exercices') partsKey = 'exercices';
      else partsKey = 'corrections';

      const rawParts = chapter[partsKey] || [];

      currentParts = rawParts.map((p) => ({
        title: p.title || `Partie ${p.part}`,
        file: p.file || '',
        part: p.part,
        duration: p.duration || 0
      }));

      renderCards();
    })
    .catch((err) => {
      // ✅ C11 — warn au lieu du silence
      console.warn('[Chapitre] loadManifest:', err.message);
      currentParts = [];
      renderEmpty();
    });
}

function renderCards() {
  const container = document.getElementById('cardsView');
  if (currentParts.length === 0) {
    renderEmpty();
    return;
  }

  const tabLabels = { cours: 'Partie', exercices: 'Exercice', corrections: 'Correction' };
  const tabIcons = { cours: 'fa-book-open', exercices: 'fa-pen-to-square', corrections: 'fa-check-double' };
  const iconClass = { cours: '', exercices: 'exo', corrections: 'corr' };
  const label = tabLabels[currentTab] || 'Partie';
  const icon = tabIcons[currentTab] || 'fa-file';
  const ic = iconClass[currentTab] || '';

  const isFree = chapIdx === 0;
  const isLockedCorrection = currentTab === 'corrections' && !isPremium && !isFree;

  const totalParts = currentParts.length;
  const readCount = getPartsReadForChapter(subjectKey, chapIdx, currentTab, totalParts);
  cpTotal.textContent = totalParts;
  cpRead.textContent = readCount;
  const percent = totalParts > 0 ? Math.round((readCount / totalParts) * 100) : 0;
  cpFill.style.width = percent + '%';
  cpPercent.textContent = `(${percent}%)`;

  container.innerHTML = currentParts.map((part, i) => {
    const isRead = isPartRead(subjectKey, chapIdx, currentTab, i);
    const isLocked = isLockedCorrection;

    let badge = '';
    let badgeClass = '';
    let cardClass = '';

    if (isRead && !isLocked) {
      badge = '✅ Lu';
      badgeClass = 'read';
      cardClass = 'read';
    } else if (isLocked) {
      badge = '🔒 Premium';
      badgeClass = 'premium';
      cardClass = 'locked';
    } else if (isFree && currentTab === 'cours') {
      badge = '🎁 Gratuit';
      badgeClass = 'free';
    }

    const onclick = isLocked ? 'showPremiumPopup()' : `openPart(${i})`;

    return `
      <div class="part-card ${cardClass}" onclick="${onclick}">
        <div class="pc-icon ${ic}">
          <i class="fas ${icon}"></i>
        </div>
        <div class="pc-info">
          <div class="pc-title">
            ${escapeHtml(part.title)}
            ${badge ? `<span class="pc-badge ${badgeClass}">${badge}</span>` : ''}
          </div>
          <div class="pc-sub">${label} ${i + 1} — ${subjectConfig.name}</div>
        </div>
        <div class="pc-arrow"><i class="fas fa-chevron-right"></i></div>
      </div>
    `;
  }).join('');
}

function renderEmpty() {
  const container = document.getElementById('cardsView');
  const tabNames = { cours: 'cours', exercices: 'exercices', corrections: 'corrections' };
  container.innerHTML = `
    <div class="empty-state">
      <div class="es-icon"><i class="fas fa-folder-open"></i></div>
      <h4>Aucun ${tabNames[currentTab] || 'contenu'} disponible</h4>
      <p>Le contenu sera ajouté prochainement.</p>
    </div>
  `;
  cpTotal.textContent = '0';
  cpRead.textContent = '0';
  cpPercent.textContent = '(0%)';
  cpFill.style.width = '0%';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ================================================================
// TABS
// ================================================================
function setupTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      if (tab === currentTab) return;
      currentTab = tab;
      const url = new URL(window.location);
      url.searchParams.set('tab', tab);
      window.history.pushState({}, '', url);
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      loadManifest();
    });
  });
}

// ================================================================
// ✅ C3 — Retry doux si doc users/{uid} absent
// ================================================================
async function handleMissingUserDoc(uid) {
  if (missingDocInFlight) return;
  missingDocInFlight = true;
  try {
    await new Promise((r) => setTimeout(r, 900));
    if (!auth.currentUser || auth.currentUser.uid !== uid) return;
    const retry = await getDoc(doc(db, 'users', uid));
    if (retry.exists()) {
      const data = retry.data();
      try {
        localStorage.setItem(USER_DATA_KEY, JSON.stringify({
          ...data,
          _uid: uid,
          _cachedAt: Date.now()
        }));
      } catch (e) {}
      const newPremium = isUserPremium(data);
      if (newPremium !== isPremium) {
        isPremium = newPremium;
        // ✅ C10 — pas besoin de recharger le manifest, juste les cartes
        if (subjectConfig && chapters.length) renderPage();
      }
      return;
    }
    console.warn('[Chapitre] Profil utilisateur introuvable pour', uid);
  } catch (e) {
    console.warn('[Chapitre] handleMissingUserDoc:', e.code || e.message);
  } finally {
    missingDocInFlight = false;
  }
}

// ================================================================
// CHARGEMENT UTILISATEUR — ✅ C2 + C3 + C8
// ================================================================
function loadUserData(user) {
  if (unsubscribeUser) {
    unsubscribeUser();
    unsubscribeUser = null;
  }

  const userRef = doc(db, 'users', user.uid);

  unsubscribeUser = onSnapshot(userRef,
    (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();

        // ✅ C2 — blocked : signOut tolérant + auth-choice.html
        if (data.accountStatus === 'blocked') {
          if (unsubscribeUser) { unsubscribeUser(); unsubscribeUser = null; }
          clearSession();
          try { sessionStorage.setItem('arvexa_account_blocked', '1'); } catch (e) {}
          signOut(auth)
            .catch((err) => console.warn('[Chapitre] signOut bloqué :', err.code || err.message))
            .finally(() => { window.location.replace('auth-choice.html'); });
          return;
        }

        // ✅ C2 — paused : ne pas déconnecter, laisser la page fonctionner
        if (data.accountStatus === 'paused') {
          try {
            localStorage.setItem(USER_DATA_KEY, JSON.stringify({
              ...data,
              _uid: user.uid,
              _cachedAt: Date.now()
            }));
          } catch (e) {}
          return;
        }

        // Cas normal
        const newPremium = isUserPremium(data);
        if (newPremium !== isPremium) {
          isPremium = newPremium;
          if (subjectConfig && chapters.length) renderPage();
        }

        try {
          localStorage.setItem(USER_DATA_KEY, JSON.stringify({
            ...data,
            _uid: user.uid,
            _cachedAt: Date.now()
          }));
        } catch (e) {}
      } else {
        const cached = getCachedUserData(user.uid);
        if (cached) {
          const newPremium = isUserPremium(cached);
          if (newPremium !== isPremium) {
            isPremium = newPremium;
            if (subjectConfig && chapters.length) renderPage();
          }
        } else {
          // ✅ C3 — retry doux
          handleMissingUserDoc(user.uid);
        }
      }
    },
    (error) => {
      // ✅ C8 — warn au lieu du silence
      console.warn('[Chapitre] onSnapshot users:', error.code || error.message);
      const cached = getCachedUserData(user.uid);
      if (cached) {
        const newPremium = isUserPremium(cached);
        if (newPremium !== isPremium) {
          isPremium = newPremium;
          if (subjectConfig && chapters.length) renderPage();
        }
      }
    }
  );
}

// ================================================================
// AUTH ROBUSTE — ✅ C1/C7
// ================================================================
let isRedirecting = false;
let isAuthResolved = false;
let graceTimer = null;
let maxTimer = null;

// ✅ C1 — préserver les clés existantes
function redirectToLogin() {
  if (isRedirecting) return;
  isRedirecting = true;

  if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
  if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
  if (authUnsubscribe) {
    try { authUnsubscribe(); } catch (e) {}
    authUnsubscribe = null;
  }

  try {
    const existing = sessionStorage.getItem('redirectAfterLogin')
                  || sessionStorage.getItem('redirectAfterAuth');
    if (!existing) {
      sessionStorage.setItem('redirectAfterLogin',
        window.location.pathname + window.location.search);
    }
  } catch (e) {}

  window.location.replace('login.html');
}

function initAuthGuard(onAuthenticated) {
  if (authUnsubscribe) return; // garde anti-double

  authUnsubscribe = onAuthStateChanged(auth, (user) => {
    if (isAuthResolved) {
      if (user && user.uid !== currentUid) {
        currentUid = user.uid;
        saveSession(user);
        onAuthenticated(user);
      } else if (!user && currentUid) {
        currentUid = null;
        clearSession();
        redirectToLogin();
      }
      return;
    }

    if (!user) {
      if (graceTimer) return;
      graceTimer = setTimeout(() => {
        graceTimer = null;
        if (isAuthResolved) return;
        if (auth.currentUser) return;

        const hasSession = localStorage.getItem(SESSION_KEY);
        const hasUserData = localStorage.getItem(USER_DATA_KEY);

        if ((hasSession || hasUserData) && !navigator.onLine) {
          setTimeout(() => {
            if (auth.currentUser) return;
            if (!isAuthResolved) redirectToLogin();
          }, 1500);
          return;
        }

        if (hasSession && hasUserData) {
          setTimeout(() => {
            if (auth.currentUser) return;
            if (!isAuthResolved) redirectToLogin();
          }, 1500);
          return;
        }

        redirectToLogin();
      }, 600);
      return;
    }

    if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
    if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }

    isAuthResolved = true;
    currentUid = user.uid;
    saveSession(user);
    onAuthenticated(user);
  });

  maxTimer = setTimeout(() => {
    if (isAuthResolved) return;
    if (auth.currentUser) {
      isAuthResolved = true;
      currentUid = auth.currentUser.uid;
      saveSession(auth.currentUser);
      onAuthenticated(auth.currentUser);
    } else {
      redirectToLogin();
    }
  }, 5000);
}

// ================================================================
// LANCER LA PROTECTION
// ================================================================
initAuthGuard(async (user) => {
  // Cache-first : Premium depuis le cache
  const cached = getCachedUserData(user.uid);
  isPremium = cached ? isUserPremium(cached) : false;

  // Charger les données
  loadSubjectData();
  setupTabs();

  // Écouter Firestore en temps réel
  loadUserData(user);
});

// ✅ C7 — cleanup global
window.addEventListener('beforeunload', () => {
  if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
  if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
  if (authUnsubscribe) { try { authUnsubscribe(); } catch (e) {} authUnsubscribe = null; }
  if (unsubscribeUser) { try { unsubscribeUser(); } catch (e) {} unsubscribeUser = null; }
});

console.log('🚀 ARVEXA — Chapitre (version corrigée C1-C11)');
</script>
