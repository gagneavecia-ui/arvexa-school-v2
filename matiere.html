<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Matière">
  <meta name="view-transition" content="same-origin">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="perf.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="register-sw.js" defer></script>
  <script src="spa-router.js"></script>

  <style>
    /* ============================================================
       ROOT — Design system ARVEXA
       ============================================================ */
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --success-light: #3AB67E;
      --danger: #B85C3A;
      --warning: #D4A017;
      --info: #4AAFE0;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.08);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; width: 100%; overflow-x: hidden; }
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }

    .gradient-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26, 58, 42, 0.16) 0%, transparent 70%),
                  radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }

    .glow {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
      opacity: 0.15; animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 300px; height: 300px; background: rgba(26,58,42,0.18); top: -80px; right: -80px; }
    .glow-2 { width: 180px; height: 180px; background: rgba(184,134,11,0.05); bottom: 0; left: 0; animation-delay: -4s; }
    @keyframes glowMove { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-20px) scale(1.1); } }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184, 134, 11, 0.06);
      gap: 12px;
      min-height: 56px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: var(--transition);
      font-size: 16px; text-decoration: none; flex-shrink: 0;
    }
    .back-btn:hover { border-color: rgba(184, 134, 11, 0.14); color: var(--text-light); }
    .page-title {
      font-size: clamp(13px, 1.6vw, 15px);
      font-weight: 600; color: var(--text-light);
      font-family: 'Playfair Display', serif;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .page-title i { color: var(--accent-bright); margin-right: 6px; font-size: 14px; }
    .header-right button {
      background: transparent; border: none; color: var(--text-muted);
      font-size: 14px; cursor: pointer; padding: 6px; transition: var(--transition);
    }
    .header-right button:hover { color: var(--text-light); }

    /* ============================================================
       CONTAINER
       ============================================================ */
    .container { max-width: 640px; margin: 0 auto; padding: 12px 12px 40px; width: 100%; }

    /* ============================================================
       SUBJECT HERO
       ============================================================ */
    .subject-hero {
      position: relative;
      background: linear-gradient(135deg, rgba(184, 134, 11, 0.06), rgba(26, 58, 42, 0.08));
      border: 1px solid rgba(184, 134, 11, 0.12);
      border-radius: var(--radius);
      padding: 22px 18px 18px;
      margin-bottom: 14px;
      overflow: hidden;
      text-align: center;
    }
    .subject-hero::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
    }
    .subject-hero::after {
      content: ''; position: absolute;
      top: -80px; right: -80px;
      width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(184, 134, 11, 0.08), transparent 70%);
      pointer-events: none;
    }

    .subject-icon-wrap {
      width: 64px; height: 64px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 14px;
      position: relative;
      background: rgba(184, 134, 11, 0.1);
      color: var(--accent-bright);
      border: 1px solid rgba(184, 134, 11, 0.15);
      transition: var(--transition);
    }
    .subject-icon-wrap::before {
      content: ''; position: absolute; inset: -3px; border-radius: 21px;
      background: linear-gradient(135deg, var(--accent), var(--success));
      opacity: 0.15; z-index: -1;
    }

    .subject-hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(20px, 3vw, 24px);
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .subject-description {
      font-size: clamp(12.5px, 1.3vw, 13.5px);
      color: var(--text-dim);
      line-height: 1.6;
      max-width: 480px;
      margin: 0 auto 14px;
      padding: 0 4px;
    }

    /* ============================================================
       STATS ROW
       ============================================================ */
    .subject-stats {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-dim);
      backdrop-filter: blur(4px);
      transition: var(--transition);
    }
    .stat-pill i {
      color: var(--accent-bright);
      font-size: 11px;
    }
    .stat-pill .value {
      color: var(--text-light);
      font-weight: 700;
    }
    .stat-pill:hover {
      border-color: rgba(184, 134, 11, 0.2);
      background: rgba(0, 0, 0, 0.35);
    }

    /* ============================================================
       PROGRESS BAR
       ============================================================ */
    .progress-wrap {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
      transition: var(--transition);
    }
    .progress-wrap:hover { border-color: rgba(184, 134, 11, 0.12); }
    .progress-head {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12.5px;
      color: var(--text-dim);
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .progress-head strong { color: var(--text-light); font-weight: 600; }
    .progress-head .percent {
      font-weight: 700;
      color: var(--accent-bright);
      font-size: 13px;
    }
    .progress-track {
      width: 100%; height: 5px; border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      width: 0%;
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute; right: 0; top: 0;
      width: 20px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15));
      animation: shimmerProgress 2s ease-in-out infinite;
    }
    @keyframes shimmerProgress {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ============================================================
       SECTION LABEL
       ============================================================ */
    .section-label {
      font-size: 11px;
      font-weight: 700; color: var(--accent-bright);
      text-transform: uppercase; letter-spacing: 1px;
      padding: 6px 4px 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(184, 134, 11, 0.1);
    }
    .section-label .count {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }

    /* ============================================================
       CHAPTER LIST
       ============================================================ */
    .chapter-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 16px; }

    .chapter-card {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }
    .chapter-card:hover {
      border-color: rgba(184, 134, 11, 0.15);
      transform: translateY(-2px);
    }
    .chapter-card:active { transform: scale(0.99); }

    .chapter-card.in-progress {
      border-color: rgba(184, 134, 11, 0.3);
      background: rgba(184, 134, 11, 0.03);
    }
    .chapter-card.in-progress::before {
      content: '';
      position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent-bright));
    }

    .chapter-card.completed {
      border-color: rgba(45, 125, 90, 0.3);
      background: rgba(45, 125, 90, 0.03);
    }
    .chapter-card.completed::before {
      content: '';
      position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, var(--success), var(--success-light));
    }

    .chapter-card.locked { opacity: 0.75; }
    .chapter-card.locked:hover { opacity: 0.9; }

    .cc-header {
      display: flex; align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .cc-num {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      font-family: 'Playfair Display', serif;
      background: rgba(184, 134, 11, 0.08);
      color: var(--accent-bright);
      border: 1px solid rgba(184, 134, 11, 0.1);
      transition: var(--transition);
    }
    .chapter-card.in-progress .cc-num {
      background: rgba(184, 134, 11, 0.15);
      color: var(--accent-bright);
      border-color: rgba(184, 134, 11, 0.25);
    }
    .chapter-card.completed .cc-num {
      background: rgba(45, 125, 90, 0.12);
      color: var(--success);
      border-color: rgba(45, 125, 90, 0.2);
    }
    .chapter-card.locked .cc-num {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      border-color: rgba(255, 255, 255, 0.04);
    }

    .cc-info { flex: 1; min-width: 0; }

    .cc-title-row {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .cc-title {
      font-size: clamp(13.5px, 1.4vw, 15px);
      font-weight: 600; color: var(--text-light);
      line-height: 1.35;
      flex: 1; min-width: 0;
    }

    .cc-badges {
      display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 9.5px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      white-space: nowrap;
      line-height: 1.4;
    }
    .badge.free {
      color: var(--success); background: rgba(45, 125, 90, 0.1);
      border: 1px solid rgba(45, 125, 90, 0.12);
    }
    .badge.premium {
      color: var(--accent-bright); background: rgba(184, 134, 11, 0.1);
      border: 1px solid rgba(184, 134, 11, 0.12);
    }
    .badge.in-progress {
      color: var(--accent-bright); background: rgba(184, 134, 11, 0.12);
      border: 1px solid rgba(184, 134, 11, 0.18);
    }
    .badge.completed {
      color: var(--success); background: rgba(45, 125, 90, 0.12);
      border: 1px solid rgba(45, 125, 90, 0.18);
    }

    .cc-description {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.55;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cc-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .cc-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .cc-meta-item i {
      font-size: 10px;
      color: var(--accent);
    }
    .cc-meta-item.difficulty-easy i { color: var(--success); }
    .cc-meta-item.difficulty-medium i { color: var(--warning); }
    .cc-meta-item.difficulty-hard i { color: var(--danger); }

    .cc-progress {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .cc-progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .cc-progress-info .value {
      color: var(--text-dim);
      font-weight: 600;
    }
    .chapter-card.completed .cc-progress-info .value { color: var(--success-light); }
    .chapter-card.in-progress .cc-progress-info .value { color: var(--accent-bright); }

    .cc-progress-track {
      width: 100%;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }
    .cc-progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .chapter-card.completed .cc-progress-fill {
      background: linear-gradient(90deg, var(--success), var(--success-light));
    }

    /* ============================================================
       SKELETON
       ============================================================ */
    .skeleton {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.06) 50%, rgba(255, 255, 255, 0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-hero { height: 180px; border-radius: var(--radius); margin-bottom: 14px; }
    .skeleton-progress { height: 60px; border-radius: var(--radius); margin-bottom: 14px; }
    .skeleton-card { height: 100px; border-radius: var(--radius); }

    /* ═══════════════════════════════════════════════════════════════════
   ARVEXA — POP-UP PREMIUM UNIVERSEL
   Version 10 — Réduite · Bouton unique
   Un seul design pour toutes les pages · Contenu adapté par page
   ═══════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────────────────────
   1. OVERLAY
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.30s cubic-bezier(0.4, 0, 0.2, 1),
              visibility 0.30s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.arvexa-popup-overlay.show {
  opacity: 1;
  visibility: visible;
}

/* ─────────────────────────────────────────────────────────────
   2. CARTE
   ───────────────────────────────────────────────────────────── */
.arvexa-popup {
  position: relative;
  width: 100%;
  max-width: 360px;
  margin: auto;
  padding: 30px 26px 22px;
  border: 1px solid rgba(224, 184, 74, 0.20);
  border-radius: 22px;
  background:
    radial-gradient(ellipse 120% 70% at 50% -10%, rgba(224, 184, 74, 0.10) 0%, transparent 65%),
    radial-gradient(ellipse 100% 50% at 50% 110%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
    linear-gradient(165deg, #171717 0%, #0b0b0b 100%);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.02),
    0 0 60px rgba(224, 184, 74, 0.08),
    0 24px 60px rgba(0, 0, 0, 0.70),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  transform: scale(0.94) translateY(20px);
  transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
  overflow: hidden;
  isolation: isolate;
}
.arvexa-popup-overlay.show .arvexa-popup {
  transform: scale(1) translateY(0);
}

.arvexa-popup::before {
  content: '';
  position: absolute;
  top: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  border-radius: 0 0 4px 4px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(224, 184, 74, 0.4) 20%,
    #E0B84A 50%,
    rgba(224, 184, 74, 0.4) 80%,
    transparent 100%);
  opacity: 0.9;
  z-index: 2;
}

.arvexa-popup::after {
  content: '';
  position: absolute;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(224, 184, 74, 0.18) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  filter: blur(6px);
}

/* ─────────────────────────────────────────────────────────────
   3. BOUTON FERMER
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-close {
  position: absolute;
  top: 13px;
  right: 13px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.03);
  color: #6A6A5A;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  z-index: 4;
  -webkit-tap-highlight-color: transparent;
}
.arvexa-popup-close:hover {
  background: rgba(224, 184, 74, 0.12);
  color: #E0B84A;
  transform: rotate(90deg) scale(1.05);
}
.arvexa-popup-close:active {
  transform: rotate(90deg) scale(0.95);
}

/* ─────────────────────────────────────────────────────────────
   4. ICÔNE
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 30%, rgba(224, 184, 74, 0.22), rgba(184, 134, 11, 0.08) 70%);
  border: 1px solid rgba(224, 184, 74, 0.28);
  color: #E0B84A;
  font-size: 26px;
  margin: 0 auto 16px;
  position: relative;
  z-index: 1;
  animation: arvexaCrownPulse 3s ease-in-out infinite;
  box-shadow:
    0 0 20px rgba(224, 184, 74, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
@keyframes arvexaCrownPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow:
      0 0 20px rgba(224, 184, 74, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  50% {
    transform: scale(1.04);
    box-shadow:
      0 0 34px rgba(224, 184, 74, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
}

/* ─────────────────────────────────────────────────────────────
   5. TITRE
   ───────────────────────────────────────────────────────────── */
.arvexa-popup-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 22px;
  font-weight: 700;
  color: #F5F0E8;

// ================================================================
// UTILITAIRES
// ================================================================
function toDate(value) {
  if (!value) return null;
  if (typeof value.toDate === 'function') return value.toDate();
  if (value.seconds !== undefined) return new Date(value.seconds * 1000);
  const date = value instanceof Date ? value : new Date(value);
  return Number.isNaN(date.getTime()) ? null : date;
}

function isUserPremium(userData) {
  if (!userData) return false;
  const hasStatus = userData.premium === true ||
                    userData.isUnlocked === true ||
                    userData.hasDeposited === true;
  if (!hasStatus) return false;
  const endDate = toDate(userData.subscriptionEndDate);
  if (!endDate) return true;
  return endDate.getTime() > Date.now();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text || '');
  return div.innerHTML;
}

// ================================================================
// LECTURE DES PARTIES LUES
// ================================================================
function getReadParts() {
  try {
    return JSON.parse(localStorage.getItem(READ_KEY) || '[]');
  } catch (e) { return []; }
}

function getReadPartsForChapter(chapterIndex) {
  const readParts = getReadParts();
  const prefix = `${subjectKey}_${chapterIndex}_`;
  return readParts.filter(key => key.startsWith(prefix)).length;
}

function getReadChaptersCount() {
  const readParts = getReadParts();
  const chaptersSet = new Set();
  readParts.forEach(key => {
    const parts = key.split('_');
    if (parts[0] === subjectKey && parts.length >= 2) {
      chaptersSet.add(parts[1]);
    }
  });
  return chaptersSet.size;
}

// ================================================================
// STATUT D'UN CHAPITRE
// ================================================================
function getChapterStatus(chapterIndex, chapterData) {
  const readCount = getReadPartsForChapter(chapterIndex);
  const totalParts = chapterData.totalParts || 0;

  if (readCount === 0) return { status: 'not-opened', readCount, totalParts };
  if (totalParts > 0 && readCount >= totalParts) {
    return { status: 'completed', readCount, totalParts };
  }
  return { status: 'in-progress', readCount, totalParts };
}

// ================================================================
// NAVIGATION
// ================================================================
function navigateToChapter(chapterIndex) {
  // ⚡ Si le routeur SPA est présent, on lui délègue la navigation
  if (window.arvexaNavigate) {
    window.arvexaNavigate(`chapitre.html?subject=${subjectKey}&chapter=${chapterIndex}`);
    return;
  }
  // Fallback : navigation classique si le routeur n'est pas chargé
  window.location.href = `chapitre.html?subject=${subjectKey}&chapter=${chapterIndex}`;
}
    
function showPremiumPopup() {
  const popup = document.getElementById('premiumPopup');
  popup.classList.remove('hide');
  popup.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function hidePremiumPopup() {
  const popup = document.getElementById('premiumPopup');
  popup.classList.remove('show');
  popup.classList.add('hide');
  document.body.style.overflow = '';
}

window.navigateToChapter = navigateToChapter;
window.showPremiumPopup = showPremiumPopup;

// ================================================================
// RENDU HERO
// ================================================================
function renderHero() {
  if (!subjectConfig) return;

  pageTitle.textContent = subjectConfig.name;
  document.title = 'ARVEXA - ' + subjectConfig.name;

  subjectIconWrap.innerHTML = `<i class="fas ${subjectConfig.icon}"></i>`;
  subjectIconWrap.style.background = (subjectConfig.color || '#E0B84A') + '15';
  subjectIconWrap.style.color = subjectConfig.color || '#E0B84A';
  subjectIconWrap.style.borderColor = (subjectConfig.color || '#E0B84A') + '30';

  subjectTitle.textContent = subjectConfig.name;

  if (subjectConfig.description) {
    subjectDescription.textContent = subjectConfig.description;
    subjectDescription.style.display = 'block';
  } else {
    subjectDescription.style.display = 'none';
  }

  subjectStats.style.display = 'flex';
  statChapters.textContent = chapters.length;

  const totalMinutes = chapters.reduce((sum, ch) => sum + (ch.estimatedMinutes || 0), 0);
  if (totalMinutes > 0) {
    statHoursPill.style.display = 'inline-flex';
    statHours.textContent = Math.round(totalMinutes / 60);
  } else {
    statHoursPill.style.display = 'none';
  }

  const freeCount = chapters.filter(ch => ch.isFree).length;
  if (freeCount > 0) {
    statFreePill.style.display = 'inline-flex';
    statFree.textContent = freeCount;
  } else {
    statFreePill.style.display = 'none';
  }
}

// ================================================================
// RENDU PROGRESSION
// ================================================================
function renderProgress() {
  const total = chapters.length;
  const read = getReadChaptersCount();
  const percent = total > 0 ? Math.round((read / total) * 100) : 0;

  progressRead.textContent = read;
  progressTotal.textContent = total;
  progressPercent.textContent = `(${percent}%)`;
  progressFill.style.width = percent + '%';
}

// ================================================================
// RENDU CHAPITRES
// ================================================================
function renderChapters() {
  chapterCount.textContent = `${chapters.length} chapitre${chapters.length > 1 ? 's' : ''}`;

  if (chapters.length === 0) {
    chapterList.innerHTML = `
      <div class="empty-state">
        <div class="es-icon"><i class="fas fa-folder-open"></i></div>
        <h4>Aucun chapitre disponible</h4>
        <p>Le contenu sera ajouté prochainement.</p>
      </div>
    `;
    return;
  }

  chapterList.innerHTML = chapters.map((chap, index) => {
    const isFree = chap.isFree === true;
    const isLocked = !isPremium && !isFree;
    const status = getChapterStatus(index, chap);

    let cardClass = 'chapter-card';
    if (isLocked) cardClass += ' locked';
    if (status.status === 'in-progress') cardClass += ' in-progress';
    if (status.status === 'completed') cardClass += ' completed';

    let badgesHtml = '';
    if (isFree) {
      badgesHtml += '<span class="badge free">🎁 Gratuit</span>';
    } else if (isLocked) {
      badgesHtml += '<span class="badge premium">🔒 Premium</span>';
    } else if (isPremium && !isFree) {
      badgesHtml += '<span class="badge premium">👑 Premium</span>';
    }

    if (status.status === 'in-progress') {
      badgesHtml += '<span class="badge in-progress">📌 En cours</span>';
    } else if (status.status === 'completed') {
      badgesHtml += '<span class="badge completed">✅ Terminé</span>';
    }

    const descriptionHtml = chap.description
      ? `<div class="cc-description">${escapeHtml(chap.description)}</div>`
      : '';

    let metaHtml = '';
    if (chap.estimatedMinutes || chap.difficulty) {
      const items = [];

      if (chap.estimatedMinutes) {
        const hours = Math.floor(chap.estimatedMinutes / 60);
        const mins = chap.estimatedMinutes % 60;
        const timeStr = hours > 0
          ? (mins > 0 ? `${hours}h${mins}` : `${hours}h`)
          : `${mins}min`;
        items.push(`<span class="cc-meta-item"><i class="fas fa-clock"></i> ${timeStr}</span>`);
      }

      if (chap.difficulty) {
        const labels = { easy: 'Facile', medium: 'Moyen', hard: 'Difficile' };
        const icons = { easy: 'fa-circle', medium: 'fa-circle-half-stroke', hard: 'fa-circle' };
        const label = labels[chap.difficulty] || '';
        const icon = icons[chap.difficulty] || 'fa-circle';
        items.push(`<span class="cc-meta-item difficulty-${chap.difficulty}"><i class="fas ${icon}"></i> ${label}</span>`);
      }

      if (items.length > 0) {
        metaHtml = `<div class="cc-meta">${items.join('')}</div>`;
      }
    }

    let progressHtml = '';
    if (status.status !== 'not-opened' && status.totalParts > 0) {
      const chapterPercent = Math.round((status.readCount / status.totalParts) * 100);
      progressHtml = `
        <div class="cc-progress">
          <div class="cc-progress-info">
            <span>Progression</span>
            <span class="value">${status.readCount}/${status.totalParts} parties · ${chapterPercent}%</span>
          </div>
          <div class="cc-progress-track">
            <div class="cc-progress-fill" style="width:${chapterPercent}%"></div>
          </div>
        </div>
      `;
    }

    const onclick = isLocked ? 'showPremiumPopup()' : `navigateToChapter(${index})`;

    return `
      <div class="${cardClass}" onclick="${onclick}">
        <div class="cc-header">
          <div class="cc-num">${index + 1}</div>
          <div class="cc-info">
            <div class="cc-title-row">
              <div class="cc-title">${escapeHtml(chap.title || 'Chapitre ' + (index + 1))}</div>
              <div class="cc-badges">${badgesHtml}</div>
            </div>
            ${descriptionHtml}
            ${metaHtml}
          </div>
        </div>
        ${progressHtml}
      </div>
    `;
  }).join('');

  renderProgress();
}

// ================================================================
// CHARGEMENT DEPUIS FIRESTORE
// ================================================================
function loadSubjectFromFirestore() {
  // ⚡ 1. CHARGER LES DONNÉES DE FALLBACK IMMÉDIATEMENT (pour ne jamais avoir 0)
  if (!subjectConfig) loadFallbackSubjectConfig();
  if (chapters.length === 0) loadFallbackChapters();

  // 2. Charger les infos de la matière depuis Firestore
  const subjectRef = doc(db, 'subjects', subjectKey);

  if (unsubscribeSubject) unsubscribeSubject();

  unsubscribeSubject = onSnapshot(subjectRef,
    (subjectSnap) => {
      if (subjectSnap.exists()) {
        const data = subjectSnap.data();
        subjectConfig = {
          name: data.name || (SUBJECTS_CONFIG[subjectKey]?.name || 'Matière'),
          description: data.description || '',
          icon: data.icon || (SUBJECTS_CONFIG[subjectKey]?.icon || 'fa-book'),
          color: data.color || (SUBJECTS_CONFIG[subjectKey]?.color || '#E0B84A')
        };
        renderHero();
      }
    },
    (error) => {
      console.warn('Firestore subject error:', error.code || error.message);
    }
  );

  // 3. Charger les chapitres depuis Firestore
  if (unsubscribeChapters) unsubscribeChapters();

  const chaptersQuery = query(
    collection(db, 'subjects', subjectKey, 'chapters'),
    orderBy('order', 'asc')
  );

  unsubscribeChapters = onSnapshot(chaptersQuery,
    (snap) => {
      if (!snap.empty) {
        chapters = snap.docs.map(d => {
          const data = d.data();
          return {
            id: d.id,
            title: data.title || '',
            description: data.description || '',
            isFree: data.isFree === true,
            order: data.order || 0,
            difficulty: data.difficulty || null,
            estimatedMinutes: data.estimatedMinutes || 0,
            totalParts: data.totalParts || 0
          };
        });
        renderChapters();
        renderProgress();
        renderHero();
      }
      // Sinon, on garde le fallback déjà chargé
    },
    (error) => {
      console.warn('Firestore chapters error:', error.code || error.message);
      // En cas d'erreur, le fallback est déjà chargé
    }
  );
}

function loadFallbackSubjectConfig() {
  const cfg = SUBJECTS_CONFIG[subjectKey];
  if (cfg) {
    subjectConfig = {
      name: cfg.name,
      description: cfg.description || '',
      icon: cfg.icon,
      color: cfg.color
    };
    renderHero();
  } else {
    window.location.replace('index.html');
  }
}

function loadFallbackChapters() {
  const fallback = DEFAULT_CHAPTERS[subjectKey] || [];
  chapters = fallback.map((ch, i) => ({
    title: typeof ch === 'string' ? ch : ch.title,
    isFree: typeof ch === 'object' ? ch.isFree === true : (i === 0),
    description: '',
    order: i,
    difficulty: null,
    estimatedMinutes: 0,
    totalParts: 0
  }));

  if (!subjectConfig) loadFallbackSubjectConfig();

  renderHero();
  renderChapters();
  renderProgress();
}

// ================================================================
// ✅ C3 — Retry doux si doc users/{uid} absent
// ================================================================
async function handleMissingUserDoc(uid) {
  if (missingDocInFlight) return;
  missingDocInFlight = true;
  try {
    await new Promise((r) => setTimeout(r, 900));
    if (!auth.currentUser || auth.currentUser.uid !== uid) return;
    const retry = await getDoc(doc(db, 'users', uid));
    if (retry.exists()) {
      const data = retry.data();
      try {
        localStorage.setItem(USER_DATA_KEY, JSON.stringify({
          ...data,
          _uid: uid,
          _cachedAt: Date.now()
        }));
      } catch (e) {}
      const newPremium = isUserPremium(data);
      if (newPremium !== isPremium) {
        isPremium = newPremium;
        if (chapters.length > 0) renderChapters();
      }
      return;
    }
    console.warn('[Matiere] Profil utilisateur introuvable pour', uid);
  } catch (e) {
    console.warn('[Matiere] handleMissingUserDoc:', e.code || e.message);
  } finally {
    missingDocInFlight = false;
  }
}

// ================================================================
// CHARGEMENT UTILISATEUR — ✅ C2 (blocked/paused) + C3 (retry) + C8 (warn)
// ================================================================
function loadUserData(user) {
  if (unsubscribeUser) {
    unsubscribeUser();
    unsubscribeUser = null;
  }

  const userRef = doc(db, 'users', user.uid);

  unsubscribeUser = onSnapshot(userRef,
    (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();

        // ✅ C2 — blocked : signOut tolérant + auth-choice.html
        if (data.accountStatus === 'blocked') {
          if (unsubscribeUser) { unsubscribeUser(); unsubscribeUser = null; }
          if (unsubscribeSubject) { unsubscribeSubject(); unsubscribeSubject = null; }
          if (unsubscribeChapters) { unsubscribeChapters(); unsubscribeChapters = null; }
          clearSession();
          try { sessionStorage.setItem('arvexa_account_blocked', '1'); } catch (e) {}
          signOut(auth)
            .catch((err) => console.warn('[Matiere] signOut bloqué :', err.code || err.message))
            .finally(() => { window.location.replace('auth-choice.html'); });
          return;
        }

        // ✅ C2 — paused : ne pas déconnecter, message (via console), rester sur la page
        if (data.accountStatus === 'paused') {
          // On laisse le contenu accessible ; l'utilisateur ne peut de toute façon
          // pas lire les chapitres verrouillés (règles Firestore le bloqueront).
          try {
            localStorage.setItem(USER_DATA_KEY, JSON.stringify({
              ...data,
              _uid: user.uid,
              _cachedAt: Date.now()
            }));
          } catch (e) {}
          return;
        }

        // Cas normal
        const newPremium = isUserPremium(data);
        if (newPremium !== isPremium) {
          isPremium = newPremium;
          if (chapters.length > 0) renderChapters();
        }

        try {
          localStorage.setItem(USER_DATA_KEY, JSON.stringify({
            ...data,
            _uid: user.uid,
            _cachedAt: Date.now()
          }));
        } catch (e) {}
      } else {
        const cached = getCachedUserData(user.uid);
        if (cached) {
          const newPremium = isUserPremium(cached);
          if (newPremium !== isPremium) {
            isPremium = newPremium;
            if (chapters.length > 0) renderChapters();
          }
        } else {
          // ✅ C3 — retry doux
          handleMissingUserDoc(user.uid);
        }
      }
    },
    (error) => {
      // ✅ C8 — warn au lieu du silence
      console.warn('[Matiere] onSnapshot users:', error.code || error.message);
      const cached = getCachedUserData(user.uid);
      if (cached) {
        const newPremium = isUserPremium(cached);
        if (newPremium !== isPremium) {
          isPremium = newPremium;
          if (chapters.length > 0) renderChapters();
        }
      }
    }
  );
}

// ================================================================
// AUTH ROBUSTE — ✅ C1/C7
// ================================================================
let isRedirecting = false;
let isAuthResolved = false;
let graceTimer = null;
let maxTimer = null;

// ✅ C1 — préserver les clés existantes
function redirectToLogin() {
  if (isRedirecting) return;
  isRedirecting = true;

  if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
  if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
  if (authUnsubscribe) {
    try { authUnsubscribe(); } catch (e) {}
    authUnsubscribe = null;
  }

  try {
    const existing = sessionStorage.getItem('redirectAfterLogin')
                  || sessionStorage.getItem('redirectAfterAuth');
    if (!existing) {
      sessionStorage.setItem('redirectAfterLogin',
        window.location.pathname + window.location.search);
    }
  } catch (e) {}

  window.location.replace('login.html');
}

function initAuthGuard(onAuthenticated) {
  if (authUnsubscribe) return; // garde anti-double

  authUnsubscribe = onAuthStateChanged(auth, (user) => {
    if (isAuthResolved) {
      if (user && user.uid !== currentUid) {
        currentUid = user.uid;
        saveSession(user);
        onAuthenticated(user);
      } else if (!user && currentUid) {
        currentUid = null;
        clearSession();
        redirectToLogin();
      }
      return;
    }

    if (!user) {
      if (graceTimer) return;
      graceTimer = setTimeout(() => {
        graceTimer = null;
        if (isAuthResolved) return;
        if (auth.currentUser) return;

        const hasSession = localStorage.getItem(SESSION_KEY);
        const hasUserData = localStorage.getItem(USER_DATA_KEY);

        if ((hasSession || hasUserData) && !navigator.onLine) {
          setTimeout(() => {
            if (auth.currentUser) return;
            if (!isAuthResolved) redirectToLogin();
          }, 1500);
          return;
        }

        if (hasSession && hasUserData) {
          setTimeout(() => {
            if (auth.currentUser) return;
            if (!isAuthResolved) redirectToLogin();
          }, 1500);
          return;
        }

        redirectToLogin();
      }, 600);
      return;
    }

    if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
    if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }

    isAuthResolved = true;
    currentUid = user.uid;
    saveSession(user);
    onAuthenticated(user);
  });

  maxTimer = setTimeout(() => {
    if (isAuthResolved) return;
    if (auth.currentUser) {
      isAuthResolved = true;
      currentUid = auth.currentUser.uid;
      saveSession(auth.currentUser);
      onAuthenticated(auth.currentUser);
    } else {
      redirectToLogin();
    }
  }, 5000);
}

// ================================================================
// LANCER LA PROTECTION
// ================================================================
initAuthGuard(async (user) => {
  // Cache-first : récupérer Premium immédiatement
  const cached = getCachedUserData(user.uid);

  // Charger les données
  loadSubjectFromFirestore();
  loadUserData(user);
});

// ⚡ EXPOSITION POUR LE ROUTEUR SPA
// ================================================================
// Le routeur appelle cette fonction après chaque navigation.
// Elle relit l'URL et recharge Firestore sans recharger la page.

window.arvexaRechargerMatiere = function() {
  // 1. Relire l'URL
  const p = new URLSearchParams(window.location.search);
  const newSubjectKey = p.get('subject') || 'mathematiques';

  // 2. Si la matière n'a pas changé → ne rien faire
  if (window.__arvexaCurrentSubject === newSubjectKey) {
    console.log('[Matiere] Même matière, pas de rechargement');
    return;
  }

  // 3. Mettre à jour la variable globale
  window.__arvexaCurrentSubject = newSubjectKey;

  // 4. Nettoyer les anciens listeners Firestore
  if (unsubscribeSubject) { try { unsubscribeSubject(); } catch(e){} unsubscribeSubject = null; }
  if (unsubscribeChapters) { try { unsubscribeChapters(); } catch(e){} unsubscribeChapters = null; }

  // 5. Réinitialiser l'état
  subjectConfig = null;
  chapters = [];
  isPremium = false;

  // 6. Recharger depuis Firestore avec la nouvelle URL
  // Note : subjectKey est maintenant lu depuis window.__arvexaCurrentSubject
  // On doit recréer toutes les fonctions qui utilisent subjectKey…
  // → On utilise un rechargement complet des données
  rechargerToutPourNouvelleMatiere(newSubjectKey);
};

// ⚡ Fonction interne qui recharge tout pour une nouvelle matière
function rechargerToutPourNouvelleMatiere(newSubject) {
  // On ne peut pas modifier `subjectKey` car c'est une const
  // → On va recharger les données manuellement avec la nouvelle clé

  // 1. Charger la config de la nouvelle matière
  const cfg = SUBJECTS_CONFIG[newSubject];
  if (cfg) {
    subjectConfig = {
      name: cfg.name,
      description: cfg.description || '',
      icon: cfg.icon,
      color: cfg.color
    };
  } else {
    // Matière inconnue
    window.location.href = 'index.html';
    return;
  }

  // 2. Charger les chapitres fallback
  const fallback = DEFAULT_CHAPTERS[newSubject] || [];
  chapters = fallback.map((ch, i) => ({
    title: typeof ch === 'string' ? ch : ch.title,
    isFree: typeof ch === 'object' ? ch.isFree === true : (i === 0),
    description: '',
    order: i,
    difficulty: null,
    estimatedMinutes: 0,
    totalParts: 0
  }));

  // 3. Render immédiat (fallback)
  renderHero();
  renderChapters();
  renderProgress();

  // 4. Écouter Firestore pour la nouvelle matière
  const subjectRef = doc(db, 'subjects', newSubject);
  unsubscribeSubject = onSnapshot(subjectRef,
    (subjectSnap) => {
      if (subjectSnap.exists()) {
        const data = subjectSnap.data();
        subjectConfig = {
          name: data.name || cfg.name,
          description: data.description || '',
          icon: data.icon || cfg.icon,
          color: data.color || cfg.color
        };
        renderHero();
      }
    },
    (error) => console.warn('Firestore subject error:', error.code || error.message)
  );

  const chaptersQuery = query(
    collection(db, 'subjects', newSubject, 'chapters'),
    orderBy('order', 'asc')
  );

  unsubscribeChapters = onSnapshot(chaptersQuery,
    (snap) => {
      if (!snap.empty) {
        chapters = snap.docs.map(d => {
          const data = d.data();
          return {
            id: d.id,
            title: data.title || '',
            description: data.description || '',
            isFree: data.isFree === true,
            order: data.order || 0,
            difficulty: data.difficulty || null,
            estimatedMinutes: data.estimatedMinutes || 0,
            totalParts: data.totalParts || 0
          };
        });
        renderChapters();
        renderProgress();
        renderHero();
      }
    },
    (error) => console.warn('Firestore chapters error:', error.code || error.message)
  );
}

// ⚡ Initialiser la matière courante au premier chargement
window.__arvexaCurrentSubject = subjectKey;
    
console.log('🚀 ARVEXA — Matière (version corrigée C1-C8)');
</script>
