<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Lecture">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="perf.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="register-sw.js" defer></script>

  <style>
    /* ============================================================
       ROOT — Tokens
       ============================================================ */
    :root {
      --primary: #1A3A2A;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --success: #2D7D5A;
      --success-light: #3AB67E;
      --danger: #B85C3A;
      --danger-light: #f87171;
      --warning: #D4A017;
      --blue: #60a5fa;

      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);

      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --text-body: #cfd0cc;

      --border-soft: rgba(255, 255, 255, 0.05);
      --border-gold: rgba(224, 184, 74, 0.1);
      --card-border: rgba(184, 134, 11, 0.08);

      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --radius: 16px;
      --content-max: 820px;

      --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-mono: 'SF Mono', 'Monaco', 'Consolas', 'Courier New', monospace;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html[data-theme="light"] {
      --bg-dark: #FAF7F0;
      --bg-surface: #FFFFFF;
      --bg-card: rgba(255, 255, 255, 0.85);
      --text-light: #1A1A1A;
      --text-dim: #4A4A4A;
      --text-muted: #7A7A7A;
      --text-body: #2A2A2A;
      --border-soft: rgba(0, 0, 0, 0.08);
      --border-gold: rgba(184, 134, 11, 0.18);
      --card-border: rgba(184, 134, 11, 0.15);
      --accent: #96650A;
      --accent-bright: #B8860B;
      --success: #1E6B47;
      --warning: #B37D00;
      --blue: #2563EB;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; width: 100%; overflow-x: hidden; height: 100%; -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 15px;
      line-height: 1.8;
      min-height: 100vh;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* ============================================================
       FOND
       ============================================================ */
    .gradient-bg {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26, 58, 42, 0.16) 0%, transparent 70%),
        radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
        linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
      transition: opacity 0.3s ease;
    }
    html[data-theme="light"] .gradient-bg {
      background:
        radial-gradient(ellipse 40% 30% at 30% 15%, rgba(184, 134, 11, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 35% 25% at 75% 85%, rgba(26, 58, 42, 0.04) 0%, transparent 60%),
        linear-gradient(180deg, #FAF7F0 0%, #F0EBE0 100%);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(8px + var(--safe-top)) 12px 8px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184, 134, 11, 0.06);
      gap: 8px; min-height: 48px; flex-shrink: 0;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    html[data-theme="light"] .header {
      background: rgba(250, 247, 240, 0.94);
      border-bottom-color: rgba(184, 134, 11, 0.12);
    }

    .header-left {
      display: flex; align-items: center; gap: 10px;
      min-width: 0; flex: 1;
    }

    .header .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--border-soft); background: transparent;
      color: var(--text-dim); cursor: pointer;
      transition: var(--transition); font-size: 14px;
      text-decoration: none; flex-shrink: 0;
    }
    .header .back-btn:hover {
      border-color: rgba(184, 134, 11, 0.14);
      color: var(--text-light);
    }

    .header .header-title {
      font-size: 13px; font-weight: 600;
      color: var(--text-light);
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; min-width: 0;
    }
    .header .header-title i {
      color: var(--accent-bright);
      margin-right: 4px; font-size: 12px;
    }

    .header-right {
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }

    .theme-btn {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid var(--border-soft); background: transparent;
      color: var(--text-dim); cursor: pointer;
      transition: var(--transition); font-size: 13px;
      flex-shrink: 0;
    }
    .theme-btn:hover {
      border-color: rgba(184, 134, 11, 0.2);
      color: var(--accent-bright);
      background: rgba(184, 134, 11, 0.06);
    }
    .theme-btn i { transition: transform 0.3s ease; }
    .theme-btn:hover i { transform: rotate(15deg); }

    .tts-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 11px; border-radius: 20px;
      border: 1px solid rgba(96, 165, 250, 0.15);
      background: rgba(96, 165, 250, 0.06);
      color: var(--blue); font-size: 11px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
      flex-shrink: 0; white-space: nowrap;
    }
    .tts-btn:hover { background: rgba(96, 165, 250, 0.12); }
    .tts-btn i { font-size: 12px; }
    .tts-btn.speaking {
      border-color: rgba(96, 165, 250, 0.4);
      background: rgba(96, 165, 250, 0.15);
    }
    .tts-btn.speaking i { animation: ttsPulse 1.2s ease-in-out infinite; }
    .tts-btn.paused {
      border-color: rgba(224, 184, 74, 0.3);
      background: rgba(224, 184, 74, 0.08);
      color: var(--accent-bright);
    }
    @keyframes ttsPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .notes-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 11px; border-radius: 20px;
      border: 1px solid rgba(184, 134, 11, 0.12);
      background: rgba(184, 134, 11, 0.06);
      color: var(--accent-bright); font-size: 11px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
      flex-shrink: 0; white-space: nowrap;
      position: relative;
    }
    .notes-btn:hover { background: rgba(184, 134, 11, 0.12); }
    .notes-btn i { font-size: 12px; }
    .notes-btn .dot {
      position: absolute; top: 4px; right: 4px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success); display: none;
    }
    .notes-btn .dot.show { display: block; }

    /* ============================================================
       PROGRESSION LECTURE
       ============================================================ */
    .read-progress {
      position: fixed; top: 0; left: 0; right: 0;
      height: 2px; background: transparent;
      z-index: 100; pointer-events: none;
    }
    .read-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      width: 0%; transition: width 0.15s ease-out;
      box-shadow: 0 0 8px rgba(224, 184, 74, 0.5);
    }

    /* ============================================================
       CONTENT WRAPPER
       ============================================================ */
    .content-wrapper {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 16px 24px;   /* ⚡ 80px → 24px */
  max-width: var(--content-max);
  margin: 0 auto;
  width: 100%;
  min-width: 0;
  transition: background-color 0.3s ease;
  /* ⚡ Empêche l'étirement vertical */
  align-self: flex-start;
  height: auto;
  max-height: 100%;
}
    .content-wrapper::-webkit-scrollbar { width: 4px; }
    .content-wrapper::-webkit-scrollbar-track { background: transparent; }
    .content-wrapper::-webkit-scrollbar-thumb {
      background: rgba(184, 134, 11, 0.2);
      border-radius: 10px;
    }

    #contentBody {
      background: transparent;
      min-height: 200px;
      padding: 0;
      min-width: 0;
      max-width: 100%;
      font-size: 16px;
      line-height: 1.85;
      color: var(--text-body);
      letter-spacing: 0.005em;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    /* ============================================================
       ÉTATS
       ============================================================ */
    #contentBody .loading-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px; gap: 12px;
    }
    #contentBody .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(184, 134, 11, 0.15);
      border-top-color: var(--accent-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #contentBody .loading-state p {
      font-size: 13px; color: var(--text-muted);
    }

    /* ============================================================
       SABLIER ANIMÉ — Contenu en préparation
       ============================================================ */
    .hourglass-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hourglass-wrap::before {
      content: '';
      position: absolute;
      inset: -20%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(224, 184, 74, 0.25) 0%,
        rgba(224, 184, 74, 0.08) 40%,
        transparent 70%
      );
      animation: hourglassHalo 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes hourglassHalo {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .hourglass-svg {
      width: 72px;
      height: 72px;
      position: relative;
      z-index: 1;
      animation: hourglassTilt 6s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(224, 184, 74, 0.4));
    }

    @keyframes hourglassTilt {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .hourglass-svg .frame {
      stroke: var(--accent-bright);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hourglass-svg .glass {
      fill: rgba(224, 184, 74, 0.08);
      stroke: rgba(224, 184, 74, 0.4);
      stroke-width: 1.5;
    }

    .hourglass-svg .sand-top {
      fill: var(--accent-bright);
      animation: sandTopDrain 4s ease-in-out infinite;
      transform-origin: center top;
    }

    @keyframes sandTopDrain {
      0%, 10% { transform: scaleY(1); opacity: 1; }
      80%, 90% { transform: scaleY(0.05); opacity: 0.9; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .hourglass-svg .sand-stream {
      fill: var(--accent-bright);
      animation: sandStream 4s ease-in-out infinite;
    }

    @keyframes sandStream {
      0%, 15% { opacity: 0.9; }
      75%, 85% { opacity: 0.9; }
      95%, 100% { opacity: 0; }
    }

    .hourglass-svg .sand-bottom {
      fill: var(--accent-bright);
      animation: sandBottomFill 4s ease-in-out infinite;
      transform-origin: center bottom;
    }

    @keyframes sandBottomFill {
      0%, 10% { transform: scaleY(0.1); opacity: 0.8; }
      80%, 90% { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(0.1); opacity: 0.8; }
    }

    .hourglass-particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 6px var(--accent-bright);
      opacity: 0;
      pointer-events: none;
    }

    .hourglass-particle:nth-child(1) { left: 50%; top: 35%; animation: particleDrop 2.5s ease-in 0s infinite; }
    .hourglass-particle:nth-child(2) { left: 48%; top: 35%; animation: particleDrop 2.5s ease-in 0.6s infinite; }
    .hourglass-particle:nth-child(3) { left: 52%; top: 35%; animation: particleDrop 2.5s ease-in 1.2s infinite; }
    .hourglass-particle:nth-child(4) { left: 50%; top: 35%; animation: particleDrop 2.5s ease-in 1.8s infinite; }

    @keyframes particleDrop {
      0% { opacity: 0; transform: translateY(0) scale(0.5); }
      10% { opacity: 1; transform: translateY(0) scale(1); }
      80% { opacity: 1; transform: translateY(28px) scale(1); }
      100% { opacity: 0; transform: translateY(35px) scale(0.4); }
    }

    html[data-theme="light"] .hourglass-wrap::before {
      background: radial-gradient(
        circle,
        rgba(184, 134, 11, 0.3) 0%,
        rgba(184, 134, 11, 0.1) 40%,
        transparent 70%
      );
    }

    html[data-theme="light"] .hourglass-svg {
      filter: drop-shadow(0 0 12px rgba(184, 134, 11, 0.5));
    }

    .content-unavailable {
      text-align: center; padding: 60px 24px;
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      min-height: 320px; justify-content: center;
    }
    .content-unavailable .cu-icon {
      width: 72px; height: 72px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(184, 134, 11, 0.08);
      border: 1px solid rgba(184, 134, 11, 0.15);
      font-size: 32px; color: var(--accent-bright);
      margin-bottom: 4px;
    }
    .content-unavailable h2 {
      font-family: var(--font-serif);
      font-size: 22px; font-weight: 700;
      color: var(--text-light); margin: 0;
    }
    .content-unavailable p {
      font-size: 14px; color: var(--text-dim);
      max-width: 380px; line-height: 1.7; margin: 0;
    }
    .content-unavailable .cu-actions {
      display: flex; gap: 10px; margin-top: 8px;
      flex-wrap: wrap; justify-content: center;
    }
    .content-unavailable .cu-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 22px; border-radius: 100px;
      border: 1px solid var(--border-soft); background: transparent;
      color: var(--text-light); text-decoration: none;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
    }
    .content-unavailable .cu-btn:hover {
      border-color: rgba(184, 134, 11, 0.3);
      background: rgba(184, 134, 11, 0.08);
      color: var(--accent-bright);
    }
    .content-unavailable .cu-btn.primary {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A; border-color: transparent;
    }
    .content-unavailable .cu-btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(184, 134, 11, 0.3);
    }

    /* ============================================================
       NAVIGATION BAS DE PAGE
       ============================================================ */
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-top: 40px; padding-top: 24px;
      border-top: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 100px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-dim); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body); text-decoration: none;
    }
    .nav-btn:hover:not(:disabled) {
      border-color: rgba(184, 134, 11, 0.2);
      color: var(--text-light);
      transform: translateY(-1px);
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .nav-btn i { font-size: 12px; }
    .nav-btn.primary {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A; border-color: transparent; font-weight: 700;
    }
    .nav-btn.primary:hover:not(:disabled) {
      box-shadow: 0 6px 22px rgba(184, 134, 11, 0.3);
      color: #0A0A0A;
    }
    .nav-counter {
      font-size: 12px; color: var(--text-muted);
      font-weight: 500; padding: 0 8px;
    }

    /* ============================================================
       MODAL NOTES
       ============================================================ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999; display: none;
      align-items: center; justify-content: center;
      padding: 20px; animation: fadeIn 0.3s ease;
    }
    .modal-overlay.show { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px 20px; max-width: 480px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.3s ease; position: relative;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal .modal-close {
      position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px; border-radius: 8px;
      background: transparent; border: 1px solid transparent;
      color: var(--text-muted); font-size: 16px;
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
    }
    .modal .modal-close:hover {
      color: var(--text-light);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-soft);
    }
    .modal .modal-title {
      font-size: 18px; font-weight: 700;
      font-family: var(--font-serif);
      color: var(--text-light);
      margin-bottom: 4px; padding-right: 30px;
    }
    .modal .modal-title span { color: var(--accent-bright); }
    .modal .modal-sub {
      font-size: 12px; color: var(--text-dim);
      margin-bottom: 16px;
    }
    .modal textarea {
      width: 100%; min-height: 180px; max-height: 400px;
      padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-light); font-size: 14px;
      font-family: var(--font-body);
      resize: vertical; outline: none;
      transition: var(--transition); line-height: 1.7;
    }
    html[data-theme="light"] .modal textarea {
      background: rgba(0, 0, 0, 0.02);
    }
    .modal textarea:focus { border-color: rgba(184, 134, 11, 0.3); }
    .modal textarea::placeholder { color: var(--text-muted); }
    .modal .modal-actions {
      display: flex; gap: 10px; margin-top: 14px;
    }
    .modal .modal-actions button {
      flex: 1; padding: 11px; border-radius: 100px;
      border: none; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font-body);
    }
    .modal .modal-actions .btn-save {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
    }
    .modal .modal-actions .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(184, 134, 11, 0.25);
    }
    .modal .modal-actions .btn-cancel {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
      border: 1px solid var(--border-soft);
    }
    html[data-theme="light"] .modal .modal-actions .btn-cancel {
      background: rgba(0, 0, 0, 0.04);
    }
    .modal .modal-actions .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-light);
    }
    .modal .note-saved {
      font-size: 12px; color: var(--success);
      margin-top: 10px; display: none;
      align-items: center; gap: 6px;
    }
    .modal .note-saved.show { display: flex; }

    .tts-progress {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 3px; background: rgba(96, 165, 250, 0.1);
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .tts-progress.active { opacity: 1; }
    .tts-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--accent-bright));
      width: 0%; transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(96, 165, 250, 0.5);
    }

    /* ============================================================
       TYPOGRAPHIE GÉNÉRALE DU CONTENU
       ============================================================ */
    #contentBody h1,
    #contentBody h2,

      <div class="note-saved" id="noteSaved"><i class="fas fa-check-circle"></i> Notes enregistrées !</div>

        <button class="btn-cancel" id="modalCancel">Annuler</button>
        <button class="btn-save" id="modalSave">💾 Enregistrer</button>
      </div>

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
  </script>

  <script type="module">
  // ================================================================
  // LECTURE — Version robuste anti-flash
  // ================================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import {
    initializeFirestore,
    persistentLocalCache,
    persistentSingleTabManager,
    doc,
    onSnapshot,
    getDoc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
    authDomain: "arvexa-fbf10.firebaseapp.com",
    projectId: "arvexa-fbf10",
    storageBucket: "arvexa-fbf10.firebasestorage.app",
    messagingSenderId: "920108330053",
    appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const db = initializeFirestore(app, {
    localCache: persistentLocalCache({
      tabManager: persistentSingleTabManager()
    })
  });

  try {
    await setPersistence(auth, browserLocalPersistence);
  } catch (e) {}

  // ================================================================
  // THÈME
  // ================================================================
  const THEME_KEY = 'arvexa_theme';

  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      const icon = document.getElementById('themeIcon');
      if (icon) icon.className = 'fas fa-sun';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', '#FAF7F0');
    } else {
      document.documentElement.removeAttribute('data-theme');
      const icon = document.getElementById('themeIcon');
      if (icon) icon.className = 'fas fa-moon';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', '#0A0A0A');
    }
  }

  function initTheme() {
    try {
      const saved = localStorage.getItem(THEME_KEY);
      applyTheme(saved === 'light' ? 'light' : 'dark');
    } catch (e) {
      applyTheme('dark');
    }
  }

  initTheme();

  document.getElementById('themeBtn').addEventListener('click', () => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? 'dark' : 'light';
    applyTheme(newTheme);
    try { localStorage.setItem(THEME_KEY, newTheme); } catch (e) {}
  });

  // ================================================================
  // URL PARAMS
  // ================================================================
  const params = new URLSearchParams(window.location.search);
  const subject = params.get('subject') || 'mathematiques';
  const chapter = parseInt(params.get('chapter')) || 0;
  const tab = params.get('tab') || 'cours';
  const partIndex = parseInt(params.get('part')) || 0;

  // ================================================================
  // DOM
  // ================================================================
  const contentBody = document.getElementById('contentBody');
  const pageTitle = document.querySelector('#pageTitle span');
  const backBtn = document.getElementById('backBtn');
  const notesBtn = document.getElementById('notesBtn');
  const notesDot = document.getElementById('notesDot');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const partCounter = document.getElementById('partCounter');
  const readProgressFill = document.getElementById('readProgressFill');
  const contentWrapper = document.getElementById('contentWrapper');

  const notesModal = document.getElementById('notesModal');
  const modalClose = document.getElementById('modalClose');
  const modalCancel = document.getElementById('modalCancel');
  const modalSave = document.getElementById('modalSave');
  const notesTextarea = document.getElementById('notesTextarea');
  const modalSub = document.getElementById('modalSub');
  const noteSaved = document.getElementById('noteSaved');

  const ttsBtn = document.getElementById('ttsBtn');
  const ttsProgress = document.getElementById('ttsProgress');
  const ttsProgressFill = document.getElementById('ttsProgressFill');

  // ================================================================
  // SESSION / CACHE
  // ================================================================
  const SESSION_KEY = 'arvexa_session';
  const USER_DATA_KEY = 'arvexa_user_data';
  const LAST_UID_KEY = 'arvexa_last_uid';
  const READ_KEY = 'arvexa_read_parts';
  const NOTES_KEY = 'arvexa_notes';

  function saveSession(user) {
    if (!user) return;
    try {
      const data = {
        uid: user.uid,
        email: user.email,
        lastActive: Date.now()
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(data));
      localStorage.setItem(LAST_UID_KEY, user.uid);
    } catch (e) {}
  }

  function clearSession() {
    try {
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(USER_DATA_KEY);
      localStorage.removeItem(LAST_UID_KEY);
      sessionStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  function getCachedUserData(uid) {
    try {
      const raw = localStorage.getItem(USER_DATA_KEY);
      if (!raw) return null;
      const cached = JSON.parse(raw);
      if (cached._uid && cached._uid !== uid) {
        localStorage.removeItem(USER_DATA_KEY);
        return null;
      }
      return cached;
    } catch (e) { return null; }
  }

  // ================================================================
  // UTILITAIRE
  // ================================================================
  function toDate(value) {
    if (!value) return null;
    if (typeof value.toDate === 'function') return value.toDate();
    if (value.seconds !== undefined) return new Date(value.seconds * 1000);
    const date = value instanceof Date ? value : new Date(value);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function isUserPremium(userData) {
    if (!userData) return false;
    const hasStatus = userData.premium === true ||
                      userData.isUnlocked === true ||
                      userData.hasDeposited === true;
    if (!hasStatus) return false;
    const endDate = toDate(userData.subscriptionEndDate);
    if (!endDate) return true;
    return endDate.getTime() > Date.now();
  }

  // ================================================================
  // STORAGE
  // ================================================================
  function getReadParts() {
    try { return JSON.parse(localStorage.getItem(READ_KEY) || '[]'); }
    catch (e) { return []; }
  }

  function markPartAsRead() {
    const key = `${subject}_${chapter}_${tab}_${partIndex}`;
    const readParts = getReadParts();
    if (!readParts.includes(key)) {
      readParts.push(key);
      try { localStorage.setItem(READ_KEY, JSON.stringify(readParts)); } catch (e) {}
    }
  }

  function getNotesKey() {
    return `${subject}_${chapter}_${tab}_${partIndex}`;
  }

  function loadNotes() {
    try {
      const notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
      const key = getNotesKey();
      if (notes[key]) {
        notesTextarea.value = notes[key];
        notesDot.classList.add('show');
      } else {
        notesTextarea.value = '';
        notesDot.classList.remove('show');
      }
    } catch (e) {}
  }

  function saveNotes() {
    try {
      const notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
      const key = getNotesKey();
      const text = notesTextarea.value.trim();
      if (text) {
        notes[key] = text;
        notesDot.classList.add('show');
      } else {
        delete notes[key];
        notesDot.classList.remove('show');
      }
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      noteSaved.classList.add('show');
      setTimeout(() => noteSaved.classList.remove('show'), 2000);
    } catch (e) {}
  }

  // ================================================================
  // ÉTAT
  // ================================================================
  let parts = [];
  let currentIndex = partIndex;
  let isPremium = false;
  let currentUid = null;
  let unsubscribeUser = null;

  // ================================================================
  // PRÉ-PROCESSING
  // ================================================================
  function preprocessContent(html) {
    if (!html) return '';

    let processed = html;

    processed = processed.replace(/<style[\s\S]*?<\/style>/gi, '');
    processed = processed.replace(/<script[\s\S]*?<\/script>/gi, '');

    return processed;
  }

  // ================================================================
  // KATEX
  // ================================================================
  function renderKaTeX() {
    if (typeof renderMathInElement !== 'function') {
      setTimeout(renderKaTeX, 200);
      return;
    }
    try {
      renderMathInElement(contentBody, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false,
        errorColor: '#f87171',
        strict: false,
        trust: false,
        macros: {
          "\\R": "\\mathbb{R}",
          "\\C": "\\mathbb{C}",
          "\\N": "\\mathbb{N}",
          "\\Z": "\\mathbb{Z}",
          "\\Q": "\\mathbb{Q}",
          "\\Re": "\\operatorname{Re}",
          "\\Im": "\\operatorname{Im}",
          "\\arg": "\\operatorname{arg}"
        }
      });
    } catch (e) {}
  }

  // ================================================================
  // CHARGEMENT
  // ================================================================
 function loadContent() {
  const manifestPath = `cours/${subject}.json`;

  contentBody.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Chargement du contenu...</p>
    </div>
  `;

  fetch(manifestPath)
    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(data => {
      // ⚡ Trouver le chapitre
      const ch = (data.chapters || []).find(c => c.number === chapter);
      if (!ch) { showContentUnavailable(); return; }

      // ⚡ Choisir la section selon l'onglet
      const tabKey = tab === 'cours' ? 'cours'
                   : tab === 'exercices' ? 'exercices'
                   : 'corrections';

      parts = (ch[tabKey] || []).map(p => ({
        title: p.title || `Partie ${p.part}`,
        file: p.file || '',
        part: p.part,
        duration: p.duration || 0
      }));

      // ⚡ Filtrer les parties sans fichier
      parts = parts.filter(p => p.file);

      if (parts.length === 0) {
        showContentUnavailable();
        return;
      }

      if (currentIndex >= parts.length) currentIndex = 0;
      renderPart();
    })
    .catch(() => {
      showContentUnavailable();
    });
}

 function renderPart() {
  if (!parts || parts.length === 0) {
    showContentUnavailable();
    return;
  }
  if (currentIndex >= parts.length || currentIndex < 0) currentIndex = 0;

  const part = parts[currentIndex];
  if (!part) {
    showContentUnavailable();
    return;
  }

  stopTTS();

  pageTitle.textContent = part.title || 'Partie ' + (currentIndex + 1);
  document.title = 'ARVEXA - ' + (part.title || 'Lecture');

  partCounter.textContent = `${currentIndex + 1} / ${parts.length}`;
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex >= parts.length - 1;
  modalSub.textContent = part.title || 'Partie ' + (currentIndex + 1);

  // ⚡ Le chemin est déjà complet dans part.file
  const filePath = part.file;

  contentBody.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Chargement...</p>
    </div>
  `;

  fetch(filePath)
    .then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
    .then(html => {
      const cleaned = preprocessContent(html);
      contentBody.innerHTML = cleaned;
      markPartAsRead();
      loadNotes();
      renderKaTeX();
      updateReadProgress();
      resetStudyTimer();
    })
    .catch(() => {
      showContentUnavailable();
    });
}

    readProgressFill.style.width = progress + '%';
  }

  // ================================================================
  // TTS
  // ================================================================
  const TTS_SUPPORTED = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

  const tts = {
    synth: TTS_SUPPORTED ? window.speechSynthesis : null,
    chunks: [],
    currentChunk: 0,
    utterance: null,
    voice: null,
    isSpeaking: false,
    isPaused: false,
    isActive: false,
    rate: 0.92,
    pitch: 1,
    volume: 1,
    stopRequested: false
  };

  function loadTTSVoices() {
    if (!TTS_SUPPORTED) return;
    const voices = tts.synth.getVoices();
    if (!voices || voices.length === 0) return;
    tts.voice =
      voices.find(v => v.lang && v.lang.toLowerCase() === 'fr-fr' && v.localService) ||
      voices.find(v => v.lang && v.lang.toLowerCase() === 'fr-fr') ||
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) ||
      null;
  }

  loadTTSVoices();
  if (TTS_SUPPORTED && 'onvoiceschanged' in window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = loadTTSVoices;
  }

  function cleanTTS(text) {
    if (!text) return '';
    let result = String(text);
    result = result.replace(/\$\$([^$]+)\$\$/g, (m, f) => convertMathToSpeech(f));
    result = result.replace(/\$([^$]+)\$/g, (m, f) => convertMathToSpeech(f));
    result = result.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, ' ');
    result = result.replace(/⟺/g, ' si et seulement si ');
    result = result.replace(/⟹/g, ' implique ');
    result = result.replace(/→/g, ' vers ');
    result = result.replace(/←/g, ' de ');
    result = result.replace(/∈/g, ' appartient à ');
    result = result.replace(/≤/g, ' inférieur ou égal à ');
    result = result.replace(/≥/g, ' supérieur ou égal à ');
    result = result.replace(/≠/g, ' différent de ');
    result = result.replace(/√/g, ' racine carrée de ');
    result = result.replace(/([A-Za-z0-9])²/g, '$1 au carré');
    result = result.replace(/([A-Za-z0-9])³/g, '$1 au cube');
    result = result.replace(/×/g, ' fois ');
    result = result.replace(/÷/g, ' divisé par ');
    result = result.replace(/∞/g, ' infini ');
    result = result.replace(/π/g, ' pi ');
    result = result.replace(/−/g, ' moins ');
    return result.replace(/\s+/g, ' ').trim();
  }

  function convertMathToSpeech(latex) {
    let s = String(latex);
    s = s.replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, ' $1 sur $2 ');
    s = s.replace(/\\sqrt\{([^}]+)\}/g, ' racine de $1 ');
    s = s.replace(/([a-zA-Z0-9])\^\{([^}]+)\}/g, ' $1 puissance $2 ');
    s = s.replace(/([a-zA-Z0-9])\^([a-zA-Z0-9])/g, ' $1 puissance $2 ');
    s = s.replace(/([a-zA-Z0-9])_\{([^}]+)\}/g, ' $1 indice $2 ');
    s = s.replace(/([a-zA-Z0-9])_([a-zA-Z0-9])/g, ' $1 indice $2 ');
    s = s.replace(/\\cos/g, ' cosinus ');
    s = s.replace(/\\sin/g, ' sinus ');
    s = s.replace(/\\tan/g, ' tangente ');
    s = s.replace(/\\ln/g, ' logarithme népérien ');
    s = s.replace(/\\pi/g, ' pi ');
    s = s.replace(/\\times/g, ' fois ');
    s = s.replace(/\\div/g, ' divisé par ');
    s = s.replace(/\\infty/g, ' infini ');
    s = s.replace(/\\/g, ' ');
    s = s.replace(/[{}]/g, ' ');
    return s.replace(/\s+/g, ' ').trim();
  }

  function extractReadableContent() {
    const container = document.querySelector('#contentBody .lecture-container') ||
                      document.querySelector('.lecture-container') ||
                      document.querySelector('#contentBody');
    if (!container) return [];

    const parts = [];
    const selectors = [
      '.lecture-hero h1', '.lecture-hero p',
      '.lecture-section h2', '.lecture-section h3', '.lecture-section p',
      '.lecture-callout', '.lecture-aside',
      '.lecture-example p', '.lecture-formula-main',
      '.lecture-step p', '.lecture-container > p'
    ];

    const elements = container.querySelectorAll(selectors.join(','));
    const seen = new Set();

    elements.forEach(el => {
      if (seen.has(el)) return;
      if (el.closest('button') || el.matches('button')) return;
      let text = el.innerText || el.textContent || '';
      text = cleanTTS(text);
      if (!text) return;
      if (parts.some(p => p.toLowerCase() === text.toLowerCase())) return;
      seen.add(el);
      parts.push(text);
    });

    if (parts.length === 0) {
      let fallback = container.innerText || container.textContent || '';
      fallback = cleanTTS(fallback);
      if (fallback) parts.push(fallback);
    }

    const chunks = [];
    parts.forEach(text => {
      const sentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
      let current = '';
      sentences.forEach(s => {
        s = s.trim();
        if (!s) return;
        if ((current + ' ' + s).length <= 200) {
          current += (current ? ' ' : '') + s;
        } else {
          if (current) chunks.push(current.trim());
          current = s;
        }
      });
      if (current) chunks.push(current.trim());
    });

    return chunks.filter(c => c.length > 1);
  }

  function updateTTSButton(state) {
    if (!ttsBtn) return;
    const icon = ttsBtn.querySelector('i');
    const text = ttsBtn.querySelector('span');
    if (state === 'speaking') {
      ttsBtn.classList.add('speaking');
      ttsBtn.classList.remove('paused');
      if (icon) icon.className = 'fas fa-pause';
      if (text) text.textContent = 'Pause';
    } else if (state === 'paused') {
      ttsBtn.classList.remove('speaking');
      ttsBtn.classList.add('paused');
      if (icon) icon.className = 'fas fa-play';
      if (text) text.textContent = 'Reprendre';
    } else {
      ttsBtn.classList.remove('speaking', 'paused');
      if (icon) icon.className = 'fas fa-volume-up';
      if (text) text.textContent = 'Écouter';
    }
  }

  function updateTTSProgress() {
    if (!ttsProgressFill || !tts.chunks.length) return;
    const p = ((tts.currentChunk + 1) / tts.chunks.length) * 100;
    ttsProgressFill.style.width = Math.min(100, p) + '%';
  }

  function resetTTSProgress() {
    if (ttsProgressFill) ttsProgressFill.style.width = '0%';
  }

  function speakChunk(index) {
    if (!TTS_SUPPORTED) return;
    if (index >= tts.chunks.length) { finishTTS(); return; }
    if (tts.stopRequested) return;

    tts.currentChunk = index;
    const text = tts.chunks[index];
    if (!text) { speakChunk(index + 1); return; }

    try { tts.synth.cancel(); } catch (e) {}

    const utterance = new SpeechSynthesisUtterance(text);
    tts.utterance = utterance;
    utterance.lang = 'fr-FR';
    utterance.rate = tts.rate;
    utterance.pitch = tts.pitch;
    utterance.volume = tts.volume;
    if (tts.voice) utterance.voice = tts.voice;

    utterance.onstart = () => {
      tts.isSpeaking = true;
      tts.isPaused = false;
      updateTTSButton('speaking');
      updateTTSProgress();
    };

    utterance.onend = () => {
      if (tts.stopRequested) return;
      const next = index + 1;
      if (next < tts.chunks.length) {
        setTimeout(() => {
          if (tts.isSpeaking && !tts.isPaused && !tts.stopRequested) speakChunk(next);
        }, 80);
      } else finishTTS();
    };

    utterance.onerror = (e) => {
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      finishTTS();
    };

    tts.synth.speak(utterance);
    setTimeout(() => {
      if (tts.isSpeaking && !tts.isPaused && !tts.stopRequested) {
        try { tts.synth.resume(); } catch (e) {}
      }
    }, 100);
  }

  function startTTS() {
    if (!TTS_SUPPORTED) return;
    try { tts.synth.cancel(); } catch (e) {}
    tts.stopRequested = false;
    tts.chunks = extractReadableContent();
    if (!tts.chunks.length) return;
    loadTTSVoices();
    tts.currentChunk = 0;
    tts.isSpeaking = true;
    tts.isPaused = false;
    tts.isActive = true;
    ttsProgress.classList.add('active');
    resetTTSProgress();
    updateTTSButton('speaking');
    speakChunk(0);
  }

  function pauseTTS() {
    if (!TTS_SUPPORTED || !tts.synth || !tts.isSpeaking) return;
    try { tts.synth.cancel(); } catch (e) {}
    tts.isPaused = true;
    tts.isSpeaking = false;
    updateTTSButton('paused');
  }

  function resumeTTS() {
    if (!TTS_SUPPORTED || !tts.synth || !tts.isPaused) return;
    tts.isPaused = false;
    tts.isSpeaking = true;
    tts.stopRequested = false;
    updateTTSButton('speaking');
    setTimeout(() => {
      if (tts.isSpeaking && !tts.isPaused && !tts.stopRequested) speakChunk(tts.currentChunk);
    }, 150);
  }

  function stopTTS() {
    if (!TTS_SUPPORTED || !tts.synth) return;
    tts.stopRequested = true;
    try { tts.synth.cancel(); } catch (e) {}
    tts.isSpeaking = false;
    tts.isPaused = false;
    tts.isActive = false;
    tts.utterance = null;
    tts.currentChunk = 0;
    updateTTSButton('stopped');
    resetTTSProgress();
    ttsProgress.classList.remove('active');
  }

  function finishTTS() {
    tts.isSpeaking = false;
    tts.isPaused = false;
    tts.isActive = false;
    tts.stopRequested = false;
    tts.utterance = null;
    updateTTSButton('stopped');
    if (ttsProgressFill) {
      ttsProgressFill.style.width = '100%';
      setTimeout(() => {
        if (!tts.isSpeaking) {
          ttsProgressFill.style.width = '0%';
          ttsProgress.classList.remove('active');
        }
      }, 1000);
    }
  }

  if (ttsBtn) {
    ttsBtn.addEventListener('click', () => {
      if (!TTS_SUPPORTED) return;
      if (tts.isSpeaking) pauseTTS();
      else if (tts.isPaused) resumeTTS();
      else startTTS();
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && tts.isSpeaking) {
      try { tts.synth.pause(); } catch (e) {}
    }
  });

  window.addEventListener('beforeunload', () => {
    try { if (tts.synth) tts.synth.cancel(); } catch (e) {}
  });

  // ================================================================
  // SUIVI DU TEMPS D'ÉTUDE
  // ================================================================
  let studyStartTime = Date.now();
  let studyTimeActive = true;

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      pauseStudyTime();
    } else {
      resumeStudyTime();
    }
  });

  function pauseStudyTime() {
    if (!studyTimeActive) return;
    const duration = Math.floor((Date.now() - studyStartTime) / 1000);
    if (duration >= 5) {
      saveStudyTime(duration);
    }
    studyTimeActive = false;
  }

  function resumeStudyTime() {
    studyStartTime = Date.now();
    studyTimeActive = true;
  }

  window.addEventListener('beforeunload', () => {
    pauseStudyTime();
  });

  function saveStudyTimeBeforeChange() {
    const duration = Math.floor((Date.now() - studyStartTime) / 1000);
    if (duration >= 5) {
      saveStudyTime(duration);
    }
    studyStartTime = Date.now();
  }

  async function saveStudyTime(seconds) {
    const user = auth.currentUser;
    if (!user) return;

    try {
      const userRef = doc(db, 'users', user.uid);
      const snap = await getDoc(userRef);
      if (snap.exists()) {
        const current = snap.data().totalStudyTime || 0;
        await updateDoc(userRef, {
          totalStudyTime: current + seconds,
          lastStudyUpdate: serverTimestamp()
        });
      }
    } catch (e) {
      // Silencieux
    }
  }

  function resetStudyTimer() {
    studyStartTime = Date.now();
    studyTimeActive = true;
  }

  // ================================================================
  // CHARGEMENT UTILISATEUR (temps réel)
  // ================================================================
  function loadUserData(user) {
    if (unsubscribeUser) {
      unsubscribeUser();
      unsubscribeUser = null;
    }
    const userRef = doc(db, 'users', user.uid);
    unsubscribeUser = onSnapshot(userRef,
      (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          const newPremium = isUserPremium(data);
          if (newPremium !== isPremium) isPremium = newPremium;
          try {
            localStorage.setItem(USER_DATA_KEY, JSON.stringify({
              ...data,
              _uid: user.uid,
              _cachedAt: Date.now()
            }));
          } catch (e) {}
        } else {
          const cached = getCachedUserData(user.uid);
          if (cached) {
            const newPremium = isUserPremium(cached);
            if (newPremium !== isPremium) isPremium = newPremium;
          }
        }
      },
      (error) => {
        const cached = getCachedUserData(user.uid);
        if (cached) {
          const newPremium = isUserPremium(cached);
          if (newPremium !== isPremium) isPremium = newPremium;
        }
      }
    );
  }

  // ================================================================
  // AUTH ROBUSTE — Anti-flash

  let isRedirecting = false;
  let isAuthResolved = false;
  let graceTimer = null;
  let maxTimer = null;

  function redirectToLogin() {
    if (isRedirecting) return;
    isRedirecting = true;
    try {
      sessionStorage.setItem('redirectAfterLogin',
        window.location.pathname + window.location.search);
    } catch (e) {}
    window.location.replace('login.html');
  }

  function initAuthGuard(onAuthenticated) {
    auth.onAuthStateChanged((user) => {
      if (isAuthResolved) {
        if (user && user.uid !== currentUid) {
          currentUid = user.uid;
          saveSession(user);
          onAuthenticated(user);
        } else if (!user && currentUid) {
          currentUid = null;
          clearSession();
          stopTTS();
          redirectToLogin();
        }
        return;
      }

      if (!user) {
        if (graceTimer) clearTimeout(graceTimer);
        graceTimer = setTimeout(() => {
          if (isAuthResolved) return;
          if (auth.currentUser) return;

          const hasSession = localStorage.getItem(SESSION_KEY);
          const hasUserData = localStorage.getItem(USER_DATA_KEY);

          if ((hasSession || hasUserData) && !navigator.onLine) {
            setTimeout(() => {
              if (auth.currentUser) return;
              if (!isAuthResolved) redirectToLogin();
            }, 1500);
            return;
          }

          if (hasSession && hasUserData) {
            setTimeout(() => {
              if (auth.currentUser) return;
              if (!isAuthResolved) redirectToLogin();
            }, 1500);
            return;
          }

          redirectToLogin();
        }, 600);
        return;
      }

      if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
      if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }

      isAuthResolved = true;
      currentUid = user.uid;
      saveSession(user);
      onAuthenticated(user);
    });

    maxTimer = setTimeout(() => {
      if (isAuthResolved) return;
      if (auth.currentUser) {
        isAuthResolved = true;
        currentUid = auth.currentUser.uid;
        saveSession(auth.currentUser);
        onAuthenticated(auth.currentUser);
      } else {
        redirectToLogin();
      }
    }, 5000);
  }

  // ================================================================

  initAuthGuard(async (user) => {
    const cached = getCachedUserData(user.uid);
    isPremium = cached ? isUserPremium(cached) : false;

    loadContent();
    loadUserData(user);
  });
