<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Tableau périodique des éléments">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="perf.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="register-sw.js" defer></script>

  <style>
    :root {
      --primary: #1A3A2A; --primary-dark: #0A1A12; --primary-light: #2A5A3A;
      --accent: #B8860B; --accent-bright: #E0B84A; --accent-dim: rgba(184,134,11,0.08);
      --success: #2D7D5A; --danger: #B85C3A; --warning: #D4A017;
      --bg-dark: #0A0A0A; --bg-surface: #141414; --bg-card: rgba(20,20,20,0.7);
      --text-light: #F5F0E8; --text-dim: #8A8A7A; --text-muted: #5A5A4A;
      --card-border: rgba(184,134,11,0.08);
      --transition: all 0.3s cubic-bezier(0.25,1,0.5,1);
      --shadow: 0 8px 32px rgba(0,0,0,0.4); --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth;width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
    body{
      font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;
      background:var(--bg-dark);color:var(--text-light);font-size:14px;line-height:1.6;
      min-height:100vh;width:100%;overflow-x:hidden;-webkit-overflow-scrolling:touch;
      display:flex;flex-direction:column;
      padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
    }
    .gradient-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;
      background:radial-gradient(ellipse 40% 30% at 30% 15%,rgba(26,58,42,.16) 0%,transparent 70%),
                  radial-gradient(ellipse 35% 25% at 75% 85%,rgba(184,134,11,.05) 0%,transparent 60%),
                  linear-gradient(180deg,#0A0A0A 0%,#060606 100%)
    }
    .glow{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:-1;
      opacity:.15;animation:glowMove 10s ease-in-out infinite alternate}
    .glow-1{width:300px;height:300px;background:rgba(26,58,42,.18);top:-80px;right:-80px}
    .glow-2{width:180px;height:180px;background:rgba(184,134,11,.05);bottom:0;left:0;animation-delay:-4s}
    @keyframes glowMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-20px) scale(1.1)}}

    /* HEADER */
    .header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
      padding:10px 16px;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(184,134,11,.06);gap:12px;min-height:56px}
    .header-left{display:flex;align-items:center;gap:12px}
    .back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
      border:1px solid rgba(255,255,255,.05);background:transparent;color:var(--text-dim);cursor:pointer;
      transition:var(--transition);font-size:16px;text-decoration:none}
    .back-btn:hover{border-color:rgba(184,134,11,.14);color:var(--text-light)}
    .page-title{font-size:14px;font-weight:600;color:var(--text-light);font-family:'Playfair Display',serif;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
    .page-title i{color:var(--accent-bright);margin-right:6px;font-size:13px}

    /* CONTAINER */
    .container{max-width:1100px;margin:0 auto;padding:12px 12px 100px;width:100%;display:flex;flex-direction:column;gap:12px;flex:1}

    /* SEARCH BAR */
    .search-row{display:flex;gap:8px;align-items:center}
    .search-wrap{flex:1;position:relative}
    .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none}
    .search-input{width:100%;padding:10px 12px 10px 36px;border-radius:12px;border:1px solid rgba(255,255,255,.06);
      background:var(--bg-card);backdrop-filter:blur(10px);color:var(--text-light);font-size:13px;
      font-family:'Inter',sans-serif;outline:none;transition:var(--transition)}
    .search-input::placeholder{color:var(--text-muted)}
    .search-input:focus{border-color:rgba(184,134,11,.2)}
    .bac-toggle{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;
      border:1px solid rgba(255,255,255,.06);background:var(--bg-card);backdrop-filter:blur(10px);
      color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);
      white-space:nowrap;font-family:'Inter',sans-serif}
    .bac-toggle:hover{border-color:rgba(184,134,11,.14)}
    .bac-toggle.active{background:rgba(184,134,11,.1);color:var(--accent-bright);border-color:rgba(184,134,11,.15)}
    .bac-toggle i{font-size:12px}

    /* LEGEND */
    .legend-row{display:flex;flex-wrap:wrap;gap:6px 12px;padding:4px 0}
    .legend-item{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 8px;border-radius:8px;
      transition:var(--transition);opacity:1}
    .legend-item:hover{opacity:.8}
    .legend-item.dimmed{opacity:.2;pointer-events:none}
    .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
    .legend-label{font-size:10px;color:var(--text-dim);font-weight:500;white-space:nowrap}

    /* TABLE WRAPPER */
    .table-scroll{overflow-x:auto;overflow-y:visible;padding:4px 0;-webkit-overflow-scrolling:touch;
      border-radius:var(--radius);background:rgba(255,255,255,.01);border:1px solid rgba(255,255,255,.03)}
    .table-scroll::-webkit-scrollbar{height:4px}
    .table-scroll::-webkit-scrollbar-thumb{background:rgba(184,134,11,.2);border-radius:10px}
    .ptable{display:grid;grid-template-columns:repeat(18,1fr);grid-template-rows:repeat(7,auto) 20px repeat(2,auto);
      gap:3px;padding:12px;min-width:780px}

    /* LANTHANIDE / ACTINIDE LABELS */
    .la-ac-label{grid-column:1/4;grid-row:9;display:flex;align-items:center;justify-content:flex-end;
      padding-right:10px;font-size:11px;color:var(--text-muted);font-weight:600}
    .la-ac-label:nth-child(2){grid-row:10}

    /* ELEMENT CELL */
    .el{border-radius:6px;padding:4px 3px;cursor:pointer;transition:all .2s ease;display:flex;flex-direction:column;
      align-items:center;justify-content:center;min-height:56px;position:relative;border:1px solid transparent;
      text-align:center;overflow:hidden}
    .el:hover{transform:scale(1.12);z-index:10;box-shadow:0 4px 20px rgba(0,0,0,.5);border-color:rgba(255,255,255,.15)}
    .el:active{transform:scale(1.05)}
    .el.bac-mode-dim{opacity:.15;pointer-events:none;filter:grayscale(1)}
    .el.bac-highlight{box-shadow:0 0 0 2px var(--accent-bright),0 0 12px rgba(184,134,11,.3)}
    .el.search-hidden{opacity:0;pointer-events:none;transform:scale(.8);max-height:0;padding:0;margin:0;overflow:hidden}
    .el .el-z{font-size:8px;opacity:.7;line-height:1}
    .el .el-sym{font-size:15px;font-weight:700;line-height:1.3;font-family:'Playfair Display',serif}
    .el .el-nom{font-size:7px;opacity:.6;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .el .el-masse{font-size:7px;opacity:.5;line-height:1}

    /* Category colors */
    .el[data-cat="alcalin"]{background:rgba(231,76,60,.18);color:#F5B7B1}
    .el[data-cat="alcalino-terreux"]{background:rgba(230,126,34,.18);color:#F5CBA7}
    .el[data-cat="transition"]{background:rgba(52,152,219,.15);color:#AED6F1}
    .el[data-cat="pauvre"]{background:rgba(26,188,156,.15);color:#A3E4D7}
    .el[data-cat="metalloide"]{background:rgba(39,174,96,.15);color:#A9DFBF}
    .el[data-cat="non-metal"]{background:rgba(241,196,15,.15);color:#F9E79F}
    .el[data-cat="halogene"]{background:rgba(0,188,212,.15);color:#A2D9CE}
    .el[data-cat="gaz-noble"]{background:rgba(155,89,182,.15);color:#D2B4DE}
    .el[data-cat="lanthanide"]{background:rgba(233,30,140,.15);color:#F5B7B1}
    .el[data-cat="actinide"]{background:rgba(255,112,67,.15);color:#F5CBA7}

    /* ============================================================
       DETAIL PANEL (bottom sheet) — avec drag handle amélioré
       ============================================================ */
    .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;opacity:0;
      pointer-events:none;transition:opacity .3s ease;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .detail-overlay.open{opacity:1;pointer-events:auto}

    .detail-panel{position:fixed;bottom:0;left:0;right:0;z-index:101;
      background:var(--bg-surface);border-top:1px solid rgba(184,134,11,.15);
      border-radius:20px 20px 0 0;transform:translateY(100%);
      transition:transform .35s cubic-bezier(.25,1,.5,1);
      max-height:75vh;overflow-y:auto;padding:30px 16px 32px;
      padding-bottom:calc(32px + var(--safe-bottom));
      box-shadow:0 -20px 60px rgba(0,0,0,.5)}
    .detail-panel.open{transform:translateY(0)}
    .detail-panel::-webkit-scrollbar{width:3px}
    .detail-panel::-webkit-scrollbar-thumb{background:rgba(184,134,11,.2);border-radius:10px}

    /* ============================================================
       DRAG HANDLE (TRAIN) — Version améliorée
       ============================================================ */
    .detail-panel::before{content:'';position:absolute;top:10px;left:50%;
      transform:translateX(-50%);width:60px;height:6px;border-radius:3px;
      background:rgba(224,184,74,.35);cursor:grab;z-index:10;
      transition:all .25s cubic-bezier(.25,1,.5,1);
      box-shadow:0 0 12px rgba(224,184,74,.2);
      animation:handlePulse 2.5s ease-in-out infinite}

    @keyframes handlePulse{
      0%,100%{opacity:.7;transform:translateX(-50%) scaleX(1);background:rgba(224,184,74,.35)}
      50%{opacity:1;transform:translateX(-50%) scaleX(1.1);background:rgba(224,184,74,.55)}
    }

    .detail-panel:hover::before{
      background:rgba(224,184,74,.7);width:70px;height:7px;
      box-shadow:0 0 20px rgba(224,184,74,.4);animation:none
    }

    .detail-panel.dragging{transition:none;cursor:grabbing}
    .detail-panel.dragging::before{
      background:var(--accent-bright);width:80px;height:8px;
      cursor:grabbing;box-shadow:0 0 25px rgba(224,184,74,.6);animation:none
    }

    .detail-panel .drag-zone{
      position:absolute;top:0;left:0;right:0;height:40px;z-index:9;cursor:grab
    }

    .detail-panel.dragging .drag-zone{cursor:grabbing}

    .detail-panel::after{
      content:'↓ Tirer pour fermer';position:absolute;top:26px;left:50%;
      transform:translateX(-50%);font-size:9px;font-weight:600;
      color:var(--text-muted);letter-spacing:.5px;opacity:0;
      pointer-events:none;white-space:nowrap;
      animation:hintFade 3s ease-in-out 0.8s
    }

    @keyframes hintFade{
      0%,100%{opacity:0}
      20%,60%{opacity:.6}
    }

    .detail-header{display:flex;align-items:center;gap:16px;padding:20px 40px 16px 0}
    .detail-big-sym{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;
      font-size:28px;font-weight:800;font-family:'Playfair Display',serif;flex-shrink:0;
      border:1px solid rgba(255,255,255,.08)}
    .detail-info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
    .detail-nom{font-size:20px;font-weight:700;font-family:'Playfair Display',serif;color:var(--text-light)}
    .detail-cat{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
      border-radius:20px;width:fit-content;margin-top:2px}
    .detail-cat .cat-dot{width:8px;height:8px;border-radius:50%}

    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
    .detail-card{padding:14px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);
      display:flex;flex-direction:column;gap:4px}
    .detail-card .dc-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
    .detail-card .dc-value{font-size:15px;font-weight:600;color:var(--text-light)}
    .detail-card .dc-value.accent{color:var(--accent-bright);font-family:'Playfair Display',serif}
    .detail-card.wide{grid-column:1/-1}
    .detail-card .dc-value.small{font-size:13px;font-weight:500;line-height:1.5}

    .detail-close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:10px;
      border:1px solid rgba(255,255,255,.06);background:transparent;color:var(--text-dim);
      cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;
      transition:var(--transition);z-index:11}
    .detail-close:hover{color:var(--text-light);border-color:rgba(184,134,11,.15);background:rgba(184,134,11,.06)}

    .detail-nav{display:flex;gap:8px;margin-top:16px}
    .detail-nav button{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.06);
      background:var(--bg-card);color:var(--text-dim);cursor:pointer;font-size:12px;font-weight:600;
      font-family:'Inter',sans-serif;transition:var(--transition);display:flex;align-items:center;
      justify-content:center;gap:6px}
    .detail-nav button:hover{border-color:rgba(184,134,11,.15);color:var(--text-light)}
    .detail-nav button i{font-size:11px}

    /* RESPONSIVE */
    @media(max-width:768px){
      .container{padding:10px 10px 100px}
      .ptable{gap:2px;padding:8px;min-width:680px}
      .el{min-height:48px;padding:3px 2px;border-radius:5px}
      .el .el-sym{font-size:13px}
      .el .el-nom{font-size:6px}
      .el .el-z{font-size:7px}
      .el .el-masse{display:none}
      .search-row{flex-direction:column;gap:6px}
      .bac-toggle{width:100%;justify-content:center}
      .detail-header{padding:16px 36px 12px 0}
      .detail-big-sym{width:52px;height:52px;font-size:24px}
      .detail-nom{font-size:18px}
    }
    @media(max-width:480px){
      .header{padding:8px 12px;min-height:48px}
      .back-btn{width:32px;height:32px;font-size:14px}
      .page-title{font-size:12px}
      .legend-label{font-size:9px}
      .legend-item{padding:3px 5px}
    }
    @media(min-width:769px){
      .detail-panel{left:50%;right:auto;transform:translate(-50%,100%);width:420px;
        border-radius:20px 20px 0 0}
      .detail-panel.open{transform:translate(-50%,0)}
    }
    @media(prefers-reduced-motion:reduce){
      *{animation-duration:.01ms!important;transition-duration:.01ms!important}
    }
    a:focus-visible,button:focus-visible,input:focus-visible{
      outline:2px solid var(--accent);outline-offset:2px;border-radius:6px
    }
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(184,134,11,.25);border-radius:10px}
  </style>
</head>
<body>
  <div class="gradient-bg"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <header class="header">
    <div class="header-left">
      <a href="index.html" class="back-btn" id="backBtn" aria-label="Retour"><i class="fas fa-arrow-left"></i></a>
      <h1 class="page-title"><i class="fas fa-table-cells"></i> Tableau périodique</h1>
    </div>
  </header>

  <main class="container">
    <!-- SEARCH + BAC MODE -->
    <div class="search-row">
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un élément...">
      </div>
      <button class="bac-toggle" id="bacToggle">
        <i class="fas fa-star"></i> Mode BAC
      </button>
    </div>

    <!-- LEGEND -->
    <div class="legend-row" id="legendRow">
      <div class="legend-item" data-cat="alcalin">
        <span class="legend-dot" style="background:#E74C3C"></span>
        <span class="legend-label">Métaux alcalins</span>
      </div>
      <div class="legend-item" data-cat="alcalino-terreux">
        <span class="legend-dot" style="background:#E67E22"></span>
        <span class="legend-label">Métaux alcalino-terreux</span>
      </div>
      <div class="legend-item" data-cat="transition">
        <span class="legend-dot" style="background:#3498DB"></span>
        <span class="legend-label">Métaux de transition</span>
      </div>
      <div class="legend-item" data-cat="pauvre">
        <span class="legend-dot" style="background:#1ABC9C"></span>
        <span class="legend-label">Métaux pauvres</span>
      </div>
      <div class="legend-item" data-cat="metalloide">
        <span class="legend-dot" style="background:#27AE60"></span>
        <span class="legend-label">Métalloïdes</span>
      </div>
      <div class="legend-item" data-cat="non-metal">
        <span class="legend-dot" style="background:#F1C40F"></span>
        <span class="legend-label">Non-métaux</span>
      </div>
      <div class="legend-item" data-cat="halogene">
        <span class="legend-dot" style="background:#00BCD4"></span>
        <span class="legend-label">Halogènes</span>
      </div>
      <div class="legend-item" data-cat="gaz-noble">
        <span class="legend-dot" style="background:#9B59B6"></span>
        <span class="legend-label">Gaz nobles</span>
      </div>
      <div class="legend-item" data-cat="lanthanide">
        <span class="legend-dot" style="background:#E91E8C"></span>
        <span class="legend-label">Lanthanides</span>
      </div>
      <div class="legend-item" data-cat="actinide">
        <span class="legend-dot" style="background:#FF7043"></span>
        <span class="legend-label">Actinides</span>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-scroll">
      <div class="ptable" id="ptable"></div>
    </div>
  </main>

  <!-- DETAIL PANEL -->
  <div class="detail-overlay" id="detailOverlay"></div>
  <div class="detail-panel" id="detailPanel">
    <div class="drag-zone"></div>
    <button class="detail-close" id="detailClose"><i class="fas fa-xmark"></i></button>
    <div id="detailContent"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
  </script>

  <script type="module">
  // ================================================================
  // TABLEAU PÉRIODIQUE — Version robuste anti-flash
  // ================================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import {
    initializeFirestore,
    persistentLocalCache,
    persistentSingleTabManager,
    doc,
    getDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  // ================================================================
  // CONFIG FIREBASE
  // ================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
    authDomain: "arvexa-fbf10.firebaseapp.com",
    projectId: "arvexa-fbf10",
    storageBucket: "arvexa-fbf10.firebasestorage.app",
    messagingSenderId: "920108330053",
    appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const db = initializeFirestore(app, {
    localCache: persistentLocalCache({
      tabManager: persistentSingleTabManager()
    })
  });

  try {
    await setPersistence(auth, browserLocalPersistence);
  } catch (e) {}

  // ================================================================
  // SESSION / CACHE
  // ================================================================
  const SESSION_KEY = 'arvexa_session';
  const USER_DATA_KEY = 'arvexa_user_data';
  const LAST_UID_KEY = 'arvexa_last_uid';

  function saveSession(user) {
    if (!user) return;
    try {
      const data = {
        uid: user.uid,
        email: user.email,
        lastActive: Date.now()
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(data));
      localStorage.setItem(LAST_UID_KEY, user.uid);
    } catch (e) {}
  }

  function clearSession() {
    try {
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(USER_DATA_KEY);
      localStorage.removeItem(LAST_UID_KEY);
      sessionStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  // ================================================================
  // DONNÉES — 118 ÉLÉMENTS

    {z:95,s:"Am",n:"Américium",m:"243,0",c:"actinide",en:1.3,e:"solide",cf:"[Rn] 5f⁷ 7s²",ox:"+6, +5, +3",b:false,gc:9,gr:10},
    {z:96,s:"Cm",n:"Curium",m:"247,0",c:"actinide",en:1.3,e:"solide",cf:"[Rn] 5f⁷ 6d¹ 7s²",ox:"+4, +3",b:false,gc:10,gr:10},
    {z:97,s:"Bk",n:"Berkélium",m:"247,0",c:"actinide",en:1.3,e:"solide",cf:"[Rn] 5f⁹ 7s²",ox:"+4, +3",b:false,gc:11,gr:10},
    {z:98,s:"Cf",n:"Californium",m:"251,0",c:"actinide",en:1.3,e:"solide",cf:"[Rn] 5f¹⁰ 7s²",ox:"+4, +3",b:false,gc:12,gr:10},
    {z:99,s:"Es",n:"Einsteinium",m:"252,0",c:"actinide",en:1.3,e:"solide",cf:"[Rn] 5f¹¹ 7s²",ox:"+3",b:false,gc:13,gr:10},
    {z:100,s:"Fm",n:"Fermium",m:"257,0",c:"actinide",en:1.3,e:"solide",cf:"[Rn] 5f¹² 7s²",ox:"+3",b:false,gc:14,gr:10},
    {z:101,s:"Md",n:"Mendélévium",m:"258,0",c:"actinide",en:1.3,e:"solide",cf:"[Rn] 5f¹³ 7s²",ox:"+3",b:false,gc:15,gr:10},
    {z:102,s:"No",n:"Nobélium",m:"259,0",c:"actinide",en:1.3,e:"solide",cf:"[Rn] 5f¹⁴ 7s²",ox:"+3",b:false,gc:16,gr:10},
    {z:103,s:"Lr",n:"Lawrencium",m:"266,0",c:"actinide",en:1.3,e:"solide",cf:"[Rn] 5f¹⁴ 7s² 7p¹",ox:"+3",b:false,gc:17,gr:10}
  ];

  const CAT_INFO = {
    'alcalin': { nom: 'Métaux alcalins', couleur: '#E74C3C' },
    'alcalino-terreux': { nom: 'Métaux alcalino-terreux', couleur: '#E67E22' },
    'transition': { nom: 'Métaux de transition', couleur: '#3498DB' },
    'pauvre': { nom: 'Métaux pauvres', couleur: '#1ABC9C' },
    'metalloide': { nom: 'Métalloïdes', couleur: '#27AE60' },
    'non-metal': { nom: 'Non-métaux', couleur: '#F1C40F' },
    'halogene': { nom: 'Halogènes', couleur: '#00BCD4' },
    'gaz-noble': { nom: 'Gaz nobles', couleur: '#9B59B6' },
    'lanthanide': { nom: 'Lanthanides', couleur: '#E91E8C' },
    'actinide': { nom: 'Actinides', couleur: '#FF7043' }
  };

  const ETAT_LABELS = { solide: 'Solide', liquide: 'Liquide', gaz: 'Gaz' };

  // ================================================================
  // ÉTAT
  // ================================================================
  let bacMode = false;
  let currentEl = null;
  let activeCatFilter = null;
  let currentUid = null;
  let isRedirecting = false;
  let isAuthResolved = false;
  let graceTimer = null;
  let maxTimer = null;

  // ================================================================
  // DOM
  // ================================================================
  const ptable = document.getElementById('ptable');
  const detailPanel = document.getElementById('detailPanel');
  const detailOverlay = document.getElementById('detailOverlay');
  const detailContent = document.getElementById('detailContent');
  const detailClose = document.getElementById('detailClose');
  const searchInput = document.getElementById('searchInput');
  const bacToggle = document.getElementById('bacToggle');

  // ================================================================
  // RENDER TABLE
  // ================================================================
  function renderTable() {
    let html = '<div class="la-ac-label">57-71</div><div class="la-ac-label">89-103</div>';
    ELEMENTS.forEach((el) => {
      html += `<div class="el" data-cat="${el.c}" data-z="${el.z}" data-bac="${el.b}"
        style="grid-column:${el.gc};grid-row:${el.gr}"
        onclick="window.openDetail(${el.z})">
        <span class="el-z">${el.z}</span>
        <span class="el-sym">${el.s}</span>
        <span class="el-nom">${el.n}</span>
        <span class="el-masse">${el.m}</span>
      </div>`;
    });
    ptable.innerHTML = html;
  }

  // ================================================================
  // SEARCH
  // ================================================================
  searchInput.addEventListener('input', function() {
    const q = this.value.trim().toLowerCase();
    document.querySelectorAll('.el').forEach(cell => {
      const z = cell.dataset.z;
      const el = ELEMENTS.find(e => e.z == z);
      if (!el) return;
      if (!q) {
        cell.classList.remove('search-hidden');
        return;
      }
      const match = el.s.toLowerCase().includes(q) ||
                    el.n.toLowerCase().includes(q) ||
                    el.z.toString().includes(q);
      cell.classList.toggle('search-hidden', !match);
    });
  });

  // ================================================================
  // BAC MODE
  // ================================================================
  bacToggle.addEventListener('click', () => {
    bacMode = !bacMode;
    bacToggle.classList.toggle('active', bacMode);
    document.querySelectorAll('.el').forEach(cell => {
      const isBac = cell.dataset.bac === 'true';
      cell.classList.toggle('bac-mode-dim', bacMode && !isBac);
      cell.classList.toggle('bac-highlight', bacMode && isBac);
    });
    document.querySelectorAll('.legend-item').forEach(item => {
      item.classList.toggle('dimmed', bacMode);
    });
  });

  // ================================================================
  // LEGEND FILTER
  // ================================================================
  document.querySelectorAll('.legend-item').forEach(item => {
    item.addEventListener('click', () => {
      const cat = item.dataset.cat;
      if (activeCatFilter === cat) {
        activeCatFilter = null;
        document.querySelectorAll('.el').forEach(c => c.classList.remove('search-hidden'));
        document.querySelectorAll('.legend-item').forEach(l => l.classList.remove('dimmed'));
      } else {
        activeCatFilter = cat;
        document.querySelectorAll('.legend-item').forEach(l => l.classList.toggle('dimmed', l.dataset.cat !== cat));
        document.querySelectorAll('.el').forEach(c => {
          c.classList.toggle('search-hidden', c.dataset.cat !== cat);
        });
      }
      searchInput.value = '';
    });
  });

  // ================================================================
  // DETAIL PANEL
  // ================================================================
  window.openDetail = function(z) {
    const el = ELEMENTS.find(e => e.z === z);
    if (!el) return;
    currentEl = el;

    const cat = CAT_INFO[el.c] || { nom: 'Inconnu', couleur: '#607D8B' };
    const enText = el.en !== null ? el.en.toFixed(2).replace('.', ',') : '—';
    const etatIcon = el.e === 'gaz' ? 'fa-wind' : el.e === 'liquide' ? 'fa-droplet' : 'fa-cube';

    detailContent.innerHTML = `
      <div class="detail-header">
        <div class="detail-big-sym" style="background:${cat.couleur}22;color:${cat.couleur};border-color:${cat.couleur}33">${el.s}</div>
        <div class="detail-info">
          <div class="detail-nom">${el.n}</div>
          <div class="detail-cat" style="background:${cat.couleur}18;color:${cat.couleur}">
            <span class="cat-dot" style="background:${cat.couleur}"></span>
            ${cat.nom}
          </div>
        </div>
      </div>
      <div class="detail-grid">
        <div class="detail-card">
          <span class="dc-label">Numéro atomique (Z)</span>
          <span class="dc-value accent">${el.z}</span>
        </div>
        <div class="detail-card">
          <span class="dc-label">Masse molaire</span>
          <span class="dc-value">${el.m} g/mol</span>
        </div>
        <div class="detail-card">
          <span class="dc-label">Électronégativité</span>
          <span class="dc-value">${enText}</span>
        </div>
        <div class="detail-card">
          <span class="dc-label">État physique</span>
          <span class="dc-value"><i class="fas ${etatIcon}" style="margin-right:6px;opacity:.6"></i>${ETAT_LABELS[el.e] || el.e}</span>
        </div>
        <div class="detail-card wide">
          <span class="dc-label">Configuration électronique</span>
          <span class="dc-value small" style="font-family:'Playfair Display',serif;color:var(--accent-bright)">${el.cf}</span>
        </div>
        <div class="detail-card">
          <span class="dc-label">Oxydation courante</span>
          <span class="dc-value small">${el.ox}</span>
        </div>
        <div class="detail-card">
          <span class="dc-label">Position</span>
          <span class="dc-value small">Période ${el.gr <= 7 ? el.gr : (el.gr === 9 ? '6' : '7')} · Groupe ${el.gc}</span>
        </div>
      </div>
      <div class="detail-nav">
        <button onclick="window.navElement(-1)"><i class="fas fa-chevron-left"></i> Précédent</button>
        <button onclick="window.navElement(1)">Suivant <i class="fas fa-chevron-right"></i></button>
      </div>
    `;

    detailOverlay.classList.add('open');
    detailPanel.classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  window.closeDetail = function() {
    detailPanel.classList.remove('open');
    detailOverlay.classList.remove('open');
    document.body.style.overflow = '';
  };

  window.navElement = function(dir) {
    if (!currentEl) return;
    const sorted = ELEMENTS.filter(e => e.z < 104).sort((a,b) => a.z - b.z);
    const idx = sorted.findIndex(e => e.z === currentEl.z);
    const newIdx = idx + dir;
    if (newIdx >= 0 && newIdx < sorted.length) {
      window.openDetail(sorted[newIdx].z);
    }
  };

  // Close button
  detailClose.addEventListener('click', window.closeDetail);
  detailOverlay.addEventListener('click', window.closeDetail);

  // Keyboard nav
  document.addEventListener('keydown', (e) => {
    if (!currentEl) return;
    if (e.key === 'Escape') window.closeDetail();
    if (e.key === 'ArrowLeft') window.navElement(-1);
    if (e.key === 'ArrowRight') window.navElement(1);
  });

  // ================================================================
  // SWIPE TO CLOSE (drag handle amélioré)
  // ================================================================
  function setupSwipeToClose() {
    let startY = 0;
    let currentY = 0;
    let isDragging = false;
    let startTime = 0;

    // ---- Support tactile (mobile) ----
    detailPanel.addEventListener('touchstart', (e) => {
      const rect = detailPanel.getBoundingClientRect();
      const touchY = e.touches[0].clientY;

      // Zone tactile élargie : 120px au lieu de 80px
      if (touchY - rect.top < 120) {
        startY = touchY;
        currentY = touchY;
        startTime = Date.now();
        isDragging = true;
        detailPanel.classList.add('dragging');
        if (navigator.vibrate) navigator.vibrate(5);
      }
    }, { passive: true });

    detailPanel.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      currentY = e.touches[0].clientY;
      const diff = currentY - startY;

      if (diff > 0) {
        detailPanel.style.transform = `translateY(${diff}px)`;

        // Réduire l'opacité de l'overlay
        const opacity = Math.max(0.1, 1 - diff / 400);
        detailOverlay.style.background = `rgba(0,0,0,${0.75 * opacity})`;

        e.preventDefault();
      }
    }, { passive: false });

    detailPanel.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      detailPanel.classList.remove('dragging');

      const diff = currentY - startY;
      const duration = Date.now() - startTime;
      const velocity = diff / duration;

      detailOverlay.style.background = '';

      if (diff > 100 || (velocity > 0.5 && diff > 30)) {
        // Fermeture
        detailPanel.style.transition = 'transform 0.3s cubic-bezier(0.25,1,0.5,1)';
        detailPanel.style.transform = `translateY(100%)`;

        setTimeout(() => {
          detailPanel.classList.remove('open');
          detailOverlay.classList.remove('open');
          detailPanel.style.transform = '';
          detailPanel.style.transition = '';
          document.body.style.overflow = '';
        }, 300);
      } else {
        // Rebond
        detailPanel.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
        detailPanel.style.transform = '';
        setTimeout(() => { detailPanel.style.transition = ''; }, 400);
      }

      startY = 0;
      currentY = 0;
    }, { passive: true });

    detailPanel.addEventListener('touchcancel', () => {
      if (!isDragging) return;
      isDragging = false;
      detailPanel.classList.remove('dragging');
      detailPanel.style.transform = '';
      detailOverlay.style.background = '';
    }, { passive: true });

    // ---- Support souris (desktop) ----
    let mouseDownY = 0;
    let isMouseDragging = false;

    detailPanel.addEventListener('mousedown', (e) => {
      const rect = detailPanel.getBoundingClientRect();
      if (e.clientY - rect.top < 40) {
        mouseDownY = e.clientY;
        isMouseDragging = true;
        detailPanel.classList.add('dragging');
        detailPanel.style.cursor = 'grabbing';
        e.preventDefault();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!isMouseDragging) return;
      const diff = e.clientY - mouseDownY;
      if (diff > 0) {
        detailPanel.style.transition = 'none';
        detailPanel.style.transform = `translateY(${diff}px)`;

        const opacity = Math.max(0.1, 1 - diff / 400);
        detailOverlay.style.background = `rgba(0,0,0,${0.75 * opacity})`;
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (!isMouseDragging) return;
      isMouseDragging = false;
      detailPanel.classList.remove('dragging');
      detailPanel.style.cursor = '';

      const diff = e.clientY - mouseDownY;
      detailPanel.style.transition = 'transform 0.3s cubic-bezier(0.25,1,0.5,1)';
      detailOverlay.style.background = '';

      if (diff > 100) {
        detailPanel.style.transform = `translateY(100%)`;
        setTimeout(() => {
          detailPanel.classList.remove('open');
          detailOverlay.classList.remove('open');
          detailPanel.style.transform = '';
          detailPanel.style.transition = '';
          document.body.style.overflow = '';
        }, 300);
      } else {
        detailPanel.style.transform = '';
        setTimeout(() => { detailPanel.style.transition = ''; }, 300);
      }
      mouseDownY = 0;
    });
  }

  // ================================================================
  // AUTH ROBUSTE — Anti-flash
  // ================================================================
  function redirectToLogin() {
    if (isRedirecting) return;
    isRedirecting = true;
    try {
      sessionStorage.setItem('redirectAfterLogin', window.location.pathname);
    } catch (e) {}
    window.location.replace('login.html');
  }

  function initAuthGuard(onAuthenticated) {
    auth.onAuthStateChanged((user) => {
      if (isAuthResolved) {
        if (user && user.uid !== currentUid) {
          currentUid = user.uid;
          saveSession(user);
          onAuthenticated(user);
        } else if (!user && currentUid) {
          currentUid = null;
          clearSession();
          redirectToLogin();
        }
        return;
      }

      if (!user) {
        if (graceTimer) clearTimeout(graceTimer);
        graceTimer = setTimeout(() => {
          if (isAuthResolved) return;
          if (auth.currentUser) return;

          const hasSession = localStorage.getItem(SESSION_KEY);
          const hasUserData = localStorage.getItem(USER_DATA_KEY);

          if ((hasSession || hasUserData) && !navigator.onLine) {
            setTimeout(() => {
              if (auth.currentUser) return;
              if (!isAuthResolved) redirectToLogin();
            }, 1500);
            return;
          }

          if (hasSession && hasUserData) {
            setTimeout(() => {
              if (auth.currentUser) return;
              if (!isAuthResolved) redirectToLogin();
            }, 1500);
            return;
          }

          redirectToLogin();
        }, 600);
        return;
      }

      if (graceTimer) { clearTimeout(graceTimer); graceTimer = null; }
      if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }

      isAuthResolved = true;
      currentUid = user.uid;
      saveSession(user);
      onAuthenticated(user);
    });

    maxTimer = setTimeout(() => {
      if (isAuthResolved) return;
      if (auth.currentUser) {
        isAuthResolved = true;
        currentUid = auth.currentUser.uid;
        saveSession(auth.currentUser);
        onAuthenticated(auth.currentUser);
      } else {
        redirectToLogin();
      }
    }, 5000);
  }

  // ================================================================
  // LANCER LA PROTECTION
  // ================================================================
  initAuthGuard(async (user) => {
    renderTable();
    setupSwipeToClose();
  });

  console.log('🚀 ARVEXA — Tableau périodique (avec session robuste)');
  </script>
